[FREELOADER]
DefaultOS=ReactOS_Arm64_MP
TimeOut=0
; Freeldr's own [FLDR] boot-phase stamps (winldr.c) on the PL011 serial —
; same channel as boot/bootdata/livecd.ini; see tools/boot_phase_report.py.
Debug=DEBUGPORT=COM1 BAUDRATE=115200

[Display]
TitleText=ReactOS ARM64
MinimalUI=Yes

[Operating Systems]
ReactOS_Arm64_UP="ReactOS ARM64"
ReactOS_Arm64_MP="ReactOS ARM64 SMP kernel"

[ReactOS_Arm64_UP]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT /RDPATH=\ramdisk.img

; SMP bring-up entry, the arm64 twin of livecd.ini's [LiveCD_SMP]: boots the MP
; PAIR — ntkrnlmp.exe + halmp.dll (hal-rust's `smp` feature) — off the same media
; the UP entry uses. mkramdisk.sh stages both flavors of both binaries on EVERY
; build, so this is a boot-entry pick, not a rebuild.
;
; NAMING THE HAL IS LOAD-BEARING. Booting ntkrnlmp.exe on the UP hal.dll is a
; real trap and arm64 is the arch that cannot catch it: there is no
; MISMATCHED_HAL handshake here, so it boots to a full desktop and silently runs
; on ONE cpu, because HalStartNextProcessor is the FALSE stub. x86 at least
; bugchecks 0x79. That trap cost a debug round already (smp-bringup-quest.md M5c).
;
; The entry names are deliberately the SAME LENGTH: flipping DefaultOS= between
; them is an equal-length in-place poke into a copy of boot.img, which is how
; vm.smp_selected_iso boot-selects the MP pair on all three arches without
; rebuilding media. Renaming one without the other breaks that — keep them equal.
;
; THIS IS NOW THE DEFAULT (2026-09-12) -- see boot/bootdata/livecd.ini for the
; full rationale and the measured rates. arm64 carries the highest known MP boot
; failure rate of the three (22/1375 = 1.60% over rows with mp_kernel true; see
; boot/bootdata/livecd.ini for why that filter matters -- task #39: a zero-PC
; EL1 instruction
; abort), and it is promoted anyway: the signature is registered in
; triage.KNOWN_FLAKES so the gate retries that one failure and blocks on
; everything else, and fleet-wide use is now the experiment. Soaking re-measured
; the same rate for months without moving it.
;
; [ReactOS_Arm64_UP] still ships and still boots the UP pair; it is the opt-out.
[ReactOS_Arm64_MP]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/KERNEL=ntkrnlmp.exe /HAL=halmp.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /MININT /RDPATH=\ramdisk.img
