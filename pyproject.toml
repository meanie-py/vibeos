[project]
name = "reactos-tests"
version = "0.1.0"
# The project venv is 3.10 (was declared 3.12, which would block `pip install`
# on the actual interpreter the smoke harness runs under).
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Everything the QEMU smoke harness needs. Install with:
#   pip install -e '.[qemu]'
# Pillow converts QMP screendump PPMs → PNG; without it screenshots fall back
# to raw .ppm (and the boot-failure screenshot can't be saved as PNG). NOT
# optional in practice — every screenshot test and the failure-diagnosis path
# uses it. (Do not substitute ImageMagick `convert`: it mangles uniform-color
# PPMs to 1-bit colormap PNGs that render solid black.)
qemu = ["pytest>=8.0", "pytest-timeout>=2.2", "pytest-xdist>=3.8,<4", "pillow>=10.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests/qemu"]
timeout = 300
markers = [
    "slow: control whose scanner builds a whole-workspace summary (~50s/run)",
]

# --- dev tooling for the vibeos-cli tool surface ---------------------------
# Covers the cli package (tests/qemu/cli) + the standalone tools/*.py scripts.
# tools/rustconv carries its OWN [tool.ruff]/[tool.pyright] (installable
# sub-package); ruff/pyright discover the nearest config per file, so this block
# does NOT govern it. Policy is kept identical so `vibeos-cli check-tooling`
# lints the whole surface under one standard.
[tool.ruff]
line-length = 100
target-version = "py310"
# Keep a stray repo-root `ruff check .` from sweeping the build trees / source.
extend-exclude = [
    "build-*", "ntoskrnl", "sdk", "win32ss", "hal", "drivers", "dll", "base",
    "boot", "modules", "ports", "subsystems", "host-tools", "*.responses*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # call in arg default — used deliberately (Path/None patterns)
    "SIM105", # contextlib.suppress over try/except/pass — try/except reads clearer
    "SIM108", # if-else over ternary — explicit blocks read clearer here
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode — we use →/—/✓ on purpose
]

[tool.pyright]
include = ["tests/qemu/cli"]
exclude = ["**/node_modules", "**/__pycache__"]
# `tools/` is not a package and is not on sys.path at import time -- land.py reaches
# `docs_only` through a sys.path.insert, because the pre-push HOOK has to import the same
# predicate from a bare clone where nothing is installed. Telling pyright where to look
# beats silencing the import at the call site: a `# type: ignore` there would also hide a
# genuine typo in the module name.
extraPaths = ["tools"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
