# icuuc-rust — icuuc.dll's ucnv_* converters over Win32 code pages; see src/lib.rs.
[package]
name = "icuuc-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "icuuc_rust"
path = "src/lib.rs"
# rlib too: the engine's host tests (`cargo test -p icuuc-rust --lib`) need it.
crate-type = ["staticlib", "rlib"]

# Windows-only: its `.drectve` asm does not assemble on the Linux host the tests run on.
[target.'cfg(windows)'.dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
