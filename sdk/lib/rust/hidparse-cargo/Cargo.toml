# Cargo-driven `hidparse.sys` link (i386 + amd64 + arm64). Replaces the cmake
# `add_library(hidparse MODULE rust_cohab_stub.c …)` cohab — the Rust body
# (hidparse-rust) IS the driver; reactos-link drives the final PE link.

[package]
name = "hidparse-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hidparse"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
