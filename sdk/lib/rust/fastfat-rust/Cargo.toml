# fastfat-rust — Rust translation of drivers/filesystems/fastfat (the FAT
# filesystem .sys; MS-architecture, 35 .c / 68.8K LOC). DeepSeek mechanical +
# c2rust-anchored translate. WDM kernelmode FS driver, DriverEntry-only.
# ntkrnl-sys + crate::types (gen_driver_types.sh, 53 private structs) substrate.
[package]
name = "fastfat-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastfat_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }

# fastfat builds at _WIN32_WINNT=0x502 (NTDDI WS03, the ReactOS default), so every
# `#if (NTDDI_VERSION >= NTDDI_VISTA / WIN7 / WIN8 / WINTHRESHOLD)` block is compiled out of
# the C. Their Rust translations sit behind these cfgs, which nothing sets. It matters: before
# WIN8 the FCB layout differs (OPLOCK lives in Specific.Fcb, and a DCB has no oplock at all),
# so running the WIN8 code reads and writes DCB fields.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ntddi_ge_ntddi_vista)', 'cfg(ntddi_ge_ntddi_win7)', 'cfg(ntddi_ge_ntddi_win8)',
    'cfg(ntddi_ge_ntddi_winthreshold)',
    # `#if DBG` (checked build) and the C's _ALPHA_ arms: never set, as in a free x86/ARM build.
    'cfg(DBG)', 'cfg(target_arch, values("alpha"))',
    # `#ifndef __REACTOS__`: __REACTOS__ is always defined, so this is never set.
    'cfg(not_reactos)',
] }

# The C's optional build switches, none of which this tree defines: BUILD_WOW64_ENABLED
# (`_WIN64 && BUILD_WOW64_ENABLED` thunking) and FASTFATDBG (fatdata.h debug state).
[features]
wow64 = []
BUILD_WOW64_ENABLED = []
FASTFATDBG = []
