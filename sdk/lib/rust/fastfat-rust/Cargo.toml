# fastfat-rust — Rust translation of drivers/filesystems/fastfat (the FAT
# filesystem .sys; MS-architecture, 35 .c / 68.8K LOC). DeepSeek mechanical +
# c2rust-anchored translate. WDM kernelmode FS driver, DriverEntry-only.
# ntkrnl-sys + crate::types (gen_driver_types.sh, 53 private structs) substrate.
[package]
name = "fastfat-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastfat_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }

# fastfat builds for NTDDI < WIN8 (the ReactOS default), so the C's
# `#if (NTDDI_VERSION >= NTDDI_WIN8)` blocks are compiled out. Their Rust translations sit
# behind this cfg, which nothing sets: pre-WIN8 the FCB layout differs (OPLOCK lives in
# Specific.Fcb, and a DCB has no oplock at all), so running them reads and writes DCB fields.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ntddi_ge_ntddi_win8)'] }
