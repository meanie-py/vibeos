[package]
name = "rtl-error"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/error.c — the NTSTATUS->DOS Win32 error
# mapping (RtlNtStatusToDosError[NoTeb]) + last-error/last-status TEB
# accessors + thread error-mode. The giant status->code tables reference
# ~665 winerror.h ERROR_*/SEC_*/RPC_* constants; those are extracted
# deterministically into src/winerr.rs by tools/gen_winerror_consts.py
# (NOT by the LLM). Shared kernel+user via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
