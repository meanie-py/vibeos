# Cargo-driven link of the 95 keyboard layout DLLs (dll/keyboard): one FAMILY cell.
# Every layout is one bin over the same empty main.rs; build.rs links each against the
# one body, kbdlayouts-rust, which cargo builds once. The bin list must equal the
# layout list in dll/keyboard/CMakeLists.txt (add_cargo_module BINS checks it).

[package]
name = "kbdlayouts-cargo"
version = "0.1.0"
edition = "2021"
autobins = false

[build-dependencies]
reactos-link = { path = "../reactos-link" }

[[bin]]
name = "kbd101"
path = "src/main.rs"

