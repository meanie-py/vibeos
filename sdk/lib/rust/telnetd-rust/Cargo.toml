# telnetd-rust — see src/lib.rs for the module map.
[package]
name = "telnetd-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "telnetd_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
winedebug-rust = { path = "../winedebug-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
