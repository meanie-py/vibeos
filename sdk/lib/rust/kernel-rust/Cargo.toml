[package]
name = "kernel-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
# sync-instrumentation §4: pushlock self-deadlock detector (Tier-2 opt-in via
# -DVIBEOS_LOCKDEP=ON → ntoskrnl-cargo/ntkrnlmp-cargo build.rs → rust_features).
lockdep = ["ntoskrnl-rust/lockdep"]
# cswitchdep-design.md: context-switch verifier (-DVIBEOS_CSWITCHDEP=ON).
cswitchdep = ["ntoskrnl-rust/cswitchdep"]

[dependencies]
ntoskrnl-rust = { path = "../ntoskrnl-rust" }
lpc-rust = { path = "../lpc-rust" }
fsrtl-rust = { path = "../fsrtl-rust" }
dbgk-rust = { path = "../dbgk-rust" }
wmi-rust = { path = "../wmi-rust" }
cc-rust = { path = "../cc-rust" }
iomgr-rust = { path = "../iomgr-rust" }
kdbg-rust = { path = "../kdbg-rust" }
fstub-rust = { path = "../fstub-rust" }
se-rust = { path = "../se-rust" }
pnpmgr-rust = { path = "../pnpmgr-rust" }
cmboot-rust = { path = "../cmboot-rust" }
ntprintf = { path = "../ntprintf" }
ntprintf_w = { path = "../ntprintf_w" }
ke-inlines = { path = "../ke-inlines" }
ke-macros = { path = "../ke-macros" }
