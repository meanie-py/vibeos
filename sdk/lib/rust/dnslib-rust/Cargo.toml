# dnslib-rust — Rust translation of sdk/lib/dnslib (DNS message/address helper lib
# consumed by dnsapi.dll). DeepSeek mechanical translate, deepdrive-ground.
[package]
name = "dnslib-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "dnslib_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
