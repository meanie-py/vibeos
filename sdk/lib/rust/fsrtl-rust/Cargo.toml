# fsrtl-rust — the File System Run-Time Library (FsRtl*), extracted from
# ntoskrnl-rust into its own rlib so it type-checks/codegens/caches independently
# of the ~450K-LOC kernel monolith (crate-split — see
# docs/engineering/ntoskrnl-crate-split-plan.md). Pure FsRtl logic on the
# ntkrnl-sys FFI substrate — zero deps on the rest of ntoskrnl-rust. Its objects
# bundle into libkernel_rust.a via `extern crate fsrtl_rust` in the kernel-rust
# umbrella (a Cargo dep alone would compile the rlib but drop its #[no_mangle]
# symbols — same pattern as lpc-rust / cmboot-rust).
[package]
name = "fsrtl-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
