# rtl-heappage — Rust translation of sdk/lib/rtl/heappage.c (page heap / debug heap).
# DeepSeek-banked Opus translation, deepdrive-ground. Compiles into librtl.
[package]
name = "rtl-heappage"
version = "0.1.0"
edition = "2021"
[lib]
path = "src/lib.rs"
[features]
cabi = []
kernel = ["cabi"]
[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
