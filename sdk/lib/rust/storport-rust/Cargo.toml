[package]
name = "storport-rust"
version = "0.1.0"
edition = "2021"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
# C-variadic entry points -> drivers/storage/port/storport/rust_varargs_shim.c (stable
# Rust cannot DEFINE one, nor va_arg); VaArgs reads the va_list it hands over.
varargs-rust = { path = "../varargs-rust" }
