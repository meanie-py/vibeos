# Cargo-driven `disk.sys` link, generated by tools/cargo_cell_gen.py.

[package]
name = "disk-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "disk"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
