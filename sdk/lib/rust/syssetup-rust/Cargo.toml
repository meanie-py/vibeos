# syssetup-rust — see src/lib.rs for the module map.
[package]
name = "syssetup-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "syssetup_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
va-slots-rust = { path = "../va-slots-rust" }
ntdll-sys = { path = "../ntdll-sys" }
strsafe-rust = { path = "../strsafe-rust" }
win32macros-rust = { path = "../win32macros-rust" }
