# comctl32-rust — see src/lib.rs for the module map.
[package]
name = "comctl32-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "comctl32_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
winedebug-rust = { path = "../winedebug-rust" }
strsafe-rust = { path = "../strsafe-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
winelist-rust = { path = "../winelist-rust" }
win32macros-rust = { path = "../win32macros-rust" }

# `#ifndef __REACTOS__`: __REACTOS__ is always defined, so this is never set.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(not_reactos)'] }
