# rtl-sync — Rust translation of the ReactOS RTL synchronization cluster:
#   sdk/lib/rtl/critical.c   (RTL critical sections — RtlEnter/LeaveCriticalSection, keyed events)
#   sdk/lib/rtl/wait.c       (RtlRegisterWait / RtlDeregisterWait thread-pool waits)
#   sdk/lib/rtl/srw.c        (slim reader/writer locks — RtlAcquireSRWLock*)        [rtl_vista]
#   sdk/lib/rtl/condvar.c    (condition variables — RtlSleep/WakeConditionVariable) [rtl_vista]
#   sdk/lib/rtl/runonce.c    (RtlRunOnce* one-time init)                            [rtl_vista]
#
# critical.c + wait.c compile into librtl.a (the `rtl` cmake target, links
# librtl_rust.a already). srw/condvar/runonce are in librtl_vista.a which needs
# the librtl_rust link path added (one-time plumbing owned by this lane).
[package]
name = "rtl-sync"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
# The #[no_mangle] extern "system" shim layer (the kernel/ntdll link surface).
cabi = []
kernel = ["cabi"]
# ntoskrnl: THIS copy runs in the kernel. Not `kernel`, which only names the export surface and
# which ntdll gets too (rtl-rust's default features), so a `not(feature = "kernel")` user-mode
# path never reached a shipping ntdll: srw.rs's backoff and its keyed-event wait were host-only.
ntoskrnl = ["kernel"]
# vista: the standalone ntdll_vista.dll forwarder link surface — only
# srw/condvar/runonce/locale (+ shared/atomics). critical/wait are NOT compiled;
# condvar's RtlEnter/LeaveCriticalSection resolve as ntdll.dll imports (matches
# the old condvar.c extern behaviour in librtl_vista.a). Replaces the 4 C files.
vista = []

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
