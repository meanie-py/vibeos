# Cargo-driven `pcix.sys` link, generated by tools/cargo_cell_gen.py.

[package]
name = "pcix-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pcix"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
