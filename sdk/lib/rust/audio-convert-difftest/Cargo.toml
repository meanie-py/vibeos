# Differential harness: the PCM converters (PerformChannelConversion,
# PerformQualityConversion) that kmixer.sys and wdmaud.drv each carry a copy of,
# as shipped in kmixer-rust / wdmaud_drv-rust vs the genuine pin.c / mixer.c, all
# compiled for the host. Host crate (std, `cargo test`, no QEMU).
[package]
name = "audio-convert-difftest"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
cc = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
