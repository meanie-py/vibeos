[package]
name = "win32k-rust"
version = "0.1.0"
edition = "2021"
# src/main.rs is the ntuser main.c translation (a module), NOT a binary entry
# point — disable Cargo's auto-bin discovery so it isn't built as a `bin`.
autobins = false

[lib]
crate-type = ["rlib"]

[dependencies]
win32macros-rust = { path = "../win32macros-rust" }
win32k-sys = { path = "../win32k-sys" }
ntkrnl-sys = { path = "../ntkrnl-sys" }
ntprintf = { path = "../ntprintf" }
ntprintf_w = { path = "../ntprintf_w" }

[features]
default = []
