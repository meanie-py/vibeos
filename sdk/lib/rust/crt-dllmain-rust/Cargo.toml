# crt-dllmain-rust — the overridable default DllMain (startup/dllmain.c).
#
# Its OWN staticlib (not crt-startup-rust) so a consumer DLL that defines its own DllMain
# wins at link: crt-startup-rust's __DllMainCRTStartup calls DllMain via an extern symbol,
# the consumer's (linked first) satisfies it, and this default is the fallback (absorbed by
# --allow-multiple-definition, lld first-match), mirroring the C archive's lazy dllmain.o
# pull. Nothing else crt-startup-rust always references may live here, or every DLL pulls
# this object and its DllMain with it: the default DllEntryPoint moved to crt-startup-rust
# for exactly that reason (shell32, 2026-10-04).

[package]
name = "crt-dllmain-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
