# strsafe-rust — sdk/include/psdk/strsafe.h, ported once. See src/lib.rs for why.
[package]
name = "strsafe-rust"
version = "0.1.0"
edition = "2021"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
# rlib: consumers are staticlib crates that pull this in as a path dependency, the
# same shape as varargs-rust/dbgprint-rust. The `#[no_mangle]` entry points reach the
# consumer's `.a` because they are exported symbols, which is what lets each module's
# rust_varargs_shim.c call the `*_v` twins.
crate-type = ["rlib"]

# No dependencies ON PURPOSE. The type basis is core primitives (see the module docs):
# a consumer's `WCHAR`/`HRESULT`/`DWORD` are transparent aliases for u16/i32/u32 in
# every island in the tree, and Rust unifies aliases structurally — so this crate can
# be shared by four modules with four different bindgen islands.
[dependencies]

[package.metadata.difftest]
# Run the known-answer #[test]s in `vibeos-cli difftest` (and so in the gate).
host-tests = true
