# cicero-rust — see src/lib.rs for the module map.
[package]
name = "cicero-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "cicero_rust"
path = "src/lib.rs"
crate-type = ["rlib"]  # linked into each CTF module's staticlib, never on its own

[dependencies]
strsafe-rust = { path = "../strsafe-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
win32macros-rust = { path = "../win32macros-rust" }
atlclasses-rust = { path = "../atlclasses-rust" }

