# Struct offset verification manifest for ntoskrnl-rust.
# Maps Rust #[repr(C)] structs to their C typedefs for offset_of verification.
#
# Each entry specifies:
#   rust_name   — Rust struct name
#   c_name      — C typedef name for sizeof() and offsetof()
#   rust_file   — Path to Rust source file (relative to src/)
#   c_source    — C header or source file containing the typedef
#                 Headers included via ntoskrnl.h need no special treatment.
#                 .c files are #included directly to pick up local typedefs.
#   field_map   — (optional) Maps Rust field names to C field names when they differ

