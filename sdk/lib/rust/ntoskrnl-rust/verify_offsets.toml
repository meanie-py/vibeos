# WNODE_HEADER in wmi/smbios.rs — SDK type, different layout than wmi/wmi.rs version.
# The wmi/wmi.rs version has HistoricalContext:ULONGLONG, smbios.rs version has
# Version+Linkage+CountLost+KernelHandle. Both are union members in C.
# Skipped — union members need separate handling.

