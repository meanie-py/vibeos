[package]
name = "ntoskrnl-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
ntprintf = { path = "../ntprintf" }
ntprintf_w = { path = "../ntprintf_w" }
# Debug-print infra (macros + dbgprint runtime), hoisted out of this crate into a
# leaf so extracted subsystems can share it without depending on ntoskrnl-rust.
dbgprint-rust = { path = "../dbgprint-rust" }

# iced-x86 dev-dep relocated to kdbg-rust with i386_dis.rs (crate-split Phase 1b) —
# it was used only by that file's #[cfg(test)] disassembler roundtrip.

[features]
# `dbg` on by default, mirroring ntkrnl-sys, because it is not a diagnostic
# switch: it carries the DBG=1 owner stamp that KI_TRACK_SPINLOCK_OWNER writes
# in ntoskrnl/include/internal/spinlock.h, and the C and Rust halves of the
# spinlock funnel MUST agree on it. The stamp used to be gated on cargo's
# `debug_assertions`, which this workspace's release profile leaves OFF — so
# KxAcquireSpinLock stamped and KeTryToAcquireSpinLockAtDpcLevel did not.
default = ["dbg"]
dbg = ["ntkrnl-sys/dbg"]
# sync-instrumentation §4 Tier-2: self-deadlock / recursive-pushlock detector.
# Non-default (has an always-on push/pop cost on every pushlock op) — enabled
# for a debug/repro build via cmake -DVIBEOS_LOCKDEP=ON. Forwards to the
# ntkrnl-sys pushlock-inline taps so both crates light up together.
lockdep = ["ntkrnl-sys/lockdep"]
# cswitchdep-design.md: context-switch hand-off verifier (Tier-2 opt-in via
# -DVIBEOS_CSWITCHDEP=ON). IMPLIES lockdep: cswitchdep reads lockdep's tables
# (return_address0 today, the held-set mirror in Phase 2), and checking against
# an absent mirror would vacuously pass — the forbidden silent degrade.
cswitchdep = ["lockdep", "ntkrnl-sys/cswitchdep"]
# CONFIG_SMP equivalent for the Rust body: compiles the multiprocessor paths
# (spinlock contention bodies, IPI, freeze, dispatcher-lock reality). Enabled
# by the ntkrnlmp-cargo link only; ntoskrnl-cargo (UP kernel) never sets it.
smp = ["ntkrnl-sys/smp"]
