[package]
name = "ntoskrnl-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
ntprintf = { path = "../ntprintf" }
ntprintf_w = { path = "../ntprintf_w" }
# Debug-print infra (macros + dbgprint runtime), hoisted out of this crate into a
# leaf so extracted subsystems can share it without depending on ntoskrnl-rust.
dbgprint-rust = { path = "../dbgprint-rust" }

[dev-dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "intel", "gas"] }

[features]
default = []
# sync-instrumentation §4 Tier-2: self-deadlock / recursive-pushlock detector.
# Non-default (has an always-on push/pop cost on every pushlock op) — enabled
# for a debug/repro build via cmake -DVIBEOS_LOCKDEP=ON. Forwards to the
# ntkrnl-sys pushlock-inline taps so both crates light up together.
lockdep = ["ntkrnl-sys/lockdep"]
