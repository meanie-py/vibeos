[package]
name = "ntoskrnl-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
ntprintf = { path = "../ntprintf" }
ntprintf_w = { path = "../ntprintf_w" }

[dev-dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "intel", "gas"] }

[features]
default = []
