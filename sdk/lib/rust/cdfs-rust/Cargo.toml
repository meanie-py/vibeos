# cdfs-rust — Rust translation of drivers/filesystems/cdfs (ISO9660 filesystem .sys).
# DeepSeek mechanical translate, deepdrive-ground. ntkrnl-sys + driver_ddk substrate.
[package]
name = "cdfs-rust"
version = "0.1.0"
edition = "2021"
[lib]
name = "cdfs_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]
[features]
# CDFS_TELEMETRY_DATA is declared so a misspelled gate warns and is never enabled, as in
# the C build (cddata.h's `#ifdef`, which no ReactOS build defines). ntddi_win8 gates only
# FileFsSectorSizeInformation here, which Windows' CDFS answers and ntoskrnl now backs with
# FsRtlGetSectorSizeInformation, so it is on.
CDFS_TELEMETRY_DATA = []
ntddi_win8 = []
# This is a ReactOS build: the C source's `#ifdef __REACTOS__` paths (e.g. using
# IoGetStackLimits instead of the unexported IoWithinStackLimits, and creating the
# \CdfsHdd device) are the correct ones, so `reactos` is on by default. Unify all
# the grind's `__REACTOS__`/`reactos`/bare-`reactos` cfgs onto this single feature.
default = ["reactos", "ntddi_win8"]
reactos = []

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
