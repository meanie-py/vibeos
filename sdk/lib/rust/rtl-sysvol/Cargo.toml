[package]
name = "rtl-sysvol"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/sysvol.c — RtlCreateSystemVolumeInformationFolder:
# create the "System Volume Information" directory on a volume root with a
# LocalSystem-owned, admin-inheritable security descriptor (take-ownership
# fallback). Uses ntkrnl-sys SE types + Rtl SE exports + Zw security/file I/O
# + shared RtlpAllocateMemory/RtlpFreeMemory. Shared kernel+user via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
