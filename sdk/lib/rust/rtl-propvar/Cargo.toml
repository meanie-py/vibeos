[package]
name = "rtl-propvar"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/propvar.c — native property/variant API.
# These are thin thunks that LdrLoadDll("ole32.dll") and forward to the
# Stg* exports; rtl itself only passes PROPVARIANT/serialized blobs by
# pointer (opaque). Shared kernel+user via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
