# Cargo-driven `kbdclass.sys` link (i386 + amd64 + arm64). The keyboard class
# driver. Sibling of `i8042prt-cargo`: build.rs is a manifest for the shared
# `reactos-link` engine. The Rust body is the `kbdclass-rust` staticlib; its
# `DriverEntry` is the PE entry point (kernelmodedriver = kerneldll link with
# entry=DriverEntry, no exports).

[package]
name = "kbdclass-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kbdclass"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
