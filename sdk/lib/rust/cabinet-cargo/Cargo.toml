# Cargo-driven `cabinet.dll` link (i386 + amd64 + arm64). User-mode win32 DLL.
# Replaces the cmake `add_library(cabinet MODULE rust_cohab_stub.c …)` cohab — the
# Rust body (cabinet-rust) IS the DLL; reactos-link drives the final PE link.

[package]
name = "cabinet-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cabinet"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
