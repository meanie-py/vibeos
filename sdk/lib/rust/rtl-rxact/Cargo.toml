[package]
name = "rtl-rxact"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/rxact.c — the RXACT registry-transaction
# engine (Rtl{Initialize,Start,AddAction,AddAttributeAction,Apply,ApplyNoFlush,
# Abort}RXact). Batches registry delete/set-value actions into a log buffer
# under an "RXACT" key and replays them atomically. Uses ntkrnl-sys registry
# types + Zw/Nt registry I/O + RtlAllocateHeap/RtlFreeHeap + the C
# RtlpNtQueryValueKey helper. Shared kernel+user via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
