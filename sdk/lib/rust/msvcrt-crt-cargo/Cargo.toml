# msvcrt-crt-cargo — the staticlib umbrella over `msvcrt-crt-rust`.
#
# Follows the repo's standard `*-rust` (rlib: the code) + `*-cargo` (staticlib:
# the link artifact) split — same shape as kernel-rust over its sibling rlibs,
# bootvid-rust/bootvid-cargo, kdcom-rust/kdcom-cargo, ...
#
# WHY the split (it is load-bearing, not cosmetic): `msvcrt-difftest` must link
# the SHIPPING wrappers to fuzz them against the genuine C. A crate with
# `staticlib` in its crate-type is a final no_std artifact — rustc demands a
# `#[panic_handler]` in the very same invocation that emits the rlib, and that
# panic_handler is then a duplicate `panic_impl` lang item the moment the rlib
# is linked into the harness's std test binary. crate-type is not
# feature-conditional, so the two roles cannot live in one crate. The code goes
# in the rlib (harness-linkable); the runtime bits go here.
[package]
name = "msvcrt-crt-cargo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
msvcrt-crt-rust = { path = "../msvcrt-crt-rust" }
# The math wave (wave 14m): cnt-rust's `cabi-math` compiles ONLY
# cabi/math.rs — the 66 kernel-proven libm exports (sin/cos/exp/pow/…).
# msvcrt.dll's math exports bind to the same plain engine names crtmath
# defines, so pulling these into the whole-archive Rust lib flips them by
# lld first-match. Deliberately enabled HERE (the staticlib) and not in
# msvcrt-crt-rust (the rlib): the difftest links the rlib, and 66
# #[no_mangle] libm names there would shadow the HOST libm under the
# reference TUs — oracle contamination. Engine equality is graded where
# it lives: cnt-difftest, against the same sdk/lib/crt/math sources
# crtmath compiles.
cnt-rust = { path = "../cnt-rust", default-features = false, features = ["cabi-math", "cabi-intdiv", "crt-math-errors"] }
panic-common = { path = "../panic-common", features = ["user"] }
# The SEH runtime, setjmp/longjmp and the delay-load helper (pseh-rt, setjmp-rt, delayimp-rt), in THIS graph rather than as
# their own staticlibs on the DLL's link line, so the DLL has one Rust runtime (one core, one
# panic handler, one compiler_builtins) and links without --allow-multiple-definition. As
# separate archives each carried its own copy of those, and pseh/setjmp had to be named by
# path ahead of ntdll's import library; whole-archived here, they are defined before any
# import library is consulted. The -rt crates are the code without a panic runtime;
# this crate's lib.rs is the one runtime.
pseh-rt = { path = "../pseh-rt" }
setjmp-rt = { path = "../setjmp-rt" }
delayimp-rt = { path = "../delayimp-rt" }
