# usbdex-rust — Rust translation of sdk/lib/drivers/usbdex/usbdex.c (the
# "UsbdEx lib": the USBD handle/URB-allocation helpers declared in
# usbdlib.h). crate-type=staticlib → libusbdex_rust.a, linked into the
# `usbdex` cmake static lib (cohabitation, usbdex.c commented out) so every
# USB consumer picks up the Rust impl. Self-contained: the 7 functions are
# UNIMPLEMENTED stubs (faithful to the C), so there is no ntkrnl-sys
# dependency. The functions are plain cdecl (no NTAPI in usbdlib.h) →
# `extern "C"`. 3-arch.

[package]
name = "usbdex-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
