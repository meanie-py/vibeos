# aclui-rust — see src/lib.rs for the module map.
[package]
name = "aclui-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "aclui_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
