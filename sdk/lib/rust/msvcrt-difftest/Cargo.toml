# Differential harness: pins the Rust msvcrt string surface against the
# *real compiled* msvcrt C reference (`dll/win32/msvcrt/string.c`).
#
# Host crate (std, `cargo test`, no QEMU). build.rs cc-compiles the
# GENUINE string.c for linux-x86_64 with every one of its 106 public
# symbols renamed to `ref_<name>` (a generated `-include` rename header),
# so a test binary can hold BOTH the msvcrt C reference (`ref_strlen`,
# `ref_itoa`, …) and cnt-rust's `#[no_mangle]` shims (`strlen`, `_itoa`,
# …) at once and fuzz them for parity.
#
# Sibling exemplar: ../cnt-difftest (same trick, libcntpr reference).
[package]
name = "msvcrt-difftest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Grade THE SHIPPING ARTIFACT. `msvcrt-crt-rust` is what msvcrt.dll actually
# links; its wrappers delegate to `cnt_rust::core_rs` but ADAPT it (unsigned-
# char contract, clamped returns, msvcrt-contract ports). Depending on cnt-rust
# directly here would be grading a proxy — and worse, cargo feature unification
# would switch ON cnt-rust's `cabi` feature for msvcrt-crt-rust's copy too,
# whose 208 #[no_mangle] shims would then collide with the wrappers.
#
# DEFAULT features, so `stdio` is on and file.rs (file.c's 189 exports) is in the link —
# which is what lets this crate grade it. The one suite needing file.rs ABSENT, the scanf
# engine's, lives in the sibling ../msvcrt-scanf-difftest; its Cargo.toml carries the
# reason and the alternative that was weighed and rejected.
msvcrt-crt-rust = { path = "../msvcrt-crt-rust", default-features = false, features = ["stdio"] }
msvcrt-sys = { path = "../msvcrt-sys" }
# guard-page probe (tests/oob_guard.rs): mmap/mprotect/fork.
libc = "0.2"

[build-dependencies]
cc = "1"

# `harness = false` for the reason cnt-difftest documents: cnt-rust exports a
# `#[no_mangle] getenv` that shadows glibc's, libtest reads RUST_TEST_THREADS
# through it, gets NULL, and misbehaves. A plain single-threaded `fn main()`
# runner never calls getenv and never spawns threads.
[[test]]
name = "link"
path = "tests/link.rs"
harness = false

# Classification driver: fuzzes each cnt-rust shim against the genuine msvcrt
# reference and prints a MATCH / SIGN-ONLY / DIVERGE verdict per function —
# the input to deciding which families are safe to flip into msvcrt.dll.
[[test]]
name = "classify"
path = "tests/classify.rs"
harness = false

# Guard-page probe for the BOUNDED ("n"-suffixed) fns. classify.rs compares
# VALUES and so is structurally blind to an out-of-bounds READ that still
# returns the right answer — which is exactly how _strnset's unbounded NUL scan
# passed 20k fuzz cases and then faulted in the guest. This places the buffer
# flush against a PROT_NONE page so an over-read segfaults, in a forked child so
# the offending function is named rather than taking the harness down.
[[test]]
name = "oob_guard"
path = "tests/oob_guard.rs"
harness = false

# The oracle auditing ITSELF. Every other test here treats the compiled
# string.c/wcs.c as ground truth; this one asks whether the host's headers
# rewrote that truth on the way in. They did: glibc's __nonnull/__attribute_pure__
# leaked onto the renamed reference symbols and deleted msvcrt's NULL guards.
# A harness whose reference is miscompiled reports confident nonsense (§9.66).
[[test]]
name = "ref_integrity"
path = "tests/ref_integrity.rs"
harness = false

# Throughput gate. classify.rs grades BEHAVIOUR, so a semantically perfect but
# orders-of-magnitude slower body scores MATCH — which is how wave 2's per-byte
# write_volatile memset shipped and blew the net suite's timeouts (71s -> 208s).
# A flip >2x slower than the C it replaces FAILS here.
[[test]]
name = "perf"
path = "tests/perf.rs"
harness = false

# The SIXTH instrument. classify grades VALUES, oob_guard grades ACCESS, perf grades
# SPEED — and all three passed while wave 11 shipped a per-character get_locinfo() that
# took the boot from 39s to 128s. perf cannot ever catch it (the harness stubs
# get_locinfo() cheap for both sides, so the RATIO stays fine). So don't measure — COUNT.
# See tests/hot_path.rs.
[[test]]
name = "hot_path"
harness = false

# The gate every mbcs verdict depends on. The 160 generated cases are all pinned
# against one `threadmbcinfo`; if it comes back without lead bytes they still RUN,
# both sides take the single-byte path, and the suite is green having graded none of
# the DBCS logic. This asserts the fixture actually contains MBCS before any of that
# is believed. `harness = false` for the same getenv reason as the rest.
[[test]]
name = "mbcs_fixture"
path = "tests/mbcs_fixture.rs"
harness = false

# The generated mbcs cases. Runs AFTER mbcs_fixture, which is the gate that says the
# state they are graded against is real.
[[test]]
name = "mbcs"
path = "tests/mbcs.rs"
harness = false

# Wave 14c — the 30 `va_list` printf ENTRY POINTS. printf_port grades the ENGINE and
# cannot see what surrounds it: which options bits go in, how a size_t buffer size
# truncates into the C's `int len`, which of ret<0 / ret==len decides a -1, whether the
# -1 path zeroes the buffer or just terminates it, errno vs handler ordering. A shell
# that got every one of those wrong would still pass printf_port perfectly.
[[test]]
name = "printf_shells"
path = "tests/printf_shells.rs"
harness = false

# `create_mbcinfo`, which the 173 generated cases structurally cannot grade: the fixture
# they are all pinned against is built from the REFERENCE's copy and handed to both sides,
# so the SUBJECT's never runs. Its own binary, so it is its own process and cannot disturb
# that fixture. See tests/mbcs_state.rs.
[[test]]
name = "mbcs_state"
path = "tests/mbcs_state.rs"
harness = false

# `_setmbcp`, the other function the 173 generated cases structurally cannot grade, and for
# the opposite reason to create_mbcinfo's: it INSTALLS an mbcinfo rather than building one,
# so a generated case would move the fixture every other case is pinned against. Its own
# binary, hence its own process, so what it installs can never reach that fixture — and so
# that it can point each side's `MSVCRT_locale` at its own storage, which is what makes the
# non-thread arm (the one that writes the exported `_mbctype`) gradeable at all.
[[test]]
name = "mbcs_setmbcp"
path = "tests/mbcs_setmbcp.rs"
harness = false

# undname.c — reference TU #8, and 1,788 lines of Rust that had no differential coverage at
# all. Its own binary for the ordinary reason (a `fn main()` sweeping a generated corpus),
# not because it needs isolation: the demangler touches no global state, and takes its
# allocator as parameters, which is what makes the allocation ledger possible.
[[test]]
name = "undname"
path = "tests/undname.rs"
harness = false

# misc.c — reference TU #9. Its own binary because `qsort`'s contract includes the
# COMPARISON SEQUENCE — misc.c says so itself, above qsort_s: "trying to sort data doing
# identical comparisons as native does" — and watching that needs a recording comparator,
# which needs a `fn main()` rather than a generated case.
[[test]]
name = "misc"
path = "tests/misc.rs"
harness = false

# math.c — reference TU #10. Its own binary because it INSTALLS A HANDLER through
# `__setusermatherr` and drives the process MXCSR: both are global state that would follow
# another suite's rows into a wrong verdict, and the handler in particular has to be the only
# one registered for the recorded `struct _exception` stream to mean anything. `harness = false`
# gives it one thread, without which the MXCSR snapshot/restore around each `_control87` row
# would race — plus the same getenv reason as the rest.
[[test]]
name = "math"
path = "tests/math.rs"
harness = false

# Wave 18a — file.c's stream layer. Its own binary because it is the only suite that
# drives the CRT's fd table and FILE ring through hundreds of open/close cycles, and both
# sides' tables have to start empty and stay in lockstep for the fd numbers to be
# comparable at all. `harness = false` gives it one thread, which is what makes that
# lockstep hold; the same getenv reason as the rest applies too.
[[test]]
name = "file"
path = "tests/file.rs"
harness = false

# Wave 16 — the last 50 exports of string.c and wcs.c: the `_l` integer parsers and case
# folders, `_strdup` / `_atoflt` / `I10_OUTPUT`, the wide integer engines, and the whole
# wchar->multibyte family. Its own binary because it plants a non-zero `lc_codepage` on
# BOTH sides (every WideCharToMultiByte arm in that family is unreachable otherwise) and
# must not leave that state behind for another suite's rows.
[[test]]
name = "wave16"
path = "tests/wave16.rs"
harness = false

# time.c — reference TU #11. Its own binary because the whole file is driven from GLOBAL
# state that a row must set and then re-derive on both sides: timeimpl.c's frozen instant,
# its zone preset, and the `TZ` environment variable. `_tzset` caches the zone in a file
# static per side, so a row that changed the knob without re-running `_tzset` on BOTH would
# grade the previous preset — identically on both sides, and green. Sequencing that needs a
# `fn main()`, not a set of independently-ordered `#[test]`s.
[[test]]
name = "time"
path = "tests/time.rs"
harness = false

# process.c — reference TU #12. Its own binary for two reasons that are both about state.
# `_wpopen` drives BOTH sides' fd tables and FILE rings, which only stay comparable if they
# start empty and every row moves them in lockstep — the same property tests/file.rs needs,
# and it does not survive sharing a process with a suite that opens files for other reasons.
# And processimpl.c's spawn ledger is ONE recorder read back between the two calls of a row,
# so a second suite calling CreateProcessW concurrently would be reading someone else's
# marshalling. `harness = false` gives it one thread, which is what makes both hold; the
# same getenv reason as the rest applies too.
[[test]]
name = "process"
path = "tests/process.rs"
harness = false
