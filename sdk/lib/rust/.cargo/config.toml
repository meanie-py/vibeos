# Kernel code must not use SSE/FP registers on i386.
# CR4.OSFXSR is not set until Phase 1 (KiInitMachineDependent),
# but pool init runs in Phase 0 (MmArmInitSystem).
[target.i686-pc-windows-gnu]
linker = "/home/curi/Projects/os-playground/vibeos/.build-tools/llvm-mingw/bin/i686-w64-mingw32-clang"
rustflags = ["-C", "target-feature=-sse,-sse2"]

# Custom kernel target for the cargo-driven build PoC. Uses
# i686-pc-windows-gnu's underlying ABI but strips the late-link-args
# (`-lmsvcrt`, `-lgcc_eh`, …) and pre-link-objects (`rsbegin.o` /
# `rsend.o`) that pull in the user-mode mingw CRT, plus pins the
# linker to llvm-mingw's clang to match the cmake build.
#
# Note: the linker path here is ABSOLUTE because cargo doesn't
# expand env vars or relative paths in config.toml. Override via
# `CARGO_TARGET_I686_KERNEL_LINKER` env var if you have llvm-mingw
# installed somewhere else.
[target.i686-kernel]
linker = "/home/curi/Projects/os-playground/vibeos/.build-tools/llvm-mingw/bin/i686-w64-mingw32-clang"
# -Zub-checks=no: i386 kernel code keeps debug_assert! but not rustc's UB checks.
# Their entry, core's check_language_ub, is a leaf with a 1-byte local that LLVM
# runs at an odd ESP; an interrupt there builds an odd KTRAP_FRAME and the next
# checked deref of it panics (reactos-link sets the same for nested bodies).
rustflags = [
    "-C", "target-feature=-sse,-sse2",
    "-Zub-checks=no",
]

# amd64 / arm64: the `*-cargo` cells link the BUILTIN triples on pinned STABLE —
# no custom json, no `-Z build-std` (stable-toolchain-plan.md, Axis B). The
# builtin spec names a plain `*-w64-mingw32-gcc` linker that isn't on PATH, so
# point it at llvm-mingw's clang, exactly as the retired `{x86_64,aarch64}-kernel`
# json entries did.
#
# `linker` (not `rustflags`) on purpose:
#   - It is a distinct config key, so it COMPOSES with the env `RUSTFLAGS` the
#     cargo-module cells set (`-C link-self-contained=no -C force-frame-pointers=yes`).
#     An env RUSTFLAGS *replaces* config `rustflags` wholesale — putting the linker
#     there would mean every caller had to re-state it or silently lose it.
#   - These triples are ALSO the whole user-mode/library fleet's target, and those
#     crates compile to rlibs/staticlibs — no link step — so a `linker` key is inert
#     for them. Codegen flags would NOT be, which is why none live here.
#
# Path is ABSOLUTE: cargo expands neither env vars nor relative paths in
# config.toml. Override with `CARGO_TARGET_<TRIPLE>_LINKER` if llvm-mingw is
# installed elsewhere.
[target.x86_64-pc-windows-gnu]
linker = "/home/curi/Projects/os-playground/vibeos/.build-tools/llvm-mingw/bin/x86_64-w64-mingw32-clang"

[target.aarch64-pc-windows-gnullvm]
linker = "/home/curi/Projects/os-playground/vibeos/.build-tools/llvm-mingw/bin/aarch64-w64-mingw32-clang"
