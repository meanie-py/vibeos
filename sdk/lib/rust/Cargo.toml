    # Tier-2 network services (base/services/*). dnsrslvr + wkssvc are the SERVER halves of the
    # MIDL interfaces dnsapi + netapi32 already speak as clients, so they close those loops.
    "dnsrslvr-rust",
    "wkssvc-rust",
    "browser-rust",
    "wlansvc-rust",
    "tcpsvcs-rust",
    "telnetd-rust",
    # Tier-3 network client DLLs (dll/win32/*). wlanapi is the CLIENT half of wlansvc.idl,
    # whose server half is wlansvc-rust above, so it closes that loop the same way.
    "wsock32-rust",
    "wlanapi-rust",
    "snmpapi-rust",
    # Tier-3 batch B. samlib is the CLIENT half of sam.idl (server: samsrv), the same
    # client/server pairing wlanapi-rust has with wlansvc-rust above.
    "mprapi-rust",
    "netid-rust",
    "samlib-rust",
    # Tier-3 batch C: the RAS (dial-up) client family. rasadhlp is the winsock NSP hook that
    # triggers a dial attempt on a failed name resolution, so it rides on the ws2_32 surface
    # translated above.
    "rasapi32-rust",
    "rasman-rust",
    "rasdlg-rust",
    "rasadhlp-rust",
    # LDAP client. Two bindgen islands (`types` for the 19 winldap_private.h TUs,
    # `types_1` for ber.c's <winldap.h>) — see the CMakeLists for why they cannot merge.
    "wldap32-rust",
    # Tier-3 batch D, the security/auth cluster. All plain C, no COM substrate.
    "ntmarta-rust",
    "authz-rust",
    # aclui-rust joins as a COMPILING crate; it is not cohab-flipped yet, so it is linked into
    # nothing and cannot affect a boot. msv1_0-rust stays OUT until it compiles too — membership
    # is what puts a crate in everyone's `cargo check`, so a red member breaks every other lane.
    "aclui-rust",
    # Network-configuration COM server (the "Network Connections" installer/property sheets).
    # C-style COM: every vtable method is a plain `extern "C"` fn, so the whole 11-TU module
    # translates as plain C — no C++ substrate.
    "netcfgx-rust",
    # The MSV1_0 authentication package. ntlm/global.c never went through `translate`
    # (globals only); its six definitions are hand-carried in src/ntlm/global.rs.
    "msv1_0-rust",
    # The ACL editor UI (the Security tab's property page). Win32 + a small COM surface.
    "aclui-rust",
    # The user-mode PnP manager service — the SERVER half of pnp.idl, which cfgmgr32/setupapi
    # speak as clients.
    "umpnpmgr-rust",
    # The system setup DLL: the second-stage GUI wizard, the account/security policy writer, and
    # the PS/2 mouse property page. Was parked RED at 176/177/177 for want of a portable spelling
    # for width-varying parameters; crate-repair's `width_alias_cast` rule now supplies it.
    "syssetup-rust",
    "cardlib-rust",
    "desk-rust",
    # strsafe.h's `static __inline` bounded string ops, ported ONCE. No object file in the tree
    # defines them, so every flipped module used to port the header again — four divergent
    # copies, one of which had dropped its bound (roadmap: msgina's stack overrun).
    "strsafe-rust",
    "wcwidth-rust",
    "conutils-h",
    "atlclasses-rust",
    "strsafe-difftest",
    # Receiving C varargs on stable Rust (the slot-capture technique + its measured
    # bounds), ported ONCE. Three crates need it -- freeldr-rust, kd-rust and
    # drvtrace-shim -- and the bounds are only safe because they were measured, so a
    # per-crate copy is a per-crate chance to guess them instead.
    "va-slots-rust",
    # The Win32 header MACROS (LOWORD, MAKELONG, RGB, ZeroMemory, _countof, ...) plus the
    # constants bindgen folds away (DWLP_*, HWND_BROADCAST, INVALID_HANDLE_VALUE). bindgen emits
    # neither, so every translated module re-ported them by hand: LOWORD alone existed 32 times
    # in 8 spellings, and the RGB copies all dropped the header's per-component BYTE mask.
    "win32macros-rust",
    "mmebuddy-macros-rust",
    "winelist-rust",
    # Wine's ERR/FIXME/WARN/TRACE (wine/debug.h). Thirty-one Wine-derived crates carried a
    # byte-identical copy of the same 64-line module.
    "winedebug-rust",
    # The System control panel: the General/Hardware/Advanced property sheets, the
    # environment/user-profile/hardware-profile/virtual-memory/startup-recovery dialogs, and the
    # SMBIOS/DMI reader that names the machine.
    "sysdm-rust",
    # The International control panel: the number/currency/time/date/sort/language property
