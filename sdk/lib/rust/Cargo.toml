[workspace]
members = [
    "access",
    "avltable",
    "bitmap",
    "byteswap",
    "compress",
    "crc32",
    "encode",
    "generictable",
    "hal-rust",
    "handle",
    "interlck",
    "kernel-rust",
    "ke-inlines",
    "ke-macros",
    "largeint",
    "luid",
    "mem",
    "ntkrnl-sys",
    "ntoskrnl-cargo",
    "ntoskrnl-rust",
    "ntprintf",
    "ntprintf_w",
    "prefix",
    "random",
    "rtl-rust",
    "slist",
    "slist-loom",
    "splaytree",
    "time",
    "utf8",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 1
lto = false
codegen-units = 256
