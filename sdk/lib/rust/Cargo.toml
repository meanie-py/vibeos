# NB: profile `trim-paths` (reproducible-builds rung 1, Rust path remap) is NOT usable
# here — it is still UNSTABLE in cargo 1.92 (our pinned stable toolchain); it needs
# nightly + `cargo-features = ["trim-paths"]`. The stable fallbacks don't fit either:
# config.toml `[target.*].rustflags` can't express the per-worktree absolute path
# statically, and env `RUSTFLAGS` clobbers the load-bearing i386 SSE guard. So Rust
# path normalization is toolchain-blocked — revisit when trim-paths stabilizes. The PE
# timestamp (rung 2a) + SOURCE_DATE_EPOCH (rung 2b) — the dominant, all-3-arch leaks —
# do not depend on it. See docs/engineering/deterministic-builds-plan.md.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 1
lto = false
codegen-units = 256
debug = 1
# The C we translated from runs its ASSERTs: CMakeLists.txt sets -DDBG=1, so
# every `ASSERT` in the C originals calls RtlAssert. The Rust `debug_assert!`
# those became is gated on cfg(debug_assertions), which cargo's release profile
# leaves OFF — so 2,120 translated invariant checks compiled to nothing, and the
# Rust half of the kernel has been running with its assertions silently disabled
# while the C half checks them. That is the mirror of the bug where C assert
# macros got lowered to something STRONGER than the original (UB, an invented
# BUGCHECK); here they were lowered to nothing at all. Proof it mattered:
# ke/amd64/usercall.rs asserts `(SegCs & MODE_MASK) != 0`, and a boot printed
# `[KI-APC] ... SegCs=0x0` — a forbidden value walked straight past a check that
# was not there.
#
# SCOPED TO THE KERNEL CORE (2026-07-28), not workspace-wide. Turning it on for
# the whole workspace does not just enable assertions — it compiles 108
# `#[cfg(debug_assertions)]` blocks that have NEVER been type-checked in the
# life of this tree, and the first one tried (freeldr-rust heap statistics) was
# broken: 14 x E0609, a PVOID handle deref'd without the `as PHEAP` cast. Those
# blocks are a real backlog, but they are a separate project from arming the
# assertions, and pretending otherwise blocks the latter on the former.
#
# So: arm the crates the kernel bug-hunt actually lives in (KE/MM/OB/PS/EX/HAL)
# — 181 of the assertions for 29 of the never-compiled blocks — and leave the
# loader/filesystem/driver tail tracked as owed work. See the roadmap entry.
# STAGED, NOT YET ENABLED — and the reason is the second half of the finding.
#
# On pinned stable, `debug-assertions` does not only enable `debug_assert!`. It
# also enables rustc's **UB checks** (they share the cfg; splitting them needs
# nightly `-Zub-checks`). Those found real alignment UB in the first two crates
# tried, one per arch, on the first boot of each:
#   - amd64, hal-rust/src/x86/halacpi.rs:864 — an 8-byte read of an ACPI
#     structure that is only 4-byte aligned. FIXED here (addr_of! +
#     read_unaligned) since it is correct regardless.
#   - arm64, ntoskrnl-rust/src/ke/time.rs:56 — `write_volatile` of a u64
#     through a `*mut KSYSTEM_TIME`, which is 4-aligned (SystemTime lives at
#     offset 0x14 of KUSER_SHARED_DATA). FIXED 2026-10-16 against the C
#     protocol (ndk/kefuncs.h): High2Time first, then one unaligned 64-bit
#     store in asm -- and the write order was wrong on both widths besides.
#
# So this is a MIGRATION, not a flag flip — two of two crates tested had a UB
# site, on top of the 108 never-compiled `#[cfg(debug_assertions)]` blocks.
# Enable it one crate at a time, with a boot per crate. Full accounting, and the
# three already-fixed never-compiled blocks, are in the roadmap entry.
#
# ARMED: ntoskrnl-rust (2026-10-16), ex-rust and hal-rust (2026-10-17), ob-rust,
# ps-rust, se-rust, iomgr-rust, config-rust and cc-rust (2026-10-17). overflow-checks defaults to FOLLOWING debug-assertions and
# must stay off: the C has no overflow traps.
[profile.release.package.ntoskrnl-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.ex-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.hal-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.ob-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.ps-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.se-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.iomgr-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.config-rust]
debug-assertions = true
overflow-checks = false
[profile.release.package.cc-rust]
debug-assertions = true
overflow-checks = false

# The appcompat shim DLLs register their shims as `.shm$BBB` records that only shimlib's section
# walk ever reads, so the DLL reaches each crate through ONE anchor symbol (lib.rs). One codegen
# unit keeps every record in the anchor's object; split, the records' objects stay unlinked.
# Build scripts (each `*-cargo` cell's build.rs and the reactos-link engine it runs)
# execute on the host at build time; nothing ships them or debugs them. Each of the
# ~730 per-arch cell link dirs held a 7.5 MB build script, 5.5 MB of it DWARF from
# `debug = 1` and std, beside its own debug-built reactos-link/cc rlibs: 16 GB a lane.
[profile.release.build-override]
debug = 0
strip = "debuginfo"

[profile.release.package.aclayers-rust]
codegen-units = 1

[profile.release.package.acgenral-rust]
codegen-units = 1

# msvcrt.dll's CRT body is the ONE place in this workspace where throughput is a
# correctness-adjacent contract: `memset`/`memcpy`/`memcmp`/`strlen` are served to
# every user-mode caller in the system. The workspace-wide `opt-level = 1` (tuned
# for the kernel) leaves the fill/compare loops unvectorized — measured 8x/10x off
# the C bodies they replace, which blew the net suite's 120s marker timeouts and
# got wave 2 reverted off master. -O3 here (and ONLY here) closes it.
# Pinned by `cargo test -p msvcrt-difftest --test perf`.
[profile.release.package.msvcrt-crt-rust]
opt-level = 3
