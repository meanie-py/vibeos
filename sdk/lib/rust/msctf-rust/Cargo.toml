# msctf-rust — see src/lib.rs for the module map.
[package]
name = "msctf-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "msctf_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
winelist-rust = { path = "../winelist-rust" }
strsafe-rust = { path = "../strsafe-rust" }
cicero-rust = { path = "../cicero-rust" }  # cicero itself: CicArray<T>/CicIMCCLock<T> and its helpers
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
win32macros-rust = { path = "../win32macros-rust" }
atlclasses-rust = { path = "../atlclasses-rust" }
