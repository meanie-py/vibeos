# Cargo-driven `arm64vid.sys` link (i386 + amd64 + arm64). Despite the name,
# this is the LIVE GOP/linear-framebuffer video driver on all three UEFI
# arches. Sibling of `null-cargo`: build.rs is a manifest for the shared
# `reactos-link` engine. The Rust body is the `arm64vid-rust` staticlib; its
# `DriverEntry` is the PE entry point (kernelmodedriver = kerneldll link with
# entry=DriverEntry, no exports).

[package]
name = "arm64vid-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arm64vid"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }

[lints.rust]
# lld reports every duplicate symbol it resolves under --allow-multiple-definition
# as a warning; surface it so tools/scan_link_duplicates.py can read it back
# from cargo's cached diagnostics.
linker_messages = "warn"
