# ex-rust — the Executive (Ex*/Exp* + the pool allocator), extracted from
# ntoskrnl-rust (crate-split Phase 1b). ~41K LOC — the largest subsystem. Pure Ex*
# logic on ntkrnl-sys + dbgprint-rust; its #[no_mangle] Ex*/Exp*/Nt* symbols link
# via `extern crate ex_rust`.
[package]
name = "ex-rust"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["rlib"]
[features]
default = []
lockdep = ["ntkrnl-sys/lockdep"]
smp = ["ntkrnl-sys/smp"]
[dependencies]
win32macros-rust = { path = "../win32macros-rust" }
ntkrnl-sys = { path = "../ntkrnl-sys" }
dbgprint-rust = { path = "../dbgprint-rust" }
