# Differential harness: pins cnt-rust against the *real compiled*
# ReactOS libcntpr reference. Host crate (std, `cargo test`, no QEMU) —
# build.rs cc-compiles the isolated reference logic headers for the
# host, the tests fuzz cnt-rust's core/shim vs the reference across
# each symbol's fuzz_domain. This is what makes cheap-model manifest
# rows safe: a wrong contract fails a test loudly, it never ships.
[package]
name = "cnt-difftest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cnt-rust = { path = "../cnt-rust", features = ["cabi"] }
cnt-ctype = { path = "../cnt-ctype" }

[build-dependencies]
cc = "1"
