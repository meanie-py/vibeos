# Differential harness: pins cnt-rust against the *real compiled*
# ReactOS libcntpr reference. Host crate (std, `cargo test`, no QEMU) —
# build.rs cc-compiles the isolated reference logic headers for the
# host, the tests fuzz cnt-rust's core/shim vs the reference across
# each symbol's fuzz_domain. This is what makes cheap-model manifest
# rows safe: a wrong contract fails a test loudly, it never ships.
[package]
name = "cnt-difftest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# BOTH features: `cabi` is the kernel surface this harness exists to grade,
# and `cabi-math` adds the six Bessel wrappers, which are gated off the
# kernel because they need `_errno`. Without cabi-math here they would be
# the one part of cabi/math.rs that nothing grades.
cnt-rust = { path = "../cnt-rust", features = ["cabi", "cabi-math"] }
# The engine cnt-rust exports exp/log/exp2 from (graded itself in musl-math-difftest).
musl-math = { path = "../musl-math" }
cnt-ctype = { path = "../cnt-ctype" }

[build-dependencies]
cc = "1"

# The differential suite runs WITHOUT libtest. cnt-rust/cnt-ctype export
# `#[no_mangle]` shims (`getenv`, `str*`/`mem*`, ctype, `qsort`) that
# override host glibc once linked. Under rustc 1.92 / current glibc that
# breaks libtest specifically: its `getenv` for `RUST_TEST_THREADS` hits
# cnt's empty env block → NULL → forced multithreading → a race on
# cnt's process-global state (the `diff_env` setenv block) → a spurious
# abort; argv parsing is also defeated. A `harness = false` single-
# threaded `fn main()` runner sidesteps all of it: it never calls
# getenv, never spawns threads, and reports each test by name before
# running it (so an abort under `panic = "abort"` still pinpoints the
# culprit). The translations themselves were always correct — this is a
# host-toolchain interaction, not a contract bug.
[[test]]
name = "diff"
path = "tests/diff.rs"
harness = false
