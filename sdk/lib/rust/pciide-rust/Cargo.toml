# pciide-rust — Rust translation of the PCI IDE bus mini-driver
# (drivers/storage/ide/pciide/pciide.c). crate-type=staticlib →
# libpciide_rust.a, linked into pciide.sys via pciide-cargo (reactos-link,
# ModuleKind::KernelDll). The C source is kept on disk (never-delete rule).
# Registers controller properties with the pciidex framework. Built for all 3
# arches. On the boot-critical storage path (the LiveCD is accessed over IDE),
# so smoke validates it.

[package]
name = "pciide-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
