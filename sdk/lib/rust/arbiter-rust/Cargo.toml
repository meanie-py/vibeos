# arbiter-rust — Rust translation of sdk/lib/drivers/arbiter (the PnP resource
# arbiter library, upstream's #9484 engine). crate-type=staticlib → libarbiter_rust.a, linked
# into ntoskrnl AND pcix.sys in place of the C `arbiter` lib (usbdex-style cohab).
# On the ntkrnl-sys substrate (ARBITER_INSTANCE etc are in the ddk bindgen). All
# 3 arches. Haiku+c2rust translation, sealed. C kept on disk.

[package]
name = "arbiter-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
win32macros-rust = { path = "../win32macros-rust" }
