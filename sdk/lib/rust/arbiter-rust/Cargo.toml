# arbiter-rust — Rust translation of sdk/lib/drivers/arbiter/arbiter.c (the PnP
# resource arbiter library). crate-type=staticlib → libarbiter_rust.a, linked
# into ntoskrnl AND pcix.sys in place of the C `arbiter` lib (usbdex-style cohab).
# On the ntkrnl-sys substrate (ARBITER_INSTANCE etc are in the ddk bindgen). All
# 3 arches. DeepSeek+c2rust translation (Batch 4 kernel-lib residue). C kept on disk.

[package]
name = "arbiter-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
