# Cargo-driven `wpprecorder.sys` link (amd64 + arm64). build.rs is a manifest for the
# shared `reactos-link` engine; the body is the `wpprecorder-rust` staticlib, and the
# exports come from drivers/base/wpprecorder/wpprecorder.spec.

[package]
name = "wpprecorder-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wpprecorder"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
