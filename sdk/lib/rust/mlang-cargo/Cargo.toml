# Cargo-driven `mlang.dll` link (i386 + amd64 + arm64). User-mode win32 DLL.
# Replaces the cmake `add_library(mlang MODULE rust_cohab_stub.c …)` cohab — the
# Rust body (mlang-rust) IS the DLL; reactos-link drives the final PE link.

[package]
name = "mlang-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mlang"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }

[lints.rust]
# lld reports every duplicate symbol it resolves under --allow-multiple-definition
# as a warning; surface it so tools/scan_link_duplicates.py can read it back
# from cargo's cached diagnostics.
linker_messages = "warn"
