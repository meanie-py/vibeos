# Cargo-driven `processr.sys` link (i386 + amd64 + arm64). Replaces the cmake
# `add_library(processr MODULE rust_cohab_stub.c …)` cohab — the Rust body
# (processr-rust) IS the driver; reactos-link drives the final PE link.

[package]
name = "processr-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "processr"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
