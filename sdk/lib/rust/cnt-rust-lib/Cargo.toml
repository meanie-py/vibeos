# cnt-rust-lib — staticlib umbrella that exposes cnt-rust's `cabi`
# #[no_mangle] libcntpr-replacement symbols as one `.a` for the cmake
# libcntpr cohabitation swap (libcntpr feeds BOTH ntoskrnl and hal, so
# the rtl-rust route — librtl-only — cannot serve it; this is the
# libcntpr-level vehicle, mirroring rtl-rust↔librtl).
#
# `extern crate cnt_rust;` force-pulls cnt-rust's #[no_mangle] symbols
# into this staticlib (per feedback_extern_crate_for_staticlib.md).
# One #[panic_handler] lives here (cnt-rust is an rlib with none).

[package]
name = "cnt-rust-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
# amd64/arm64 enable this (the core_rs forbid-unsafe float surface:
# floatcvt/scanf + their cabi shims). i386 OMITS it — those live in
# core_rs (#[forbid(unsafe_code)]) so their no-SSE-illegal by-value f64
# returns can't use the fb64/fb32 transmute escape and stay C on i386.
# The math surface (cabi::math) is no-SSE-safe and compiled
# unconditionally regardless of this feature — see cnt-rust/Cargo.toml.
float = ["cnt-rust/float"]
# freeldr: the loader supplies its own small `iswctype` (see cnt-ctype), and
# keeps a token environment table (cnt-rust `small-env`).
freeldr = ["cnt-ctype/no-iswctype", "cnt-rust/small-env"]

[dependencies]
# default-features=false drops cnt-rust's default `float`; `cabi`
# alone no longer implies float (decoupled so i386 no-SSE compiles).
cnt-rust = { path = "../cnt-rust", default-features = false, features = ["cabi"] }
# ctype lives in its own crate (keeps cnt-rust's cgu layout untouched —
# see cnt-ctype/Cargo.toml). `extern crate` in lib.rs force-pulls its
# #[no_mangle] symbols into this staticlib.
cnt-ctype = { path = "../cnt-ctype" }
