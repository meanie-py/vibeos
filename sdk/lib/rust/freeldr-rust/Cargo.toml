# freeldr-rust — Rust translation of FreeLDR static components
# (boot/freeldr/freeldr). crate-type=staticlib → libfreeldr_rust.a,
# linked into the cmake-built freeldr lib (freeldr.sys / uefildr.efi /
# rosload.exe) with the corresponding .c commented out — hal-rust-style
# cohabitation, NOT a DLL cargo-link. 3-arch (i386/amd64/arm64).

[package]
name = "freeldr-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
# Mirrors hal-rust's `minihal`. freeldr_pe (BIOS) and uefildr (UEFI)
# link the SAME libfreeldr_rust.a but different per-binary C/asm: the
# PC-AT machine entry (machpc.rs MachInit, pchw.rs StallExecution-
# Processor) and the vidfb_pc_fallback shim are BIOS-only — on the
# UEFI link uefisetup.c/vidfb.c/uefildr.c own those symbols, so the
# Rust defs would dup. `uefi` gates those out; uefi.cmake builds a
# second archive (libfreeldr_rust_uefi.a) with --features uefi.
default = []
uefi = []
# rosload — the 2nd-stage loader (rosload.exe). Built as a separate PE
# binary from freeldr.sys/uefildr.efi. Links libfreeldr_rust_rosload.a
# (3rd archive, see boot/freeldr/freeldr/CMakeLists.txt). Selects the
# loader-only Rust modules (bootmgr/custom/options/oslist/winldr/...)
# while gating out the BIOS/UEFI hardware-detection code (machpc/pchw/
# tui/ueficon/etc) — rosload imports those services from freeldr.sys
# via the importlib (add_importlibs rosload freeldr).
rosload = []
# miscboot.c lives in rosload.cmake; activated via the `rosload` feature
# (see lib.rs cfg). The original `miscboot-rust-entry` opt-in flag is
# kept as a no-op alias for any out-of-tree consumer.
miscboot-rust-entry = []
# uefildr.c is the uefildr.exe binary entry source; same translate-and-
# park pattern as miscboot — Rust translation preserved, C keeps entry.
uefildr-rust-entry = []

[dependencies]
va-slots-rust = { path = "../va-slots-rust" }
# default-features = false drops the `hal_bindgen` feature: freeldr is
# pre-kernel and doesn't need HAL's raw-dylib import surface for
# ntoskrnl.exe symbols. Without this, rustc emits import thunk .o files
# for ntoskrnl.exe statics (NlsMb*/NlsOem*) into freeldr-rust's .a,
# duplicating blrtl/nlsboot.c at link time (task #33).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false }
# Shared CM boot-init translation, linked only into the uefi/rosload archives
# (see lib.rs `extern crate cmboot_rust`). Compiled for every feature build but
# its symbols are only bundled where extern-crated. Same ntkrnl-sys config.
cmboot-rust = { path = "../cmboot-rust" }
