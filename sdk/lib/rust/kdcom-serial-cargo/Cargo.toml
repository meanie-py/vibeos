# Cargo-driven kdcom.dll link for the CLASSIC serial KD transport
# (kdcom-serial-rust). Sibling of kdgdb-cargo. i386 + amd64. SPIKE: not wired
# into cmake (serial kdcom is _WINKD_-gated); standalone link to prove
# kdcom-serial-rust resolves into a real kdcom.dll with the 8 kddll exports.

[package]
name = "kdcom-serial-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kdcom-serial"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }

[lints.rust]
# lld reports every duplicate symbol it resolves under --allow-multiple-definition
# as a warning; surface it so tools/scan_link_duplicates.py can read it back
# from cargo's cached diagnostics.
linker_messages = "warn"
