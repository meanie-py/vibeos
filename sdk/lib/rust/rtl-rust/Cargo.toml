[package]
name = "rtl-rust"
version = "0.1.0"
edition = "2021"

# Umbrella staticlib that combines the 18 algorithm rlibs that feed librtl.a.
# `extern crate X;` in lib.rs force-pulls each rlib's #[no_mangle] symbols
# into the staticlib (per feedback_extern_crate_for_staticlib.md).

[lib]
crate-type = ["staticlib"]

[features]
default = ["kernel", "heaplist"]
# heapuser.c: the PEB process-heap list (RtlpAdd/RemoveHeapToProcessList,
# RtlInitializeHeapManager). USER-MODE only, as in C: the kernel's versions are
# libsupp.c's (rtlk-rust). ntoskrnl/ntkrnlmp ask for rtl-rust without it; before
# that, --allow-multiple-definition picked the kernel's copy by archive order alone.
heaplist = ["dep:rtl-heapuser"]
kernel = ["rtl-strings/kernel", "rtl-heap/kernel", "rtl-threadpool/kernel", "rtl-sync/kernel", "rtl-diag/kernel", "rtl-except/kernel", "rtl-misc/kernel"]

[dependencies]
panic-common = { path = "../panic-common" }
access       = { path = "../access" }
avltable     = { path = "../avltable" }
bitmap       = { path = "../bitmap" }
byteswap     = { path = "../byteswap" }
compress     = { path = "../compress" }
crc32        = { path = "../crc32" }
encode       = { path = "../encode" }
generictable = { path = "../generictable" }
handle       = { path = "../handle" }
interlck     = { path = "../interlck" }
largeint     = { path = "../largeint" }
luid         = { path = "../luid" }
mem          = { path = "../mem" }
network      = { path = "../network" }
prefix       = { path = "../prefix" }
random       = { path = "../random" }
slist        = { path = "../slist" }
splaytree    = { path = "../splaytree" }
uniprefix    = { path = "../uniprefix" }
rtl-strings  = { path = "../rtl-strings", features = ["cabi"] }
rtl-actctx   = { path = "../rtl-actctx", features = ["cabi", "kernel"] }
rtl-diag     = { path = "../rtl-diag", features = ["cabi"] }
rtl-except   = { path = "../rtl-except", features = ["cabi"] }
rtl-misc     = { path = "../rtl-misc", features = ["cabi"] }
rtl-heap     = { path = "../rtl-heap", features = ["cabi"] }
rtl-threadpool = { path = "../rtl-threadpool", features = ["cabi"] }
rtl-sync     = { path = "../rtl-sync", features = ["cabi"] }
rtl-version  = { path = "../rtl-version" }
rtl-ppb      = { path = "../rtl-ppb" }
rtl-propvar  = { path = "../rtl-propvar" }
rtl-bootdata = { path = "../rtl-bootdata" }
rtl-rangelist = { path = "../rtl-rangelist" }
rtl-sysvol   = { path = "../rtl-sysvol" }
rtl-rxact    = { path = "../rtl-rxact" }
rtl-error    = { path = "../rtl-error" }
rtl-heappage = { path = "../rtl-heappage", features = ["cabi"] }
rtl-heapuser = { path = "../rtl-heapuser", features = ["cabi"], optional = true }
time         = { path = "../time" }
