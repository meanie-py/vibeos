[package]
name = "winreg-stub"
version = "0.1.0"
edition = "2021"
description = "Generated Rust RPC server stub for the winreg interface — replaces cmake's widl-generated winreg_s.c. Linked into winlogon.exe alongside winlogon-rust."

[lib]
crate-type = ["staticlib"]

[dependencies]
midl-rt = { path = "../midl-rt" }

[build-dependencies]
reactos-link = { path = "../reactos-link" }
