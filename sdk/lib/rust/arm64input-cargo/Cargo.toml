# Cargo-driven `arm64input.sys` link (arm64-only — the ARM64 virtio-input
# driver, which bypasses ACPI/PnP/GIC). Sibling of `null-cargo`. The Rust body
# is the `arm64input-rust` staticlib; its `DriverEntry` is the PE entry point
# (kernelmodedriver = kerneldll link with entry=DriverEntry, no exports).

[package]
name = "arm64input-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arm64input"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }

[lints.rust]
# lld reports every duplicate symbol it resolves under --allow-multiple-definition
# as a warning; surface it so tools/scan_link_duplicates.py can read it back
# from cargo's cached diagnostics.
linker_messages = "warn"
