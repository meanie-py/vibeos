# rtl-threadpool — Rust translation of ReactOS RTL thread-pool cluster:
#   sdk/lib/rtl/threadpool.c   (Wine object-oriented TpAlloc* / RtlQueueWorkItem / timer-queue)
#   sdk/lib/rtl/workitem.c     (old RtlQueueWorkItem worker-thread pool)
#   sdk/lib/rtl/timerqueue.c   (RtlCreateTimerQueue / RtlCreateTimer)
#
# These compile into librtl.a (the `rtl` cmake target, which already links
# librtl_rust.a). The internal threadpool/timer/worker structs are file-private
# (allocated via RtlAllocateHeap, cast from the opaque TP_* handles) so their
# layout only needs to be self-consistent within Rust; the PUBLIC winnt TP_*
# types in types.rs are mirrored byte-exact (callers pass them in).
[package]
name = "rtl-threadpool"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
# The #[no_mangle] extern "system" shim layer (the kernel/ntdll link surface).
cabi = []
kernel = ["cabi"]

[dependencies]
winedebug-rust = { path = "../winedebug-rust" }
win32macros-rust = { path = "../win32macros-rust" }
winelist-rust = { path = "../winelist-rust" }
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }

# `#ifndef __REACTOS__`: __REACTOS__ is always defined, so this is never set.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(not_reactos)'] }
