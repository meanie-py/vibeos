# netstack-rust — the smoltcp network stack (L4 rewrite, NOT a C translation).
# Replaces the ReactOS tcpip protocol engine (tcpip/ip ~8K + tcpip/lwip ~115K C)
# with the smoltcp crate behind the existing TDI device interface; AFD/msafd/
# ws2_32 stay untouched. Device backend = virtio-net via virtio-drivers
# (bypassing NDIS; the phy::Device trait keeps an NDIS backend swappable later).
# Design: docs/engineering/smoltcp-netstack-design.md. Becomes netstack.sys.
# staticlib -> libnetstack_rust.a; amd64 bringup first, then i386/arm64.

[package]
name = "netstack-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
default = []

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
# auto-icmp-echo-reply is a smoltcp DEFAULT feature, so default-features = false
# dropped it and the stack never answered a ping (unseen until a real LAN).
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-raw", "socket-dhcpv4", "socket-dns", "auto-icmp-echo-reply", "alloc"] }
virtio-drivers = { version = "0.13.0", default-features = false, features = ["alloc"] }
