# kdcom-serial-rust — Rust translation of the CLASSIC serial KD transport
# (drivers/base/kdcom: kdcom.c + kddll.c + kdserial.c), distinct from the
# default kdrosdbg-as-kdcom.dll (= kdcom-rust). _WINKD_-only, never built on
# the default llvm-mingw build; validated standalone via
# `cargo build -p kdcom-serial-rust`. i386 + amd64 (no arm64 in the C).

[package]
name = "kdcom-serial-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]  # rlib-only since the crash-value embed: the standalone
# kdcom.dll staticlib spike is dormant (_WINKD_=FALSE on llvm-mingw); if it
# revives, kdcom-serial-cargo must add its own panic handler + staticlib type.

# KDDEBUG mirrors the C `#ifdef KDDEBUG` debug-only path (KdpDbgPrint over a
# second COM port). Off by default, matching kddll.h's `#ifndef KDDEBUG`.
[features]
default = []
KDDEBUG = []
# embedded: rlib inside the kernel image (crash-value KD-over-COM2) — the
# no_mangle exports and panic handler/personality are suppressed; the kernel
# calls the transport via rust paths (kd-rust kdio.rs delegation).
embedded = []

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
