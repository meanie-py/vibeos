family       = "rand"
slice_pattern = "rand_seed"
core_fn      = "rng::seed"
return_collapse = "void"
inout_effects = "RAND_STATE = seed (zero-extended u32 → u64)"
preserved_misfeature = "seed zero-extended into the 64-bit state with NO scrambling (next = seed directly)"
reference    = "sdk/lib/crt/stdlib/rand_nt.c"
fuzz_domain  = ["seed 0", "seed 1", "seed large", "reseed mid-sequence"]

# --- Wave SORT: qsort (stdlib/qsort.c) -----------------------------
# Callback-based Bentley-McIlroy quicksort. NO pure slice->value core
# (it invokes a C comparator fn-ptr + swaps raw es-sized elements); the
# whole algorithm is the bespoke unsafe super::qsort_rs (cabi HELPERS),
# the shim a thin ABI adapter. cnt-difftest fuzzes WITH ties (small
# alphabet + first-byte comparator) and asserts byte-identical sorted
# output vs the genuine qsort.c — only possible because the element-
# swap sequence is replicated exactly.

[symbols.qsort]
c_signature  = "void qsort(void *a, size_t n, size_t es, int (__cdecl *cmp)(const void*, const void*))"
family       = "sort"
slice_pattern = "sort"
core_fn      = "(bespoke: cabi::qsort_rs — Bentley-McIlroy, no pure core)"
return_collapse = "void"
inout_effects = "a[0..n*es] sorted in place per cmp"
preserved_misfeature = "Bentley-McIlroy (Engineering a Sort Function): median-of-3 (ninther for n>40), insertion-sort for n<7 + the no-swap fast path, equal keys partitioned to both ends then vecswap'd to the middle, recurse-left/iterate-right; UNSTABLE — equal-key final order IS this exact element-swap sequence (replicated faithfully; the swaptype long/byte choice is result-irrelevant so the port byte-swaps)"
reference    = "sdk/lib/crt/stdlib/qsort.c"
fuzz_domain  = ["n 0..60", "es 1/2/3/4/8/12", "small alphabet (many ties → equal-key order)", "full-byte keys (distinct)", "first-byte-only comparator (heavy ties)", "n<7 insertion path", "n>40 ninther path", "already/reverse sorted"]
