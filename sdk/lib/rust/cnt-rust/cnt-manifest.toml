[symbols.memchr]
c_signature  = "void* __cdecl memchr(const void *s, int c, size_t n)"
family       = "mem"
slice_pattern = "ptr_len"
core_fn      = "mem::chr"
return_collapse = "ptr_or_null_from_opt"
inout_effects = "none (read-only scan)"
preserved_misfeature = "n==0 → return NULL without deref; signed-char vs int compare (high-bit c)"
reference    = "sdk/lib/crt/mem/memchr.c"
fuzz_domain  = ["n==0", "c at 0", "c at n-1", "c absent", "c==0", "c high-bit (>=0x80)"]

[symbols.memcmp]
c_signature  = "int __cdecl memcmp(const void *s1, const void *s2, size_t n)"
family       = "mem"
slice_pattern = "ptr_len"
core_fn      = "mem::cmp"
return_collapse = "i32_passthrough"
inout_effects = "none"
preserved_misfeature = "UNSIGNED-char diff, raw (not clamped to {-1,0,1}): 0xFF vs 0x00 → 255"
reference    = "sdk/lib/crt/mem/memcmp.c"
fuzz_domain  = ["n==0", "equal", "differ at 0", "differ at n-1", "0xFF vs 0x00 (==255)"]

[symbols.memmove]
