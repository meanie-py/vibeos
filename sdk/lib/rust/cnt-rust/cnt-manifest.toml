[symbols.strnlen]
c_signature  = "size_t strnlen(const char *str, size_t maxlen)"
family       = "string"
slice_pattern = "nul_in_maxlen"
core_fn      = "string::len_of"
return_collapse = "usize"
inout_effects = "none"
preserved_misfeature = "NULL→0 (tcsnlen.h guard); never reads past maxlen; result = min(strlen,maxlen)"
reference    = "sdk/lib/crt/string/tcsnlen.h"
fuzz_domain  = ["NULL", "empty", "shorter than cap", "exactly cap", "no NUL within cap", "cap==0"]

[symbols.strncmp]
c_signature  = "int strncmp(const char *s1, const char *s2, size_t n)"
family       = "string"
slice_pattern = "nul_in"
core_fn      = "string::ncmp"
return_collapse = "i32_cmp_n"
inout_effects = "none"
preserved_misfeature = "signed-char diff (tcsncmp.h _TCHAR=signed char); n==0→0; stops at first NUL"
reference    = "sdk/lib/crt/string/tcsncmp.h"
fuzz_domain  = ["n==0", "equal < n", "equal exactly n", "differ < n", "differ at 0", "NUL before n", "high-bit (signed)"]

[symbols.strchr]
c_signature  = "char *strchr(const char *s, int c)"
family       = "string"
slice_pattern = "nul_in"
core_fn      = "string::find_char"
return_collapse = "ptr_or_null_from_opt"
inout_effects = "none"
preserved_misfeature = "the terminating NUL is a valid target: c==0 returns ptr to the NUL (Some(len)), not NULL; c truncated to char"
reference    = "sdk/lib/crt/string/tcschr.h"
fuzz_domain  = ["found mid", "found at 0", "not found", "c==0 (→ptr to NUL)", "c high-bit", "empty string"]

[symbols.strrchr]
c_signature  = "char *strrchr(const char *s, int c)"
family       = "string"
slice_pattern = "nul_in"
core_fn      = "string::find_last_char"
return_collapse = "ptr_or_null_from_opt"
inout_effects = "none"
preserved_misfeature = "last occurrence; c==0 → ptr to terminating NUL (Some(len)); c truncated to char"
reference    = "sdk/lib/crt/string/tcsrchr.h"
fuzz_domain  = ["one match", "multiple (last wins)", "not found", "c==0 (→ptr to NUL)", "c high-bit", "empty"]
