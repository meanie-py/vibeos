# --- Wave MEM2: copy-until-byte + case-insensitive compare ----------
# _memccpy (mem.cmake LIBCNTPR_MEM_SOURCE) + _memicmp. memccpy is a
# bespoke shim (copy-scan with the signed-char `t==c` + NUL-precedence
# misfeatures in mem::ccpy). memicmp REUSES the memcmp shape (ptr_len +
# i32_passthrough) over mem::icmp: ASCII toupper fold for the compare,
# raw unfolded diff returned; the Vista NULL guard (NULL → _NLSCMPERROR,
# or 0 when n==0) is modeled unconditionally: dead under the NT 5.x
# kernel, live after the Windows 10 version flip (diff pins
# OSMajorVersion=10).

[symbols._memccpy]
c_signature  = "void *_memccpy(void *to, const void *from, int c, size_t count)"
family       = "mem"
slice_pattern = "memccpy"
core_fn      = "mem::ccpy"
return_collapse = "memccpy"
inout_effects = "to[0..=k] ← from[0..=k] where k = first index with from[k] matching c (return &to[k+1]) OR first NUL (return NULL) OR count-1 (return NULL); each byte copied before its test"
preserved_misfeature = "NUL test PRECEDES c test → c==0 always returns NULL (NUL break wins); the `t==c` match is signed-char `t` vs int `c` (memchr deal: byte 0x90 matches only c==-112, never 0x90); count==0 copies nothing → NULL"
reference    = "sdk/lib/crt/mem/memccpy.c"
fuzz_domain  = ["count==0", "c present (signed match)", "c absent", "NUL before c", "c==0 (→NULL via NUL precedence)", "c high-bit positive (no match)", "c negative (high byte match)", "c at last byte"]

[symbols._memicmp]
c_signature  = "int _memicmp(const void *s1, const void *s2, size_t n)"
family       = "mem"
slice_pattern = "ptr_len"
core_fn      = "mem::icmp"
return_collapse = "i32_passthrough"
null_guard_nls = true
inout_effects = "none (read-only)"
preserved_misfeature = "ASCII toupper fold (a..z only; >=0x80 untouched) for the COMPARE but returns the RAW unfolded unsigned-char diff *p1-*p2 (not the folded one); n==0 → 0; NULL s1 or s2 → _NLSCMPERROR (0x7fffffff) when n!=0, else 0 (the C's OSMajorVersion>=6 guard, validated unconditionally; _LIBCNT_ INVALID_PMT is a no-op)"
reference    = "sdk/lib/crt/mem/memicmp.c"
fuzz_domain  = ["n==0", "equal", "differ pre-fold", "differ only by case (→0)", "high-bit >=0x80 (never folded)", "differ at 0", "differ at n-1", "NULL s1/s2 with n!=0 (→_NLSCMPERROR)", "NULL with n==0 (→0)"]

# --- Wave RAND: rand/srand (stdlib/rand_nt.c) ----------------------
# 48-bit-multiplier LCG over a u64 seed; hidden static state in the
# cabi RAND_STATE AtomicU64 (shared by both shims). RAND_MAX=0x7fff
# (Windows; the host's 0x7fffffff is overridden in the diff ref).

[symbols.rand]
c_signature  = "int rand(void)"
family       = "rand"
slice_pattern = "rand_step"
core_fn      = "rng::step"
return_collapse = "rand"
inout_effects = "advances the hidden LCG state (cabi RAND_STATE); returns (state>>16) & RAND_MAX"
preserved_misfeature = "LCG next = next*0x5deece66d + 11; returns bits 16..30 (RAND_MAX=0x7fff, NOT the host 0x7fffffff); non-reentrant hidden static (AtomicU64, single-threaded-equivalent)"
reference    = "sdk/lib/crt/stdlib/rand_nt.c"
fuzz_domain  = ["fresh (state 0)", "after srand(seed)", "long sequence", "srand resets the sequence"]

[symbols.srand]
