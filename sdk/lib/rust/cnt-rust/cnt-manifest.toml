inout_effects = "dest[0..count] ← src[0..count], overlap-safe (same algo as memcpy)"
preserved_misfeature = "none (textbook overlap-safe; identical body to memcpy.c)"
reference    = "sdk/lib/crt/mem/memmove.c"
fuzz_domain  = ["disjoint", "dst<src overlap", "dst>src overlap", "dst==src", "count==0"]

[symbols.memset]
c_signature  = "void* __cdecl memset(void* src, int val, size_t count)"
family       = "mem"
slice_pattern = "set_raw"
core_fn      = "mem::set"
