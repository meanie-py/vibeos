# --- Wave E1 (wcstoul — wide BSD parse, endptr) ---------------------
# Distinct algorithm from Wave B strtoul (cutoff/cutlim, NOT
# _strtoi64_l delegation). Windows `unsigned long` is 32-bit on ALL
# arches (LLP64) so the model is exactly u32 — no LP32 caveat; only
# the LP64 *host reference* needs the strtoul ULONG_MAX/(unsigned int)
# trick. ASCII-domain only (iswctype for ASCII is standard).

[symbols.wcstoul]
c_signature  = "unsigned long wcstoul(const wchar_t *nptr, wchar_t **endptr, int base)"
family       = "wstring"
slice_pattern = "wnul_endptr_base"
core_fn      = "radix::parse_ulong_wide"
return_collapse = "wcstoul"
inout_effects = "*endptr (if !=NULL) = nptr + (any ? first-non-consumed : 0); written even when no digits (→nptr)"
preserved_misfeature = "overflow saturates to ULONG_MAX but STILL advances endptr past every digit (sticky any=-1); leading '-' parses then result negated unsigned at end → -1→0xFFFFFFFF, negated-overflow→1 (NOT ULONG_MAX); base 0 ⇒ 0x→16 / 0→8 / else 10; no base validation"
reference    = "sdk/lib/crt/string/wcstoul.c"
fuzz_domain  = ["empty", "ws-only", "no digits (endptr=nptr)", "valid", "overflow-saturate", "negative (wrapping)", "neg-overflow→1", "base 0/2/8/10/16/36", "0x prefix", "mixed case", "endptr=NULL", "junk after"]

# --- Wave E2 (multibyte ⇄ wide, CP1252 single-byte model) -----------
# Genuine .c are thin Rtl* NLS wrappers; cnt-rust folds the Rtl* model
# (default-install ANSI = CP1252, single-byte) into core_rs::mbcp. The
# harness links the genuine wrapper .c against an IDENTICAL C CP1252
# Rtl* stub, so the diff pins the wrapper logic deterministically over
# the whole 0x00-0xFF single-byte domain. DBCS/lead-byte CPs = TODO.

[symbols.mbtowc]
c_signature  = "int mbtowc(wchar_t *wchar, const char *mbchar, size_t count)"
family       = "string"
slice_pattern = "mbtowc"
core_fn      = "mbcp::mbtowc"
return_collapse = "mbcp"
inout_effects = "*wchar = decoded wchar (single-byte CP ⇒ 1 byte consumed) UNLESS space-guard returns -1; mbchar/wchar NULL → 0"
preserved_misfeature = "space-guard: returns -1 (no *wchar write) if decoded==L' ' but mbarr[0]!=' ' (CP1252 never triggers it — only 0x20→U+0020 — but structurally pinned); count==0 → reads {0} → *wchar=0, ret 1"
reference    = "sdk/lib/crt/string/mbstowcs_nt.c"
fuzz_domain  = ["mbchar=NULL", "wchar=NULL", "count=0", "count=1", "count=2", "byte 0x00-0xFF incl 0x80-0x9F table + undefined slots"]

[symbols.mbstowcs]
c_signature  = "size_t mbstowcs(wchar_t *wcstr, const char *mbstr, size_t count)"
family       = "string"
slice_pattern = "mbstowcs"
core_fn      = "mbcp::mbstowcs"
return_collapse = "mbcp"
inout_effects = "wcstr=NULL → query, returns strlen(mbstr); else writes min(strlen,count) decoded wchars (NO NUL appended), returns that count"
preserved_misfeature = "NO NUL termination on convert (RtlMultiByteToUnicodeN writes only converted chars); query mode returns Size/sizeof(wchar_t); single-byte CP ⇒ wchars == mb length"
