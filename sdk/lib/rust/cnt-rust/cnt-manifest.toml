# --- Wave B (parse-with-endptr, clamp-on-overflow) ------------------

[symbols._strtoi64]
c_signature  = "__int64 _strtoi64(const char *nptr, char **endptr, int base)"
family       = "radix"
slice_pattern = "nul_endptr_base"
core_fn      = "radix::parse_i64_clamped"
return_collapse = "i64_endptr"
inout_effects = "*endptr = nptr + (got_digit ? after-last-digit : 0); not written if base invalid"
preserved_misfeature = "overflow CLAMPS to _I64_MAX/_I64_MIN (NOT wrap, unlike _atoi64); _LIBCNT_ sets no errno; endptr=original-nptr when no digit (leading ws/sign not reflected)"
