# cnt-rust — Rust reimplementation of the kernel/native C runtime
# (libcntpr's bucket-B surface: string / mem / parse / sort).
#
# Two layers (single source of truth, no divergence):
#   core_rs/  — idiomatic, slice-based, no_std, no_unsafe, Kani-able.
#               Honest contracts (Option/Result/plain per family). This
#               is THE implementation.
#   cabi/     — GENERATED by tools/gen_cnt.py from cnt-manifest.toml.
#               #[no_mangle] extern "C" shims: unsafe slice-reconstruct
#               + collapse the core return into the exact legacy C
#               contract (incl. load-bearing misfeatures).
#
# Faithful to ReactOS libcntpr semantics, NOT textbook libc (e.g.
# memcpy is overlap-safe; strlen(NULL)==0; atoi wraps, no overflow
# error). The differential harness (cnt-difftest) pins this against the
# real compiled reference.

[package]
name = "cnt-rust"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = ["float"]
# Enables the generated #[no_mangle] extern "C" shim layer. Off for
# pure-core consumers / Kani; on for the kernel link + cnt-difftest.
# Does NOT imply `float`: the i386 kernel links cabi WITHOUT float
# (no-SSE — see below). cnt-difftest gets float via `default`.
cabi = []
# ONLY cabi/math.rs's 66 #[no_mangle] libm exports (sin/cos/exp/pow/…),
# none of the other ~200 shims. For msvcrt-crt-cargo: msvcrt.dll's math
# exports bind to the same plain engine names crtmath defines, so the
# kernel-proven Rust libm flips them via lld first-match — but the full
# `cabi` layer would collide with msvcrt-crt-rust's own wrappers in the
# same staticlib (strlen, memcpy, …). A strict subset of `cabi` (enabling
# both == `cabi`). The msvcrt DIFFTEST must NOT see this feature: it
# links msvcrt-crt-rust (the rlib), not msvcrt-crt-cargo, precisely so
# these 66 symbols never shadow host libm under the reference TUs.
#
# NO LONGER a strict subset of `cabi`: the six Bessel wrappers (_j0/_j1/_jn/
# _y0/_y1/_yn) are cabi-math ONLY, because they call `_errno`, which the
# kernel does not have and does not want. cnt-rust is one codegen unit, so an
# ungated `_errno` reference would make the whole math object fail the kernel
# link. cnt-difftest enables BOTH features so those six are still graded.
cabi-math = []
# The CRT error contract on top of the math engines: a domain/pole/range error goes to
# `__cnt_math_error(type, name, arg1, arg2, retval)`, which each CRT defines (msvcrt's
# math_error, ucrtbase's _matherr path) -- errno and the user's _matherr live there. The
# kernel does not enable it and never references the hook.
crt-math-errors = ["cabi-math"]
# abs/labs/div/ldiv under cabi-math. msvcrt takes them from here; ucrtbase does
# NOT, because ucrt-rust's stdlib port answers them with Microsoft's contract
# (a zero divisor traps on x86 and gives sdiv's 0 on arm64, where this body's `/`
# would panic) and two #[no_mangle] copies in one staticlib link by luck. The
# kernel's `cabi` build always has them.
cabi-intdiv = []
# The `core_rs` forbid-unsafe float surface: `core_rs::{floatcvt,scanf}`
# + the matching `cabi/manual.rs` shims (_fcvt/_ecvt/_gcvt/_gcvt_s +
# cnt_vs*scanf). Default-on so cnt-difftest / standalone are unchanged.
# i386 (the no-SSE kernel, CR4.OSFXSR unset in Phase 0) sets
# `default-features = false`: floatcvt/scanf live in `core_rs`, which is
# `#[forbid(unsafe_code)]`, so their by-value `f64` returns CANNOT be
# routed around no-SSE (the fb64/fb32 `transmute` trick needs `unsafe`)
# → they stay C on i386.
#
# NOTE: `cabi::math` (the whole transcendental surface) is NOT gated by
# this — it compiles unconditionally and is no-SSE-safe via `extern "C"`
# x87 returns + the fb64/fb32 transmute shims (it lives in `cabi`, where
# `unsafe` is allowed). So `float` no longer means "all floating point";
# it means specifically the core_rs forbid-unsafe part.
float = []

[dependencies]

# The math engines (src/cabi/math.rs): the `libm` crate (MIT) for log10/fmod, and our
# port of musl's current exp/exp2/log/pow (`musl-math`, MIT), which round to the nearest
# double far more often than libm's FreeBSD versions. Not on the builtin i686 triple with
# -sse,-sse2 (the i386 ntdll/win32k cells and libcntpr): there rustc rejects their
# Rust-ABI f64 functions outright, and cnt-rust keeps its own extern-"C" bodies or leaves
# the symbol to the x87 asm. The i386 kernel's `x86-softfloat` json reports `soft-float`
# and builds both fine. build.rs names this condition `cnt_libm` for the source.
[target.'cfg(not(all(target_arch = "x86", not(target_feature = "sse2"), not(target_feature = "soft-float"))))'.dependencies]
libm = "0.2.16"
musl-math = { path = "../musl-math" }
