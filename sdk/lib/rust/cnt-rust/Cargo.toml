# cnt-rust — Rust reimplementation of the kernel/native C runtime
# (libcntpr's bucket-B surface: string / mem / parse / sort).
#
# Two layers (single source of truth, no divergence):
#   core_rs/  — idiomatic, slice-based, no_std, no_unsafe, Kani-able.
#               Honest contracts (Option/Result/plain per family). This
#               is THE implementation.
#   cabi/     — GENERATED by tools/gen_cnt.py from cnt-manifest.toml.
#               #[no_mangle] extern "C" shims: unsafe slice-reconstruct
#               + collapse the core return into the exact legacy C
#               contract (incl. load-bearing misfeatures).
#
# Faithful to ReactOS libcntpr semantics, NOT textbook libc (e.g.
# memcpy is overlap-safe; strlen(NULL)==0; atoi wraps, no overflow
# error). The differential harness (cnt-difftest) pins this against the
# real compiled reference.

[package]
name = "cnt-rust"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
# Enables the generated #[no_mangle] extern "C" shim layer. Off for
# pure-core consumers / Kani; on for the kernel link + cnt-difftest.
cabi = []

[dependencies]
