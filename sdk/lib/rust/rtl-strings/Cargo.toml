# rtl-strings — Rust translation of ReactOS `sdk/lib/rtl/unicode.c`
# (the NT Rtl* UNICODE_STRING / ANSI_STRING / OEM string surface).
#
# Two layers, same discipline as cnt-rust:
#   core_rs/ — idiomatic, slice-based, no_std, no_unsafe. THE impl
#              (the {Length,MaximumLength,Buffer} semantics + the
#              faithful ReactOS misfeatures).
#   cabi/    — #[no_mangle] extern "system" NTAPI shims: unsafe
#              struct-reconstruct + the exact legacy Rtl* contract.
#
# Shared NLS truth: the code-page-dependent waves reuse cnt-rust's
# core_rs CP1252 model (ONE truth) — Wave RTL-2 (case-insensitive
# upcase) is the first consumer.
[package]
name = "rtl-strings"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
# The #[no_mangle] extern "system" shim layer (off for pure-core /
# Kani consumers; on for the kernel link + rtl-difftest).
cabi = []
# Kernel-link extras: the nls.c structural sub-bucket (CP-table
# machinery + Nls* globals + Rtlp{Up,Down}caseUnicodeChar) and utf8-
# shim suppression (the dedicated `utf8` crate owns those in the
# kernel). OFF for rtl-difftest (it models Nls* itself + fuzzes utf8).
kernel = ["cabi", "seh"]
# The SEH trampolines (ntkrnl_sys::seh) behind the validators' catch-all: on with `kernel`,
# whose two links (ntoskrnl, ntdll) both export RtlSehTryExcept.
seh = ["dep:ntkrnl-sys"]
# ntoskrnl: THIS copy runs in the kernel. `kernel` above names the export surface, which ntdll
# also gets (rtl-rust's default features), so it cannot gate an ntdll-only path.
ntoskrnl = ["kernel"]
# The boot loaders' unicode.c (blrtl-rust): exactly unicode.c's exports, calling nlsboot
# (blrtl-rust) for the NLS layer and RtlpAllocateMemory/RtlpFreeMemory (freeldr-rust)
# for memory. Mutually exclusive with `kernel` in practice: the two supply that layer.
bldr = ["cabi"]

[dependencies]
# Only the integer CP1252 `mbcp` model is reused (ONE NLS truth).
# default-features=false drops cnt-rust's `float` modules (floatcvt /
# scanf) — unused here and uncompilable for the no-SSE i386 kernel.
cnt-rust = { path = "../cnt-rust", default-features = false }
# `kernel` only: the SEH trampolines (ntkrnl_sys::seh) behind the validators' catch-all.
# ntoskrnl and ntdll both export RtlSehTryExcept; the boot loader and the host
# difftest have no SEH, so they keep the unguarded read.
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, optional = true }
