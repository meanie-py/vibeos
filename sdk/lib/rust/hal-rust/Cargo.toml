[package]
name = "hal-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

# Standalone crate (not an `rlib` umbrella'd by something else) — directly
# produces libhal_rust.a which CMake links into the hal.dll module target.
# Unlike kernel-rust (which is an umbrella over many rlibs because the
# kernel translation grew that way), hal-rust is single-crate for now.
# Can be split into rlibs later if/when the surface justifies it.

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }

[features]
# When enabled, gates out the runtime-only paths from the i386 HAL surface
# so the resulting libhal_rust.a is suitable for linking into mini_hal
# (FreeLDR's loader-time HAL).  Functions that the C tree wraps in
# `#ifndef _MINIHAL_` are `#[cfg(not(feature = "minihal"))]` in Rust.
default = []
minihal = []
# SMP HAL build (smp-bringup-quest.md): drops PRCB_BUILD_UNIPROCESSOR from
# HalpBuildType (the kernel/HAL MISMATCHED_HAL handshake) and raises
# HalpIrqlSynchLevel to IPI_LEVEL-2. Enabled via VIBEOS_SMP_HAL=1 env →
# hal-cargo build.rs (plumbed from cmake -DVIBEOS_SMP_DEFAULT_BOOT=ON, i.e.
# `vibeos-cli build --smp-kernel`). An smp HAL pairs with ntkrnlmp.exe and
# REFUSES the UP ntoskrnl.exe (exact-equality BuildType check) — by design.
smp = []
