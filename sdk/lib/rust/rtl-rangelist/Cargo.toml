[package]
name = "rtl-rangelist"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/rangelist.c — RTL_RANGE_LIST algorithm
# (add/delete/find/copy/invert/merge/iterate address ranges). Uses the
# ntkrnl-sys RTL_RANGE* layout + the shared RtlpAllocateMemory/RtlpFreeMemory
# helpers. Shared kernel+user via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
