# Cargo-driven `mplay32.exe` link, generated by tools/cargo_cell_gen.py.

[package]
name = "mplay32-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mplay32"
path = "src/main.rs"

[dependencies]
panic-lean = { path = "../panic-lean" }
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
