# pciidex-rust — Rust translation of the PCI IDE bus extension driver
# (drivers/storage/ide/pciidex, ~1.9K LOC: fdo.c/pdo.c/pciidex.c/miniport.c/power.c).
# pciidex.sys is an EXPORT driver (pciidex.spec: PciIdeXInitialize/GetBusData/SetBusData
# stdcall + PciIdeXDebugPrint varargs) AND boot-loaded — the live uniata.sys (C++) and
# pciide.sys both link its PciIdeX* imports, so a Rust pciidex is smoke-exercised. The
# .spec exports come from the Rust #[no_mangle] symbols; crate-type=staticlib →
# libpciidex_rust.a, cohab-linked into the cmake pciidex.sys with the 5 .c commented out
# and spec2def kept. Driver-private structs (PCIIDEX_DRIVER_EXTENSION, COMMON/FDO/PDO_
# DEVICE_EXTENSION + IDE_CONTROLLER_PROPERTIES) from the gen_driver_types.sh substrate
# (src/types.rs). Depends on ntkrnl-sys. Built for all 3 arches. DeepSeek+c2rust.

[package]
name = "pciidex-legacy-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["kernel"] }
ntkrnl-sys = { path = "../ntkrnl-sys" }
