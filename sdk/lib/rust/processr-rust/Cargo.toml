# processr-rust — Rust translation of drivers/processor/processr/{processr,misc,
# pnp}.c (the ACPI/CPU processor driver, processr.sys). crate-type=staticlib →
# libprocessr_rust.a, linked into the cmake-built processr.sys with the .c files
# commented out (i8042prt-rust style cohabitation). Standalone kernel-mode driver
# on the ntkrnl-sys substrate. Built for all 3 arches. DeepSeek+c2rust translation
# (Batch 3 driver residue). C kept on disk per the never-delete rule.

[package]
name = "processr-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
