# kdgdb-rust — Rust translation of ReactOS drivers/base/kdgdb (the GDB-stub
# KD transport). crate-type=staticlib → libkdgdb_rust.a, intended to link
# into kdcom.dll via a cargo-driven `kdgdb-cargo` (reactos-link engine),
# mirroring the kdcom-rust + kdcom-cargo split.
#
# NOTE: kdgdb only builds into the system under _WINKD_=TRUE + GDB=TRUE, which
# the default llvm-mingw build never sets (config.cmake forces _WINKD_=FALSE).
# This crate is therefore validated standalone via `cargo build -p kdgdb-rust`
# (i386 + amd64; kdgdb has no arm64 path), independent of the cmake gate.

[package]
name = "kdgdb-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

# kdgdb.h hard-codes `#define MONOPROCESS 1` (the GDB single-process workaround),
# so the MONOPROCESS code paths are the live ones. Enabled by default to mirror C.
[features]
default = ["MONOPROCESS"]
MONOPROCESS = []
KDDEBUG = []

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
