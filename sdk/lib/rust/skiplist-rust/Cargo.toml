# skiplist-rust — Rust translation of sdk/lib/skiplist/skiplist.c (the "skiplist16"
# static lib: a probabilistic ordered list with SKIPLIST_LEVELS=16 fixed levels,
# consumed by win32ss/printing/.../localspl). DeepSeek-translated, deepdrive-ground.
[package]
name = "skiplist-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "skiplist_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
# (none) — pure-algorithm crate. The C ABI scalar typedefs it needs
# (PVOID/DWORD/BOOL) are defined locally in src/skiplist.rs, so it carries no
# Windows-only dependency and is host-testable via `cargo test`.
