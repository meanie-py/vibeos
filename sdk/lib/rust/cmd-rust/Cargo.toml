# cmd-rust — see src/lib.rs for the module map.
[package]
name = "cmd-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "cmd_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
# C-variadic entry points -> rust_varargs_shim.c (stable Rust cannot define one).
varargs-rust = { path = "../varargs-rust" }
conutils-h = { path = "../conutils-h" }
strsafe-rust = { path = "../strsafe-rust" }
wcwidth-rust = { path = "../wcwidth-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
win32macros-rust = { path = "../win32macros-rust" }

# cmd's C builds at WS03 (_WIN32_WINNT=0x502): its `#if NTDDI_VERSION >= NTDDI_WIN7` code is
# compiled out, so this cfg is never set.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ntddi_ge_ntddi_win7)'] }
