[package]
name = "rtl-ppb"
version = "0.1.0"
edition = "2021"

# Rust translation of sdk/lib/rtl/ppb.c — RTL_USER_PROCESS_PARAMETERS
# creation / destruction / normalize / denormalize. Uses ntkrnl-sys for the
# exact (size-asserted) RTL_USER_PROCESS_PARAMETERS / CURDIR / PEB layout
# (the block is normalized via pointer↔offset arithmetic, so layout must be
# byte-exact). Shared by ntoskrnl + ntdll via librtl_rust.a.

[lib]
crate-type = ["rlib"]

[dependencies]
# Not hal_bindgen: librtl DEFINES NlsMbCodePageTag/NlsMbOemCodePageTag/NlsOemLeadByteInfo,
# and hal_bindgen raw-dylib-imports them from ntoskrnl.exe -- both in one archive, so which
# one a reference got was archive order (amd64 ntdll: lld crashed in IdataContents).
ntkrnl-sys = { path = "../ntkrnl-sys", default-features = false, features = ["inline_exports", "dbg"] }
