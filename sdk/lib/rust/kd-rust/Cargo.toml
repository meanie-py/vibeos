# kd-rust — extracted from ntoskrnl-rust (crate-split Phase 1b).
[package]
name = "kd-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
va-slots-rust = { path = "../va-slots-rust" }
ntkrnl-sys = { path = "../ntkrnl-sys" }
dbgprint-rust = { path = "../dbgprint-rust" }
# crash-value: the REAL serial KD transport (WinDbg packet framing) embedded
# as an rlib; armed at runtime by /DEBUG /DEBUGPORT=COM2 (KdpWireTransportArm).
kdcom-serial-rust = { path = "../kdcom-serial-rust", features = ["embedded"] }
