# kmdf-sys — focused FFI substrate for the KMDF (Kernel-Mode Driver Framework)
# client binding, for the ReactOS `cdrom` driver translation (the fleet's only
# KMDF driver). This is NOT a framework reimplementation: the KMDF runtime
# (Wdf01000.sys) + loader (wdfldr.sys) + the WdfDriverEntry bind stub already
# build and boot in-tree. kmdf-sys only provides the *client-side* glue the C
# compiler synthesizes from <wdf.h>:
#   - types.rs   : bindgen of the WDF 1.17 headers (WDF handle types, value
#                  structs WDF_OBJECT_ATTRIBUTES / WDF_IO_QUEUE_CONFIG / ...,
#                  the PFN_WDFXXX dispatch-pointer typedefs, and the 444-entry
#                  WdfXxxTableIndex enum). Generated by gen_driver_types.sh kmdf.
#   - dispatch.rs: one `#[inline] unsafe fn WdfXxx(..)` per API, a 1:1 Rust
#                  translation of the FORCEINLINE C body
#                  `((PFN_WDFXXX) WdfFunctions[WdfXxxTableIndex])(WdfDriverGlobals, ..)`.
#                  Generated by gen_kmdf_dispatch.py. WdfFunctions / WdfDriverGlobals
#                  are defined by the C wdfdriverentry stub and populated at load by
#                  WdfVersionBind — kmdf-sys declares them extern and dispatches.
# Per-arch. no_std. rlib (consumed by the cdrom-rust staticlib).
# See docs/engineering/driver-translation-audit.md + project_cdrom_kmdf_blocker.

[package]
name = "kmdf-sys"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
