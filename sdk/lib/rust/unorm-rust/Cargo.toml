# unorm-rust — Unicode normalization (NFC/NFD/NFKC/NFKD) over UTF-16, from the vendored UCD.
# See src/lib.rs. Tables: src/tables.rs, generated by `tools/codegen unorm`.
[package]
name = "unorm-rust"
version = "0.1.0"
edition = "2021"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
# rlib: consumers (kernel32-rust) pull it in as a path dependency, like strsafe-rust.
crate-type = ["rlib"]

# No dependencies, no allocation: the type basis is u16 code units and u32 code points,
# which every consumer's WCHAR/UINT already are.
[dependencies]

[package.metadata.difftest]
# Run the known-answer #[test]s in `vibeos-cli difftest` (and so in the gate).
host-tests = true
