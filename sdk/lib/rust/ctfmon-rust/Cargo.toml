# ctfmon-rust — see src/lib.rs for the module map.
[package]
name = "ctfmon-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "ctfmon_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
cicero-rust = { path = "../cicero-rust" }  # cicero itself (ctfmon links the cicero library)
strsafe-rust = { path = "../strsafe-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
win32macros-rust = { path = "../win32macros-rust" }
atlclasses-rust = { path = "../atlclasses-rust" }
