# Cargo-driven `ufat.dll` link, generated by tools/cargo_cell_gen.py.

[package]
name = "ufat-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ufat"
path = "src/main.rs"

[dependencies]
panic-lean = { path = "../panic-lean" }
[build-dependencies]
reactos-link = { path = "../reactos-link" }
