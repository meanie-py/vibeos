[package]
name = "cabinet-rust"
version = "0.1.0"
edition = "2021"

[lib]
# Standalone staticlib → cabinet.dll. Provides its own panic_handler + eh_personality.
crate-type = ["staticlib"]

[dependencies]
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
winedebug-rust = { path = "../winedebug-rust" }
# Pure-Rust C-ABI zlib (Trifecta zlib-rs). no_std (default-features=false drops
# std + rust-allocator); `export-symbols` emits the unprefixed C names
# (deflateInit2/deflate/deflateEnd) cabinet's fci.rs extern "C" block calls.
# cabinet always sets z_stream.zalloc/zfree, so allocation routes through
# cabinet's own allocator — no global/rust/c allocator needed.
libz-rs-sys = { version = "0.6.3", default-features = false, features = ["export-symbols"] }
