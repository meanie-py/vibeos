# evtlib-rust — Rust translation of sdk/lib/evtlib (the NT-format event-log
# file I/O library, used by eventlog.dll / services/eventlog). Cohabitation
# staticlib (libevtlib_rust.a): the `evtlib` cmake target removes evtlib.c and
# links this archive so the Elf* NTAPI symbols (extern "system") take over.
# Mirrors rossym-rust / cmlib-rust: one #[panic_handler] + eh_personality here.

[package]
name = "evtlib-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ntkrnl-sys = { path = "../ntkrnl-sys" }
