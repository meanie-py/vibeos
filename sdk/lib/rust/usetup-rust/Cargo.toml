# usetup-rust — see src/lib.rs for the module map.
[package]
name = "usetup-rust"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "usetup_rust"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
varargs-rust = { path = "../varargs-rust", features = ["rust-pullers"] }
strsafe-rust = { path = "../strsafe-rust" }
panic-common = { path = "../panic-common", features = ["user"] }
ntdll-sys = { path = "../ntdll-sys" }
win32macros-rust = { path = "../win32macros-rust" }
