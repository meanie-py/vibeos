# Cargo-driven `framebuf.dll` link (i386 + amd64 + arm64). The GDI framebuffer
# display driver (loaded by win32k on every UEFI GOP/linear-framebuffer boot).
# Sibling of `arm64vid-cargo`, but a `kerneldll` whose PE entry is
# DrvEnableDriver@12 and which imports win32k (not ntoskrnl/hal). The Rust body
# is the `framebuf-rust` staticlib.

[package]
name = "framebuf-cargo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "framebuf"
path = "src/main.rs"

[dependencies]
panic-common = { path = "../panic-common", features = ["raw"] }
[build-dependencies]
reactos-link = { path = "../reactos-link" }

[lints.rust]
# lld reports every duplicate symbol it resolves under --allow-multiple-definition
# as a warning; surface it so tools/scan_link_duplicates.py can read it back
# from cargo's cached diagnostics.
linker_messages = "warn"
