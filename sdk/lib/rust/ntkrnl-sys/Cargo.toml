[package]
name = "ntkrnl-sys"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
# hal_bindgen on by default — kernel + HAL crates use it. Pre-kernel
# consumers (freeldr-rust) opt out via `default-features = false` to
# avoid rustc emitting raw-dylib import thunks for ntoskrnl.exe symbols
# (NlsMb*/NlsOem*) that don't exist at freeldr's link time and conflict
# with blrtl/nlsboot.c (task #33).
default = ["hal_bindgen", "inline_exports", "dbg"]
# Mirror of the C kernel's `-DDBG=1` for the inline lock helpers. CMakeLists.txt
# sets DBG=1 for every configuration this tree builds, and the C side of the
# spinlock funnel (ntoskrnl/include/internal/spinlock.h, KI_TRACK_SPINLOCK_OWNER)
# keys the owner stamp off it. The two halves MUST agree: if one stamps a lock
# and the other does not clear it, the lock stays dirty. ON by default for that
# reason — turn it off only together with the C macro.
dbg = []
hal_bindgen = []
# Emit real symbols for translated FORCEINLINE/global-asm kernel helpers.
# Kernel-owned Rust crates use the default feature set. Cohab leaf libraries
# that only need DDK declarations opt out so their staticlibs cannot perturb
# early KE symbol selection under --allow-multiple-definition.
inline_exports = []
# probe.rs reads MmUserProbeAddress, a DATA export of ntoskrnl. Inside ntoskrnl a
# plain extern binds the local definition; a separate driver (ks, npfs, mup) must
# import it instead, or the link fails (i386/arm64: undefined symbol). Drivers that
# use the Result probes turn this on.
import_mm_user_probe_address = []
# The lookaside inlines (inline/ex.rs) pop/push through RtlInterlocked*EntrySList, which bind
# only inside ntoskrnl. A driver that inlines a lookaside allocate/free (storport) calls the
# exports wdm.h gives a driver instead.
driver_slist = []
# sync-instrumentation §4 Tier-2 lockdep: light up the pushlock-inline
# acquire/release taps (they call ntoskrnl-rust's VibeosLockdep* by link name).
# Off by default = zero cost; enabled transitively by ntoskrnl-rust/lockdep.
lockdep = []
# cswitchdep P2 (cswitchdep-design.md): light up the spinlock held-counter
# taps at the Kx choke point (inline/ke.rs) — they call ntoskrnl-rust's
# VibeosCswitchdepSpin* by link name, same shape as the lockdep taps.
# Enabled transitively by ntoskrnl-rust/cswitchdep.
cswitchdep = []
# CONFIG_SMP for the inline lock helpers (inline/ke.rs "UP no-op lock
# functions" → real interlocked bodies). Enabled transitively via the
# per-crate smp features; only the ntkrnlmp-cargo link turns it on.
smp = []
