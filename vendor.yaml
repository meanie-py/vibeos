      (dll/win32/windowscodecs/libtiff.c, 29 API symbols, all long-stable core calls). The
      spec2def exports all resolved, which is the check a removed export would have failed.
      The new DoS guard TIFF_MAX_DIR_COUNT defaults to 1048576 via tiffiop.h and is
      therefore ACTIVE even though our config does not set it; STRIP_SIZE_DEFAULT likewise
      defaults to 8192. CHUNKY_STRIP_READ_SUPPORT and DEFER_STRILE_LOAD stay off, as they
      were under 4.1.0.

      NOT verified: there is no TIFF decode test in this tree and libtiff is not on the boot
      path, so the smoke suite does not exercise a single line of this. The evidence is
      compile-and-link plus byte-identity with upstream, not runtime behaviour. Anyone
      adding a WIC image test should point it here first.

