# vendor.yaml — the registry of which C/C++ in this tree is ours to translate.
#
# Two halves. `trees:` is what we do NOT translate. `ours:` is foreign-COPYRIGHT code we
# DO — the verdicts that used to have nowhere to live. See the header above `ours:`.
#
# THE RUST HALF LIVES IN tools/rust-crates.yaml. This file models vendored C/C++
# only. Its question — "is this ours to translate?" — is meaningless for a crates.io
# dependency, because crates are the translation DESTINATION; but the registry's other
# job, provenance and licensing for what we ship, applies to them in full, and until
# 2026-09-20 nothing tracked them at all. smoltcp, which IS the TCP/IP stack, shipped
# unrecorded. That half is GENERATED from `cargo metadata` (`--write-crates`), gated
# for freshness against sdk/lib/rust/Cargo.lock by `check`, and feeds the same
# THIRD-PARTY-NOTICES.md. Note `--suspects` still cannot see crates and never will:
# it walks directories for foreign copyright headers, and crates live in
# ~/.cargo/registry, outside the repo. Discovery there is the lockfile's job.
#
# WHY THIS EXISTS
# ---------------
# The project's goal is Rust, so the only number that matters is "how much of the C
# that is OURS is translated". That question has no answer unless something says which
# C is ours. Before this file, three places claimed to:
#
#   * docs/engineering/rust-port-status.md  — prose, names ACPICA + FreeType
#   * external/README-fex-vendor.md         — a good manifest, covering exactly one tree
#                                             (now vendor-patches/fex.md)
#   * tools/verify_conv_macros.py:_VENDORED — a 6-entry hardcoded tuple
#
# Three lists, three different contents, none of them complete. The tuple covered 5 of
# the 19 directories under sdk/include/reactos/libs/, carried one stale entry that
# matches nothing (`libs/libxml`), and omitted the four largest trees there.
#
# A GLOB CANNOT REPLACE THIS LIST. sdk/include/reactos/libs/ mixes third-party with
# ReactOS-native code — audiosrv, samsrv, umpnpmgr, syssetup, fslib, fmifs, epsapi,
# cportlib and fast486 are all ours, sitting in the same directory as zlib and mbedtls.
# When this file was written no path convention encoded vendored-ness: ACPICA lived
# under drivers/, FreeType under sdk/lib/3rdparty/, FEX under external/. The 2026-09
# relocation gathered every tree into vendor/<lib> except the CRT-coupled three (ucrt,
# ieee754, libm_sse2), and `vendor` is a container. The list stays explicit anyway:
# versions, licences and patches live here, and `vendored.py --check` refuses a
# directory under a container that is not in it.
#
# VERSION IS A PROBE, NOT A COPY. Each entry says WHERE its version lives (file +
# regex) and the tool derives it on demand. A copied literal is a second source of
# truth that goes stale silently at the next re-vendor — which is how the tree ended
# up with 78K lines of Microsoft ucrt carrying no version stamp at all.
#
# Adding a vendored tree: add an entry here, run `tools/vendored.py --write-stamps`.
# Field reference and the check semantics: tools/vendored.py.

# `vendor/` is THE home for vendored code (owner decision 2026-09-25: `vendor/<libname>`);
# trees are moving there in batches, see docs/engineering/vendor-relocation-plan.md.
# The other three containers empty out as they do.
#
# Directories whose every immediate child is a vendored tree and must be registered.
# This is what makes --check a ratchet rather than a snapshot: drop a new library into
# one of these and the gate fails until it has an entry.
containers:
  - vendor
  - sdk/lib/3rdparty
  - dll/3rdparty

trees:
  # ── ACPI ────────────────────────────────────────────────────────────────
  - path: vendor/acpica
    name: ACPICA
    translate: keep
    upstream: https://github.com/acpica/acpica
    license: BSD-3-Clause OR GPL-2.0  # Intel dual-licence
    license_ref: vendor/acpica/include/acpi.h
    modified: yes  # 7 host-port files; the other 219 differ only by licence FORM
    patch: vendor-patches/acpica.patch
    version:
      file: vendor/acpica/include/acpixf.h
      pattern: '#define ACPI_CA_VERSION\s+(0x[0-9A-Fa-f]+)'
    review: >
      BUMPED 20221020 -> 20260408 ON 2026-09-20, three and a half years, and the patch
      now ROUND-TRIPS BYTE-FOR-BYTE for the first time — the previous one was
      deliberately incomplete. All three arches build AND BOOT TO THE DESKTOP MARKER,
      which for a tree on the boot path is the gate that matters.

      SEVEN SHIMS BECAME SIX. hardware/hwgpe.c carried the only unguarded non-header
      code edit in the tree — a `(UINT64)` cast on RegisterBit inside ACPI_CLEAR_BIT
      that could not change the low 8 bits of the UINT8 EnableMask. The previous review
      called it "worth dropping or marking next time someone is in there"; this was that
      time. Dropped, and all three arches compile the file with no warning at all, so
      the truncation it was silencing does not exist under our flags.

      THE LICENCE-FORM PROBLEM IS NOW SOLVED RATHER THAN WARNED ABOUT. Our files carry
      the pre-SPDX Linux-format header, upstream's tarball ships the long form, and that
      difference alone accounts for 35,271 of the 35,271-line naive diff. Instead of
      leaving a "re-vendor from the linuxized form" instruction that nobody can execute,
      the patch header states the substitution exactly: in each file there is exactly
      one leading comment block containing both "Intel Corp" and a NO WARRANTY
      disclaimer — verified 226 of 226, same block index in both forms — and it is
      replaced by a single canonical 36-line block, identical in all 226 files after
      year-normalisation, with start year always 2000 and end year taken from upstream's
      own line. Pristine + that substitution + the patch reproduces the tree exactly.

      AND THE PROBLEM IS GOING AWAY BY ITSELF. Upstream converted to a one-line
      `SPDX-License-Identifier: BSD-3-Clause OR GPL-2.0-only` on master AFTER the
      20260408 release. The next bump past a release carrying that conversion sheds the
      substitution entirely — and gains a machine-readable tag that
      `vendored.py --licences` reads directly. Taking the long form now instead would
      have cost +1.49 MB of boilerplate that upstream has already deleted.

      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20 (open-acpica/acpica tag R10_20_22 — the
      acpica/acpica org redirects there, and tags are date-encoded MM_DD_YY so 20221020 is
      R10_20_22; sha256 1aa17eb1779cd171110074ce271a65c06046eacbba7be7ce5ee71df1b31c3b86).
      The entry said `modified: yes` with no patch and no review. Version confirmed exactly:
      upstream acpixf.h carries ACPI_CA_VERSION 0x20221020, matching our probe.

      THE HEADLINE IS A TRAP FOR THE NEXT PERSON. Diffed naively, ALL 226 vendored files
      differ — and 219 of them differ ONLY inside the top-of-file licence comment. That is a
      DISTRIBUTION FORM, not a modification: our tree carries the pre-SPDX "Linux-format"
      ACPICA header (short BSD-3-Clause conditions, the "Alternatively ... GPL version 2"
      arm, and NO WARRANTY), which Intel generates itself via ACPICA's generate/linux
      tooling and which Linux shipped verbatim through v4.x — verified character-for-
      character against torvalds/linux v4.4 drivers/acpi/acpica/tbutils.c, only the
      copyright year differing. The raw GitHub tree carries Intel's long form with numbered
      sections 1-4 (patent grant, 3.1-3.5 redistribution conditions, export compliance). So
      the recorded licence `BSD-3-Clause OR GPL-2.0` describes OUR files correctly; re-
      vendor from the linuxized form or you will re-create this 219-file phantom.

      Only 7 files carry real changes, all host-port shims and 5 of them cleanly
      __REACTOS__-guarded: acpi.h pulls in ntddk.h and #undefs ACPI_BIOS_ERROR; acenv.h
      picks ACPI_OSL_MUTEX and (UNGUARDED) widens the compiler-select #if for __clang__ and
      to exclude WIN64 so a clang/mingw PE64 build lands on acwin64.h; acgcc.h / acmsvc.h /
      acwin.h suppress upstream's inline-asm cache-flush and Global Lock macros; acwin64.h
      reimplements them with __wbinvd() and Interlocked* (standard ACPICA port practice).
      The seventh, hardware/hwgpe.c, is the ONLY unguarded non-header code edit in the whole
      tree: a (UINT64) cast on RegisterBit inside ACPI_CLEAR_BIT that cannot change the low
      8 bits of the UINT8 EnableMask — inert, almost certainly a truncation-warning
      silencer, worth dropping or marking next time someone is in there.

      SECURITY: nothing in the vendored tree touches ACPI table/AML parsing, bounds checking
      or allocation. All 9 tables/*.c and all 14 resources/*.c differ only in the header —
      re-checked independently by measuring the highest upstream line any hunk reaches
      (upstream's licence block ends around line 150), not taken on faith from the first
      pass.

      NOTE THE PATCH IS DELIBERATELY INCOMPLETE and so does NOT reproduce the tree byte-for-
      byte, unlike the others in vendor-patches/: it carries the 7 real files only, because
      the alternative is ~30k lines of licence boilerplate that says nothing. The patch
      header explains how to re-verify the 219 claim in one command. 187 upstream files are
      not vendored at all — ASL compiler, disassembler, debugger, tools, OS service layers —
      none of which a runtime kernel driver needs.
    reason: >
      Intel's ACPI Component Architecture, the reference implementation every OS
      vendors rather than reimplements. Tracking upstream is worth more than owning
      the code, and a Rust fork would have to be re-merged on every ACPICA release.
      The Rust-facing boundary is sdk/lib/rust/acpica-sys.

  # ── the kernel/user driver framework ────────────────────────────────────
  - path: vendor/wdf
    name: Windows Driver Frameworks (KMDF/UMDF)
    translate: planned
    upstream: https://github.com/microsoft/Windows-Driver-Frameworks
    license: MIT  # upstream relicensed the WDF sources to MIT in 2017
    license_file: vendor/wdf/LICENSE
    modified: "lightly"  # ~35 marker files + mechanical portability; see review
    patch: vendor-patches/wdf.patch
    version:
      file: vendor/wdf/CMakeLists.txt
      patterns:
        - '__WDF_MAJOR_VERSION=(\d+)'
        - '__WDF_MINOR_VERSION=(\d+)'
        - '__WDF_BUILD_NUMBER=(\d+)'
      join: "."
    review: >
      LICENCE TEXT IS NOT IN THE TREE. 474 of 488 files carry a Microsoft copyright
      line and not one carries a grant. The `MIT` in this entry comes from upstream's
      2017 relicensing of the WDF sources — a fact about the world, not a quotation from
      this tree. Nothing here can be cited for it.
      GPL FILES REMOVED 2026-09-19, tree now Microsoft's alone. It used to carry 3,851
      lines of ReactOS-authored GPL-2.0-or-later code inside this MIT drop — not
      adapters but REIMPLEMENTATIONS of two Microsoft components the source drop does
      not contain: WdfLdr.sys (the KMDF loader) and WdfDriverEntry.lib. They are now
      sdk/lib/drivers/{wdfldr,wdfdriverentry}, built from sdk/lib/drivers/CMakeLists.txt.
      Three ReactOS headers went to sdk/lib/drivers/wdf_reactos/include/: usbspec.h and
      wdfcx.h, which Perevertkin wrote in 2020 as "Missing headers" so THIS drop would
      compile, and wdfldr.h, the loader's exported interface. wdfldr_.h was deleted — 38
      lines, referenced nowhere, and its own comment said "likely to be removed when the
      proper wdfldr.sys is ready", which it has been since 2019.

      THE COUPLING IS NOT GONE AND IS NOT AN ACCIDENT: wdf01000 still puts
      sdk/lib/drivers/wdfldr on its include path and does `add_importlibs(wdf01000
      wdfldr ...)`. That is how KMDF works — the framework binds to a loader — so an
      upstream WDF drop would still need our loader supplied beside it rather than
      inside it. What changed is that the dependency is now across a tree boundary
      instead of hidden as files in someone else's directory.

      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20, and both open questions on this entry are
      now answered.

      THE LICENCE GAP IS CLOSED. Upstream ships a LICENSE at the repo root — plain MIT,
      "Copyright (c) 2015 Microsoft", sha256
      cf248820bf1178370bb4f1670a59f8748d46bc96d0f64080cd631511c6046409 — which our drop
      simply failed to bring along. It is now vendored at vendor/wdf/LICENSE and
      `license_file` points at it, so the MIT grant is reproducible from the tree and the
      old `license_note` ("correct by provenance, unstated by us") is retired.

      WHICH UPSTREAM: tag win-10.0.10586.0 (Windows 10 1511), archive sha256
      6289cf8b5284ab27a801f7a04d9bb35c893159e82c04055df079e3ab3dcb3304. Chosen by
      measurement, not assumption: sampled files bottom out there (powerstatemachine.cpp 57
      changed lines at neighbouring tags versus 2 at 10586.0; fxpkgpnp.cpp 465 versus
      478/517), and src/publicinc/wdf/kmdf/1.17 first appears at that tag. NOTE our
      CMakeLists bakes __WDF_BUILD_NUMBER=7600, the Windows 7 RTM build, next to KMDF 1.17
      which is a Windows 10-era version — internally inconsistent, and NOT evidence of
      provenance. No Win7-era tag exists upstream at all.

      THE "9 of 488 files mention ReactOS" FIGURE WAS WRONG — it is ~35. Case-insensitive
      `grep -ri reactos` matches 35 files, case-sensitive 34 (lowercase `// reactos start`
      blocks were being missed). Separately, ROSWDFNOTIMPLEMENTED marks stubbed functions in
      5 files, and that is a DIFFERENT mechanism — poxinterface.cpp has its entire Power-
      Framework interop commented out behind it while containing no literal "reactos" text
      at all, so a grep-only survey misses it completely.

      SCALE, REMEASURED 2026-09-20 during patch-ification, and the file-set question is
      now settled: we vendor src/framework/ ENTIRELY — all 475 files, none skipped, none
      added, mapping 1:1 with no case-only or ambiguous names. src/publicinc/ is not
      vendored AT ALL (156 files), which corrects the earlier note that only kmdf/1.15
      and the UMDF header sets were left out.

      Of those 475: 80 byte-identical, 395 differing, 34,224 changed lines. THAT NUMBER
      IS 85% NOISE. Our copy has zero trailing whitespace in 477 files — the repo's
      .editorconfig sets trim_trailing_whitespace for [*] — while upstream has it
      everywhere. Strip it from upstream first and the delta becomes 263 files and 5,411
      lines, with 132 files that differed by NOTHING ELSE collapsing to identical. Diff
      this tree with `-w` or you will read churn as a port.

      The 5,411 real lines: 1,252 #include path/case (backslashes, and case for a
      case-sensitive filesystem), 1,197 comments, 1,049 NTAPI/WDFAPI/__declspec
      annotations for clang and GCC, 401 blank lines, 178 WPP .tmh includes commented
      out, 142 preprocessor, 122 `__super::` rewritten to the explicit base, 62 marked
      reactos blocks, 19 ROSWDFNOTIMPLEMENTED, and 989 everything-else concentrated in
      four files: poxinterface.cpp (228), fxpkgpnp.cpp (166), fxpkgpnpkm.cpp (92),
      fxpkgfdokm.cpp (62).

      Vendored but NEVER BUILT: umdf/ (10 files) and shared/*/um/ (91) — about 101 files
      of dead weight, since CMakeLists builds wdf01000 from SOURCE_SHARED + SOURCE_KM
      only. They are in the patch because they are in the tree, but nothing compiles
      them, so their delta has never been exercised.

      PATCH-IFIED 2026-09-20. `vendor-patches/wdf.patch` (420 KB, 263 files) reproduces
      this tree byte-for-byte from a pristine win-10.0.10586.0 src/framework AFTER the
      one-line trailing-whitespace normalization, which the patch header spells out.
      Verified by doing exactly that on a fresh extraction: 0 differences, 0 fuzz, 0
      rejects.

      NO UNMARKED FUNCTIONAL REMOVALS REMAIN, and that is checked rather than assumed.
      The delta was scanned for files that net out to removed or commented-out
      executable code while carrying no `reactos` and no ROSWDFNOTIMPLEMENTED anywhere.
      Six matched; all six are benign, and two are outright FIXES: fxpkgio.cpp casts
      DispatchContext through ULONG_PTR before UCHAR in two ASSERTs (casting a pointer
      straight to UCHAR is ill-formed on 64-bit clang), and fxtelemetry.cpp repairs a
      comment ending in a bare backslash, which is a line continuation that would have
      swallowed the next line. The rest are declare-at-top merged into declare-at-use and
      an RtlZeroMemory rewritten as `*p = {}`. The one real unmarked removal this tree
      DID carry — powerstatemachinekm.cpp skipping the DMA-enabler PowerUp()/PowerDown()
      loops — was restored earlier the same day, so it is deliberately absent here.

      THE TARBALL HASH IS NOT A PROVENANCE ANCHOR, and the entry below should not be read
      as one. Refetching tag win-10.0.10586.0 on 2026-09-20 produced sha256
      d252fc80175bb249a278ea284a887ec201220f709bf04b110f1afc3fdb6a4b31, not the
      6289cf8b5284ab27a801f7a04d9bb35c893159e82c04055df079e3ab3dcb3304 recorded earlier:
      GitHub's auto-generated archives are not byte-stable. The tag is the identifier and
      the round-trip is the check.

      *** ONE UNMARKED FUNCTIONAL REMOVAL, and it is the finding worth acting on. ***
      shared/irphandlers/pnp/km/powerstatemachinekm.cpp comments out the DMA-enabler
      PowerUp() and PowerDown() loops in BOTH the device power-up and power-down transitions
      — verified: the file contains zero "reactos" text and zero ROSWDFNOTIMPLEMENTED, so
      nothing in the tree records that DMA channel power transitions are silently skipped
      for any driver using DMA enablers. Plausibly deliberate (DMA not wired up yet) but
      undocumented, unlike the poxinterface.cpp and fxpkgpnp.cpp stubs which at least call a
      named not-implemented macro. RESTORED 2026-09-20, byte-exact from upstream
      win-10.0.10586.0 rather than by hand-uncommenting. Checked first that nothing blocked
      it: FxDmaEnabler::PowerUp/PowerDown are fully implemented and compiled
      (kmdf/src/dma/base/fxdmaenabler.cpp:934/993, invoking the driver's EvtDmaEnablerFill /
      EvtDmaEnablerEnable / EvtDmaEnablerSelfManagedIoStart callbacks); m_DmaEnablerList is
      created, Add-ed to and torn down in fxpkgpnpkm.cpp; LockForEnum/GetNextEntry are
      implemented in fxtransactionedlist.cpp. So there was no technical reason for the stub
      and no recorded one either — git blame lands on the fork-boundary commit, the same
      dead end as ucrt. Gate is green after the restore: build + smoke + conformance on all
      three arches. READ THAT AS WEAK EVIDENCE: nothing in the smoke path registers a DMA
      enabler, so the restored loops almost certainly never execute. It proves no
      regression, not that DMA power transitions work. Done anyway because it removes an
      undocumented divergence that real-hardware work would otherwise have to rediscover,
      and it moves this tree closer to drop-in.

      No patch file: at 295 differing files dominated by mechanical annotation churn, a
      patch would be tens of thousands of lines that obscure rather than reveal. The
      upstream tag and sha256 above make the diff reproducible in one command, which is the
      useful artifact here.

    reason: >
      290K lines / 488 files, the second-largest foreign tree in the repo after FEX and
      bigger than FreeType — and the single biggest classification call this registry has
      had to make, so the argument is written out rather than asserted.

      It is vendored for the ACPICA reason, not the "it is Microsoft's" reason. WDF's
      entire value is ABI compatibility: third-party KMDF/UMDF driver binaries bind to
      this framework's DDI table by version, so what the tree has to be is *the same
      framework Windows ships*, and upstream is public and tracked. ReactOS carries it as
      a near-unmodified drop — 9 of 488 files mention ReactOS at all, and the local
      additions are confined to reactos_special.{h,cpp} plus the cmake glue. Owning a
      Rust fork would mean re-merging every WDF release forever to preserve exactly the
      compatibility that is the point of having it.

      Two facts that do NOT decide it, recorded so nobody re-litigates on them: the tree
      is 81% C++ (396 of 488 files), which is a SCHEDULING obstacle given the pipeline is
      C-only, not an ownership argument — "we cannot translate it yet" would be the wrong
      reason to move 290K lines out of the denominator. And it is BUILT
      (sdk/lib/drivers/CMakeLists.txt), which is likewise irrelevant: FreeType is built
      too. The version probe reads the compile definitions rather than a header, because
      that is where this tree's version actually lives (headers: WDF 1.17; the triage
      structs in reactos_special.h are V1_15).

  # ── Microsoft's compiler conformance tests ──────────────────────────────
  - path: vendor/ms-compiler-tests
    name: Microsoft compiler-tests (EH/SEH)
    translate: keep
    upstream: https://github.com/microsoft/compiler-tests
    license: MIT
    license_file: vendor/ms-compiler-tests/LICENSE.TXT
    modified: "no"  # zero files mention ReactOS
    reason: >
      A snapshot of Microsoft's C++EH and SEH conformance tests, carried to check WinEH
      implementations against the platform (their README says so). Vendored for a reason
      the other entries do not have: these are an ORACLE, and an oracle's worth comes
      entirely from being written by someone other than us. Translating them to Rust
      would destroy the property that makes them useful — they exist to test what our
      compiler and our SEH do, and a test we rewrote cannot tell us that.

  # ── AMD's libm, under crtmath ───────────────────────────────────────────
  - path: sdk/lib/crt/math/libm_sse2
    name: AMD LibM for Windows
    translate: planned
    upstream: https://github.com/amd/win-libm
    license: MIT
    license_ref: sdk/lib/crt/math/libm_sse2/L2_by_pi_bits.c
    modified: yes  # unconditional LP64->LLP64 fork, no markers; see patch
    patch: vendor-patches/amd-libm.patch
    version:
      literal: git commit 6121d02
    reason: >
      AMD's optimised libm, carried under sdk/lib/crt/math and linked into the `crtmath`
      static library that msvcrt.dll, ucrtbase.dll and the static CRT consumers all share.
      66 files, ~12.9K lines, every one carrying AMD's MIT header; the tree is a drop, not
      a fork we maintain.

      Registered 2026-09-05 because it was about to be translated by mistake. It is 8,900
      of the ~12,500 compiled lines under sdk/lib/crt that carried no Rust twin, and 3,337
      of the 4,149 lines specifically left in `crtmath` — so counting it as ours made
      crtmath look 3x bigger than the work actually is, and made the biggest single files
      in the "remaining" list (log_256_lead_tail_table.c and its siblings, ~2.5K lines of
      AMD's tuned constants) read as translation debt. They are somebody else's constants.

      It already sat in media/doc/3rd Party Files.txt with an exact path, a pinned commit
      and an upstream URL; it was simply never in the gated registry. That is the same
      failure the msvcrt percentage had three times — a true fact living only in prose,
      where nothing checks it.
    review: >
      DIFFED 2026-09-20, AND THE COMMIT IS NOW CONFIRMED. This entry previously said the
      version was a literal copied from "3rd Party Files.txt" that could not be checked, and
      that confirming it against github.com/amd/win-libm was owed. Done: commit
      6121d02aef0c775947d5dc655d7fc4ccfe2144ab exists ("First github commit of AMD LibM for
      Windows", 2019-07-24, archive sha256
      ca15d1bab53cf576ba0bba8c07aa6deac8d2a0fe9d6f219dc35c0d78c5a8d45f), and against that
      exact tree 17 of our files are byte-identical while the 35 that differ do so by 2-58
      lines each. A wrong base would not look like that.

      THE DELTA IS ESSENTIALLY ONE FIX APPLIED EVERYWHERE: LP64 -> LLP64. AMD wrote this
      assuming `long` is 64 bits. On Windows x64 it is 32, so every place the code packs a
      double's bit pattern into a `long`/`unsigned long` would truncate; ours uses `long
      long` throughout. That accounts for roughly 240 of the ~257 changed lines — the
      GET_BITS_DP64/PUT_BITS_DP64 sites and casts like `(double)(long)(dx / w)` in
      remainder.c. A genuine correctness fix, and not expressible as a -D because it is a
      type spelled in hundreds of places. The rest: ~20 lines guarding `#pragma
      function(...)` behind #ifdef _MSC_VER because clang lacks that pragma, plus
      fma3_available.c's CRT-startup glue rewritten around _CRTALLOC/<intrin.h> instead of
      <windows.h>/<cruntime.h>/<internal.h>.

      ELEVEN UPSTREAM .asm FILES WERE RE-IMPLEMENTED IN C and so are additions rather than
      edits: L2_by_pi_bits, Lsincos_array, Lsincosf_array,
      log{,10}_{128,256}_lead_tail_table, log_F_inv_{dword,qword}_table and
      two_to_jby64{,_head_tail}_table — all MASM constant tables. Re-vendoring means redoing
      that conversion, so budget for it rather than assuming a copy. Also added:
      _handle_error.c, ldexp.c, ldexpf.c.

      THERE IS NOT ONE __REACTOS__ MARKER IN THIS TREE. Unlike FreeType, where every hunk is
      guarded and undefining the macro restores upstream behaviour, this is an unconditional
      fork — nothing in the source tells a reader which lines are ours. That is precisely
      what the patch file is for, and why it matters more here than elsewhere. Verified it
      applies to a fresh extraction of that commit and reproduces our tree byte-for-byte
      across all 52 shared files.

      Still true from the earlier pass: the vendored boundary is this DIRECTORY, not the
      library. `crtmath` also compiles our own C beside it (stubs.c, fdivbug.c, machfpcw.c
      and the sdk/lib/crt/float control-word set), and those remain translation targets.

  - path: sdk/lib/crt/math/ieee754
    name: FDLIBM (Sun Microsystems freely-distributable libm)
    translate: planned
    upstream: https://github.com/NetBSD/src (lib/libm/src) — FDLIBM-derived; ancestral source https://www.netlib.org/fdlibm/
    license: "FDLIBM (Sun 1993 permissive; use/copy/modify/distribute, notice preserved)"
    license_ref: sdk/lib/crt/math/ieee754/j0_y0.c
    modified: yes
    version:
      file: sdk/lib/crt/math/ieee754/j0_y0.c
      pattern: '\$NetBSD: e_j0\.c,v ([0-9.]+)'
    reason: >
      `__ieee754_j0/y0/j1/y1/jn/yn` -- the Bessel functions of the first and second kind,
      which the C standard does not have and which almost nobody reimplements. 1,346 lines
      across three files, every one carrying Sun's 1993 SunPro header and a NetBSD RCS id,
      reached through this tree via NetBSD's libm. FDLIBM is the reference implementation
      the whole Unix world's libm descends from; it is a real upstream that could be pulled
      in at build time rather than carried, which is the test for this file.

      Registered 2026-09-06, for exactly the reason the AMD entry above was: they are the
      three largest files left in crtmath's "ours" column, so counting them as translation
      debt made the remaining work look ~40% bigger than it is. Sitting under a directory
      named `ieee754/` rather than `3rdparty/` is the only thing that hid them.

      Note the boundary is this DIRECTORY. The thin `math/{j0_y0,j1_y1,jn_yn}.c` wrappers
      one level up ARE ours -- 102 lines that set `errno = EDOM` on a non-finite argument
      and then call the `__ieee754_*` body -- and they stay translation targets.
    review: >
      DIFFED 2026-09-20, AND THE RECORDED UPSTREAM WAS WRONG. This entry pointed at
      netlib.org/fdlibm, but that is the ancestor, not our base. netlib FDLIBM 5.3 ships
      e_jn.c marked "@(#)e_jn.c 1.4 95/01/18" and "Developed at SunSoft"; ours says "5.1
      93/09/24" and "Developed at SunPro", which is what NetBSD's lib/libm/src carries. The
      real base is NETBSD's libm, itself FDLIBM-derived. `upstream:` now says so.

      Confirmed by content, not just by the banner: our files use NetBSD libm conventions
      that netlib FDLIBM does not have — int32_t rather than int, the GET_HIGH_WORD macro
      rather than __HI, and calls to __sincos and __ieee754_sqrt.

      THE EXACT BASE REVISION IS IDENTIFIED BUT NOT RETRIEVABLE. The files name it
      themselves in their RCS ids: e_j0.c 1.8 and e_j1.c 1.8 (both 1995/05/10), e_jn.c 1.9.
      cvsweb.netbsd.org answers HTTP 503 from here, so those 1995 revisions could not be
      fetched and there is therefore NO patch file — an honest dead end, like dxtn, not an
      oversight. Anyone who can reach NetBSD CVS can finish this in ten minutes.

      What the delta consists of, measured against the two retrievable candidates (neither
      is the true base, so treat these as bounds): vs netlib FDLIBM 5.3, normalized 159 /
      137 / 71 lines for j0_y0.c / j1_y1.c / jn_yn.c; vs NetBSD trunk, 266 / 246 / 71. The
      trunk numbers are LARGER because trunk is thirty years newer — its jn_yn.c delta is
      almost entirely NetBSD's own modernization (dropping the K&R `#ifdef __STDC__` arms,
      adding __sincos), which our 1995-era copy predates. Read that as evidence our copy is
      close to pristine-for-its-revision, not as evidence of local editing.

      Three things are ours. (1) The 1997 Naohiko Shimizu (Tokai University) performance
      patch, which turns the R0x/S0x scalar coefficients into R[]/S[] arrays and adds
      r1/r2/s1/s2/z2/z4 temporaries for pipelined processors. VERIFIED present in j0_y0.c
      and j1_y1.c and ABSENT from jn_yn.c — the earlier review claimed this and the marker
      count (1/1/0) confirms it. (2) Include retargeting: `#include "fdlibm.h"` becomes
      `#include "math.h"` plus `"ieee754.h"`. (3) Nothing else — there is no __REACTOS__
      marker anywhere in the directory.

      Still true and still owed from the earlier pass: math/s_modf.c and math/modf.c carry
      the same Sun header while sitting outside this directory, and are deliberately not
      claimed by this path-based entry.
