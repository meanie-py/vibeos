    review: >
      DE-PATCHED 2026-09-19 — all 28 shared files byte-identical to pristine 1.1.42.
      The one behavioural line moved into the build: CMakeLists.txt passes
      `-DHAVE_STAT` and win32config.h is upstream's again. security.c's outer gate is
      `#ifndef HAVE_STAT`, so defining it before any header is read makes the whole
      block inert and the stat()->_stat() remap never happens — exactly what the
      in-source edit achieved. Upstream's HAVE__STAT is defined again and unreachable.

      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-19: libxslt-1.1.42.tar.xz from
      download.gnome.org, version confirmed from NEWS. 21 of 27 shared files are
      byte-identical, 5 differ only by a stripped trailing blank line, and ONE line is
      real:

        win32config.h:48   upstream `#define HAVE__STAT`  ->  ours `#define HAVE_STAT`

      Behavioural, narrowly. Upstream's HAVE__STAT drives security.c's macro chain to
      remap stat() to _stat() for a stock MSVC CRT; defining HAVE_STAT directly skips
      that remap, so security.c calls a real stat(). Correct for this tree, which
      supplies its own CRT — but it changes which libc function is actually called, so
      it is a divergence a re-vendor must re-apply rather than discard.

      trio.h and triodef.h were checked specifically and are upstream's own vendored
      copies, unmodified.
    reason: XSLT processor; upstream-tracked.

