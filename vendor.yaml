    review: >
      LICENCE CORRECTED 2026-09-19: recorded as `Apache-2.0` for as long as this entry
      has existed, but all 79 files say `SPDX-License-Identifier: Apache-2.0 OR
      GPL-2.0-or-later`. Dual, so the GPL half is an OPTION rather than an obligation —
      but stating only one arm of a dual grant misrepresents it. It survived the licence
      ratchet's first day because `_SPDX` captured `([^\s*/]+)`, which truncates a
      compound expression at the first space; fixed, and that fix is what surfaced this.

      MIXED UNTIL 2026-09-19, now clean: _reactos_strsafe_wrapper.c was a ReactOS-authored
