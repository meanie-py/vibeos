      BUMPED 0.1.9 -> 0.2.2 ON 2026-09-20, AND THE TREE IS NOW UNMODIFIED. Every
      upstream-derived file — common.h, the three coefficient tables, samplerate.c,
      src_linear.c, src_sinc.c, src_zoh.c and the public samplerate.h — is byte-identical
      to pristine 0.2.2, so `vendor-patches/libsamplerate.patch` is DELETED rather than
      rebased. What remains is three files with no upstream counterpart: config.h (our
      stand-in for a generated header, see below), precomp.h and CMakeLists.txt.

      PROVENANCE IS CRYPTOGRAPHIC, a first for this registry. libsamplerate-0.2.2.tar.xz,
      sha256 3258da280511d24b49d6b08615bbe824d0cacc9842b0e4caf11c52cf2b043893, carries a
      detached GPG signature that verifies against key B8D5315DA00072C0A860889FCE36E117202E3842,
      "David Seifert <soap@gentoo.org>" — a maintainer named in upstream's own AUTHORS.
      Read that as strong corroboration, not a root of trust: the key was fetched from a
      public keyserver with no independent trust path, and it has since expired. (The
      0.1.9 tarball the old patch cited also re-hashes correctly, so the base was sound.)

      WHY THE BUMP WAS WORTH DOING: 0.2.0 fixed "a buffer out-of-bounds read error in
      src/src_sinc.c" plus two undefined behaviours, and src_sinc.c is the hot path both
      consumers select (SRC_SINC_FASTEST). libsamplerate is linked into kmixer.sys, so
      that OOB read was a RING-0 read driven by audio sample data. 0.2.x also added
      bounds assertions throughout those paths; they are linked into kmixer.sys on all
      three arches (verified by string-matching the assert text in the .sys).

      THE PUBLIC API IS STRICTLY ADDITIVE ACROSS THE BUMP, which is why a five-year jump
      was cheap: samplerate.h gains only src_clone() and two comment changes. All seven
      entry points kmixer.sys and wdmaud.drv use are unchanged. Internally it is a large
      refactor (SRC_PRIVATE became SRC_STATE with a vtable), but none of that is visible.

      FOUR THINGS UPSTREAM CHANGED THAT THE PORT HAD TO ABSORB, all recorded because each
      was invisible until something failed:

      1. float_cast.h WAS DELETED UPSTREAM in 0.2.0 — one of the two files the old patch
      existed to carry. 0.2.x relies on C99 <math.h> for lrint/lrintf instead. Our two
      consumers were including that PRIVATE vendored header for their own lrintf() and now
      include <math.h>; that also stops libsamplerate's config.h leaking into them, which
      it had been doing, kernel-mode shim and all, into user-mode wdmaud.drv.

      2. Win32/config.h WAS ALSO DELETED, so the other patched file has no upstream
      counterpart either. Ours is now a hand-maintained stand-in for config.h.cmake,
      mirroring that template's switch list in its order — the same arrangement as
      libtiff's tiffconf.h. KEEP IT IN STEP ON EVERY BUMP.

      3. THE SINC CONVERTERS ARE OPTIONAL SINCE 0.2.0 and the switches are SILENT:
      leave ENABLE_SINC_FAST_CONVERTER undefined and src_new(SRC_SINC_FASTEST) simply
      returns an error at runtime with nothing failing at build time. All three are
      defined in config.h, which is what keeps this drop behaviour-identical to 0.1.9,
      where the converters were unconditional.

      4. 0.2.x GUARDS ITS OWN `#include "config.h"` behind HAVE_CONFIG_H, which the
      CMakeLists now defines. Nothing else supplies it — see the add_pch finding below.

      THE KERNEL-MODE SHIM IS GONE. config.h no longer defines exit() or printf(): in
      0.2.2 every call to both is dead code (src_linear.c guards its pair with
      `#define SRC_DEBUG 0`; samplerate.c's three printf()s are commented out). Confirmed
      by linking kmixer.sys without it on all three arches. config.h records the one-line
      grep to re-check this on the next bump, and the ordering trap if it ever comes back.

      TWO SYMBOLS kmixer.sys HAD TO GROW, beside the calloc/free it already supplied:
      malloc (0.2.x uses it in the src_*_copy paths behind src_clone — we never call
      src_clone, but the converter vtables name the copy functions so the symbol must
      resolve) and _assert. The asserts are routed at RtlAssert rather than compiled out
      with NDEBUG, deliberately: several of them ARE the bounds checks added alongside
      the src_sinc.c OOB fix, and in ring 0 a loud stop beats the overrun.

      DELETED: unistd.h, an empty placeholder 0.1.9 shipped under Win32/ that 0.2.2 does
      not, referenced by nothing and sitting on kmixer.sys's include path.

      CORRECTION TO THE PREVIOUS REVIEW, which said the 2026-09-19 de-patch was safe
      because `add_pch(libsamplerate precomp.h SOURCE)` force-includes precomp.h. IT DOES
      NOT. add_pch is `if(PCH) target_precompile_headers(...) else() <nothing> endif()`
      and PCH is OFF by default (PCH:BOOL=OFF in every build dir here), so precomp.h is
      force-included nowhere and is inert in an ordinary build. The de-patch was safe for
      a different reason: upstream 0.1.9's own sources include config.h unconditionally.
      This surfaced the moment 0.2.x put that include behind HAVE_CONFIG_H and the
      supposed force-include did not save it. The same wrong mechanism was written into
      libtiff's entry; corrected there too.

      HISTORY. Ours was 0.1.9, established from the LICENCE BOUNDARY rather than from any
      version string: libsamplerate relicensed LGPL-2.1 -> BSD-2-Clause AT 0.1.9, and
      0.1.9's own hand-maintained Win32/config.h still said PACKAGE_VERSION "0.1.8",
      which is why the registry read `unknown` for years.
    reason: Sample-rate conversion; upstream-tracked.

  - path: vendor/libwin-iconv
    name: win-iconv
    translate: planned
    upstream: https://github.com/win-iconv/win-iconv
    license: Unlicense OR MIT
    license_ref: vendor/libwin-iconv/win_iconv.c
    modified: no  # patch was DEAD CODE; reverted to pristine 2026-09-20
    review: >
      THE PATCH WAS DEAD CODE AND IS GONE (2026-09-20). The 22-line rewrite of
      _errno resolution — reading the Import Address Table instead of upstream's
      module-handle + GetProcAddress — sits entirely inside
      `#if defined(USE_LIBICONV_DLL)`, and that symbol is defined only inside an
      `#if 0` block at win_iconv.c:29. Nothing in the build defines it either.
      Confirmed at the symbol level before touching anything: win_iconv.c.obj exports
      iconv/iconv_close/iconv_open and contains neither find_imported_function nor
      MyImageDirectoryEntryToData.

      So the fork carried a reimplementation that never compiled, and it was the thing
      making this tree unable to track upstream. Every file is now byte-identical to
      upstream commit 1046215 except CMakeLists.txt, which is ours. That includes
      converting CRLF to upstream's LF on the five files that differed only that way —
      no content change, and it is what makes "byte-identical" literally true rather
      than true-modulo-line-endings.

      DIFFED AGAINST UPSTREAM 2026-09-19 at the commit our ChangeLog matches
      (win-iconv 1046215, 2014-02-05). THE FIRST DIFF WAS A LIE: every file appeared to
      differ by thousands of lines, because our copy is CRLF and upstream is LF — 4,146
      "changed" lines in a 2,071-line file is the tell. Normalising line endings leaves
      22 real lines in win_iconv.c and 4 in readme.txt; win_iconv_test.c, iconv.h and
      ChangeLog are identical.

      The 22 lines are a genuine reimplementation, not a shim: upstream finds the
      importing module and calls GetProcAddress for `_errno`
      (find_imported_module_by_funcname -> HMODULE); ours resolves the address straight
      out of the Import Address Table (find_imported_function -> FARPROC). Same goal,
      different mechanism, and it is ours to re-apply. The readme changes are
      proofreading ("drop or replace" -> "drops or replaces") that upstream lacked at
      that commit.

      So the tree is: upstream 2014-02-05, CRLF-converted, with one function rewritten.      RECORDED `Unlicense OR MIT`, BUT THE FILE SAYS PUBLIC DOMAIN: win_iconv.c's header
      is three lines and reads "This file is placed in the public domain." No Unlicense
      text and no MIT text appears anywhere in the tree. A public-domain dedication and
      the Unlicense are not the same instrument and are not equally effective in every
      jurisdiction, so the recorded value is someone's interpretation, not a quotation.
      Left as recorded rather than silently rewritten — this wants a human answer before
      launch.
    reason: iconv shim over the Win32 codepage APIs; upstream-tracked.

  - path: vendor/stlport
    name: STLport
    translate: keep
    translate_note: >
      Owner, 2026-09-26: DEAD CODE. A C++ standard library wired up only for MSVC builds
      (sdk/cmake/msvc.cmake's cppstl), and MSVC is not a supported toolchain here -- the
      clang/llvm-mingw build uses the toolchain's libstdc++ and compiles none of this.
      A STATIC lib, so nothing outside the tree could depend on it either. Deletion
      proposed; not a translation target either way.
    upstream: http://www.stlport.org/
    license: STLport licence (permissive)
    license_file: vendor/stlport/README
    modified: yes  # 30 semantic files across BOTH halves; see patch
    patch: vendor-patches/stlport.patch
    # Both halves of the drop now live here in upstream's own layout: the library
    # sources at the top and the 326-file include tree at vendor/stlport/stlport
    # (was vendor/stlport/stlport, and missing from this entry until 2026-09-20).
    version:
      file: vendor/stlport/stlport/stl/_stlport_version.h
      patterns:
        - '#define _STLPORT_MAJOR\s+(\d+)'
        - '#define _STLPORT_MINOR\s+(\d+)'
        - '#define _STLPORT_PATCHLEVEL\s+(\d+)'
      join: '.'
    review: >
      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20 (STLport-5.2.1.tar.bz2 from SourceForge,
      sha256 755b007b982c4545086c43affc8ed32c0acd577ee206eb1f6967e250c3546fc9). The entry
      said `modified: yes` with no patch, no review and no version.

      VERSION IS 5.2.1 and now probed, from vendor/stlport/stlport/stl/_stlport_version.h
      (_STLPORT_VERSION 0x521), corroborated by etc/ChangeLog's final entry "2008-12-10 ...
      STLport release 5.2.1". The README says "STLport 5.0" and is simply stale — don't
      believe it. 5.2.1 is the FINAL STLport release ever made, so there is no upstream left
      to track and no bump to owe.

      THE TREE IS SPLIT AND HALF OF IT WAS UNREGISTERED. vendor/stlport holds the
      library sources; vendor/stlport/stlport holds 326 files that are upstream's top-level
      stlport/ include tree. The second directory was not in this entry at all, so every
      earlier pass over STLport silently covered only half the drop. Now recorded under
      `headers:`. Same class of gap as libjpeg's split tree.

      WE CARRY TWO GENUINE UPSTREAM BUG FIXES, and a naive re-vendor would REGRESS both.
      src/locale.cpp:211 — upstream writes strcmp(name1, name1), comparing a string to
      itself, which makes the locale-name equality test documented directly above it always
      true; ours compares name1 to name2. stl/_fstream.c:87 — upstream writes `__ok == __ok
      && this->_M_unshift();`, an == where = was meant, so the result including the
      _M_unshift() outcome is computed and discarded; ours assigns. Upstream gets the same
      line right at 710. Both verified directly against the pristine tarball.

      The one architectural change is that the fstream backend is switched from native Win32
      I/O to C stdio, via three coordinated edits (host.h uncomments _STLP_USE_STDIO_IO and
      _STLP_USE_STATIC_LIB; _windows.h wraps its _STLP_USE_WIN32_IO define in `#if 0`),
      carried by a 35-line _Filebuf_base::_M_open(FILE*, openmode) added to
      details/fstream_stdio.cpp plus matching declarations in _fstream.h. That is a CRT-
      interop addition, not a macro toggle, so it cannot reduce to a -D.
      details/fstream_win32io.cpp is vendored but dead.

      Counts: 30 files differ semantically (14 in the library half, 16 in the include half)
      plus one added file, stl/config/_reactos.h — a compiler-config header in STLport's own
      style dispatched from _system.h under #if __REACTOS__. A further 50 files differ ONLY
      by CRLF/trailing whitespace and are deliberately excluded from the patch, so pristine
      + patch does NOT reproduce the tree byte-for-byte; the patch header says so and gives
      the one-line normalized-diff command to re-check.

      ONE CLUSTER COULD MOVE INTO THE BUILD and is left as a follow-up: user_config.h
      activates _STLP_NEW_PLATFORM_SDK, _STLP_USING_PLATFORM_SDK_COMPILER and
      _STLP_DONT_USE_AUTO_LINK, which are presence-only macros with no structural coupling —
      exactly the shape that belongs in target_compile_definitions rather than an edited
      header. Not done here because it changes the build rather than the record.

      ODDITY, flagged not fixed: stlport/errno.h carries a stray `#define errno foo` the
      tarball does not, sitting immediately before an `#error` so it can never take effect —
      apparently an example that leaked out of the comment above it. Harmless, but combined
      with the two bug fixes it suggests this tree was synced from a post-tag SVN revision
      rather than from the 5.2.1 tarball, which would mean our copy is not a strict subset
      of the tagged release in either direction. Unresolved; STLport's SVN history was not
      consulted.
    reason: >
      C++ standard library used by the C++ substrate. Upstream is long dead, but it
      is still a foreign STL implementation rather than ReactOS code; translating an
      STL to Rust is not a goal of this project.

