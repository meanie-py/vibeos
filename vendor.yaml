    version:
      file: vendor/freetype/include/freetype/freetype.h
      patterns:
        - '#define FREETYPE_MAJOR\s+(\d+)'
        - '#define FREETYPE_MINOR\s+(\d+)'
        - '#define FREETYPE_PATCH\s+(\d+)'
      join: "."
    review: >
      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20 (freetype-2.10.0.tar.gz from savannah,
      sha256 955e17244e9b38adb0c98df66abb50467312e6bb70eac07e49ce6bd1a20e809a). 449 files
      exist in both trees, 432 byte-identical. SIXTEEN differ and EVERY ONE is wrapped in
      #ifdef/#ifndef __REACTOS__, so undefining that macro yields pristine upstream
      behaviour — there is no unmarked edit in the tree. A seventeenth file,
      include/freetype/internal/ftdebug.h, differed by one added blank line and was reverted
      to pristine rather than carried, which is what makes "16, all marked" exactly true.
      Not vendored by design: builds/, devel/, docs/, objs/ and the
      Jamfile/module.mk/rules.mk chaff — 81 files, all build system, and the tree's own
      TechNote.txt says to drop them.

      Fourteen of the sixteen are two mechanical themes. STACK -> HEAP: `FooRec worker[1];`
      becomes a malloc with a null check and free() on each exit path, because kernel stack
      is scarce (TechNote.txt says so outright) — ttsbit.c, ftraster.c, psintrp.c,
      cidgload.c, t1gload.c, ftgrays.c and four autofit files. That changes WHERE a fixed-
      size struct lives, not its size. CONFIG/GLUE: ftoption.h flips three macros, ftdebug.c
      defers FT_Message/FT_Panic to the win32k font glue, ftlcdfil.c changes one parameter
      from FT_Vector* to FT_Vector[3].

      A REAL BUG LIVES IN THAT SET AND IS CURRENTLY UNREACHABLE. autofit/aflatin2.c has
      `AF_LatinMetricsRec *dummy = malloc(...); if (dummy) goto Exit;` — the test is
      INVERTED; the identical construct in sibling files afcjk.c and aflatin.c correctly
      reads `if (!dummy)`. As written the SUCCESS path skips the whole width-computation
      block and falls back to a constant width. It is dead today: every caller sits behind
      #ifdef FT_OPTION_AUTOFIT2, which is referenced in five places and DEFINED IN NONE —
      verified by grep across the tree and the CMakeLists. Real defect, zero runtime effect.
      FIXED 2026-09-20: flipped to `if (!dummy)`, matching the siblings. Safe and complete
      because `free(dummy)` was already at Exit, so the failure path now frees NULL and
      takes the constant-width fallback exactly as afcjk.c does. Note it was inverted in
      BOTH directions — on malloc SUCCESS it skipped the work, and on FAILURE it fell
      through to `&dummy->root.scaler` with dummy NULL. Still unreachable, so this is
      insurance for whoever enables FT_OPTION_AUTOFIT2, not a live fix.

      Two deliberate features, not mechanical: ftbitmap.{h,c} add
      FT_Bitmap_Convert_ReactOS_Hack(), an extended FT_Bitmap_Convert emitting 0xFF/0x00
      bytes instead of 1/0 bits for text output, with the original name kept as a wrapper
      passing hack=FALSE so upstream behaviour is unchanged; and sfnt/ttcmap.c adds a
      DEFENSIVE check in tt_cmap4_char_map_binary that refuses to parse unless the
      subtable's format field really is 4, citing ReactOS bug CORE-12549 (stale cmap data
      after a font file is replaced on disk). That one hardens the parser rather than
      relaxing it.

      SECURITY, stated as what is NOT here: no bounds check, allocation size, or
      length/offset arithmetic differs from upstream anywhere in the sixteen files, and no
      backported CVE fix is present either — this is stock 2.10.0, which is the standing
      `staleness:` item. FT_CONFIG_OPTION_USE_PNG remains NOT enabled, so pngshim.c compiles
      to `typedef int _pngshim_dummy;` and CVE-2020-15999 is not reachable; verified twice,
      independently. No copyright line or licence header differs anywhere in the delta.

      Verified: the patch applies to a fresh 2.10.0 extraction and reproduces our tree byte-
      for-byte across all 443 shared source files.

      COUNTING NOTE, because it is easy to get wrong and one audit did: 17 files DIFFER, 16
      carry a __REACTOS__ marker. A bare `grep -rl __REACTOS__` returns 17 paths but one of
      them is TechNote.txt, which is prose. The earlier "16 source files" figure in this
      entry was right.

    reason: >
      Font rasteriser, ~208K lines and the single largest vendored tree. win32k
      consumes it through a stable C API; upstream tracking beats ownership.

  - path: vendor/zlib
    name: zlib
    translate: keep
    upstream: https://zlib.net/
    license: Zlib
    license_file: vendor/zlib/LICENSE
    license_extra:
      Info-ZIP: >-
        contrib/minizip IS NOT UNDER THE ZLIB LICENCE. Its files carry "Copyright (c)
        1990-2000 Info-ZIP" alongside Gilles Vollant's minizip copyright, and since 1.3.x
        upstream ships the grant explicitly as contrib/minizip/LICENSE.Info-Zip (Info-ZIP
        licence, 2009-Jan-02 version), now vendored. The code was always licensed this way
        — 1.2.13's unzip.c says so in its header — but upstream had never stated it as a
        licence file and this registry recorded only Zlib. The obligation is live: minizip
        is built into rapps and zipfldr.
    modified: yes  # 10 lines across 3 files under contrib/minizip; zlib proper is pristine
    patch: vendor-patches/zlib.patch
    version:
      file: vendor/zlib/include/zlib.h
      pattern: '#define ZLIB_VERSION "([^"]+)"'
    review: >
      BUMPED 1.2.13 -> 1.3.2 ON 2026-09-20, and the delta SHRANK: 14 patched lines down to
      10, and the CMakeLists lost both of its warning suppressions. Nothing was traded away
      to get that — upstream fixed all three independently. Builds clean on i386, amd64 and
      arm64.

      PROVENANCE IS CRYPTOGRAPHIC. zlib-1.3.2.tar.gz, sha256
      bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16, ships a detached
      .asc that verifies as a Good signature from "Mark Adler
      <madler@alumni.caltech.edu>", DSA key 5ED46A6721D365587791E2AA783FCD8E58BCAFBA —
      zlib's own author. Second tree in this registry with a verified signature, after
      libsamplerate. As there, no independent trust path to the key: corroboration, not a
      root of trust.

      ZLIB PROPER IS PRISTINE, before and after. adler32, crc32, deflate, inflate,
      inftrees, trees, zutil, the gz* family, compress, uncompr, infback and both public
      headers are byte-identical to 1.3.2. Nothing we carry touches bounds checking,
      allocation, or the inflate/deflate state machines. The whole delta is ten lines in
      three files under contrib/minizip, the ZIP-archive helper — the scary-sounding
      `modified` was never about the compressor.

      WHAT THE TEN LINES DO, and the REASON IS SHARPER THAN THE OLD NOTE SAID. minizip has
      a stdio FILE* backend (ioapi.c) and a win32-HANDLE backend (iowin32.c); we compile
      out the stdio half and the zipOpen2/unzOpen2 entry points that depend on it. The old
      review said this was because "ReactOS uses only the win32 one", which reads as
      preference. It is not: ioapi.c's fopen64_file_func calls FOPEN_FUNC, which resolves
      to fopen64, and fopen64/ftello64/fseeko64 do not exist in our CRT. Removing the guard
      during this bump produced "call to undeclared function 'fopen64'". Measured, not
      inherited.

      WHAT UPSTREAM RETIRED FOR US:

      1. THE NOUNCRYPT HUNK IS GONE. 1.2.13's unzip.c force-defined NOUNCRYPT, which
      DISABLES traditional-PKWARE decryption, and our patch wrapped that in __REACTOS__ to
      get decryption back. 1.3.x dropped the force-define, so decryption is on by default
      for everyone. Behaviour is unchanged — NOUNCRYPT is still undefined in our build, so
      crypt.h is still included — but the hunk has nothing left to do.

      2. -Wno-deprecated-non-prototype is gone from the CMakeLists. It existed for 1.2.13's
      K&R-style definitions; 1.3.0 converted the library to prototypes.

      3. -Wno-unused-variable on minizip is gone. It existed for four `mode_fopen` locals
      in iowin32.c that only the stdio backend used; 1.3.x no longer leaves them unused.
      Note that flag was itself only added on 2026-09-19, to de-patch iowin32.c — so this
      tree went comment-out-the-source, then build-flag, then nothing, in two days.

      THREE NEW UPSTREAM FILES were vendored for minizip to build: ints.h (fixed-width
      integer typedefs from <limits.h>), skipset.h (a skiplist set, used by zip.c for
      duplicate-name detection) and LICENSE.Info-Zip, which is a licence fact rather than a
      build input — see license_extra.

      HISTORY: before 2026-09-20 this entry said `modified: yes` with no patch and no
      review, the last bare unexplained claim in the registry. It was then measured and
      de-patched from five files to three, and bumped the same day.
    reason: Ubiquitous compression library; upstream-tracked.

  - path: vendor/libxml2
    name: libxml2
    translate: keep
    staleness: >
      AUDITED 2026-09-20, BUMPED 2.12.8 -> 2.13.9 the same day. Current upstream is
      2.15.4 and we are deliberately one minor line behind it, for one identified
      reason: 2.14.0 made threads.c call InitOnceExecuteOnce, our kernel32.spec gates
      that export behind `-version=0x600+`, and spec2def defaults to 0x502 with nothing
      in the tree overriding it. Going further needs
      `spec2def(kernel32.dll kernel32.spec ADD_IMPORTLIB VERSION 600)` — a project
      policy decision about which Windows version our import libraries advertise, not a
      missing feature, since our kernel32 does export the function. Everything else
      about 2.15.4 was already made to build during this bump (see review), so that one
      line is the whole remaining cost.
    upstream: https://gitlab.gnome.org/GNOME/libxml2
    license: MIT
    license_file: vendor/libxml2/Copyright
    modified: yes  # ONE file, two lines; see review
    patch: vendor-patches/libxml2.patch
    version:
      # READS BACK OUR OWN SUBSTITUTION, and there is no better source in the vendored
      # set: xmlversion.h is generated from xmlversion.h.in, and 2.13.9 ships no plain
      # VERSION file (2.15 added one). Treat it as a label we maintain, not evidence.
      file: vendor/libxml2/include/libxml/xmlversion.h
      pattern: '#define LIBXML_DOTTED_VERSION "([^"]+)"'
    review: >
      BUMPED 2.12.8 -> 2.13.9 ON 2026-09-20, and the delta went from three files to ONE
      FILE AND TWO LINES. Builds clean on i386, amd64 and arm64, as do both consumers
      (libxslt and msxml3). Patch round-trips byte-for-byte from
      libxml2-2.13.9.tar.xz, sha256
      a2c9ae7b770da34860050c309f903221c67830c86e4a7e760692b803df95143a.

      THE TWO BUILD SHIMS ARE RETIRED, not carried. libxml.h and include/win32config.h
      were patched for years so libxml.h included "win32config.h" in place of the
      "config.h" the build system was supposed to produce, and so win32config.h pulled
      in <io.h> and <direct.h>. Both are now PRISTINE. In their place is a config.h of
      ours at the tree root doing what upstream's OWN CMakeLists does on Windows —
      `configure_file(include/win32config.h config.h COPYONLY)` — plus those two
      includes. The old entry justified the shim by saying `config.h` was "a dangerously
      generic name to put on this tree's include path"; that was true and also beside
      the point, because libxml.h's include is QUOTED and resolves against its own
      directory before any -I path. The file never had to go on an include path at all.

      WHY 2.13.9 AND NOT 2.15.4, measured rather than assumed. 2.15.4 was taken all the
      way to a clean compile of libxml2, libxslt and msxml3 before being backed out, and
      it fails at ONE symbol: 2.14.0 changed threads.c to call InitOnceExecuteOnce for
      its one-time parser init. kernel32.spec marks that export `-version=0x600+`;
      spec2def's default is 0x502 (guOsVersion, sdk/tools/spec2def/spec2def.c) and no
      CMakeLists in the tree passes `spec2def(... VERSION ...)`, so the export is in no
      import library. Raising a MODULE's _WIN32_WINNT does not help — the import library
      is one global artifact built from the spec, not a per-consumer one. The fix is one
      line in dll/win32/kernel32/CMakeLists.txt and it is a policy change, so it is
      recorded in `staleness:` for a human rather than taken here.

      Everything else 2.15.4 needs is already done and would survive the jump: SAX.c and
      xmlunicode.c are gone upstream and drop out of the source list, win32config.h is
      deleted upstream (our root config.h stops depending on it), the codegen/*.inc
      tables have to be vendored, ICU/MODULES/HTTP must be off, and XML_SYSCONFDIR has
      to be defined because catalog.c pastes it into a string unconditionally.

      BCryptGenRandom, AND AN SDK GAP IT EXPOSED. 2.13 seeds its hash RNG with
      BCryptGenRandom on Windows. Our bcrypt.dll exports it, but sdk/include/psdk/
      bcrypt.h was missing BCRYPT_SUCCESS — the Windows SDK's own success test for the
      NTSTATUS every BCrypt function returns. So the header declared the functions and
      offered no way to check one, and documented usage did not compile. Added to that
      header rather than worked around in the vendored tree; libxslt and msxml3 gained
      `bcrypt` in add_importlibs.

      That last one is the one that matters for a re-vendor, and note its provenance:
      the comment says WINE, not ReactOS. It arrived already-patched in the bulk import
      rather than being edited here — which is exactly why "no __REACTOS__ marker" is
      not evidence of a clean drop.

      RESOLVED 2026-09-20 — the xmlschemas.c patch is JUSTIFIED AND MINIMAL; it does not
      block CVE tracking. Two stray-double-semicolon cleanups were reverted to pristine, so
      xmlschemas.c now differs from upstream 2.12.8 by exactly the 2-line `#if 0`. `patch
      -p1 --dry-run` applies clean to a fresh 2.12.8 extraction and the result is byte-
      identical to our tree for all three files, so a version bump is a normal rebase of one
      tiny hunk.

      The hunk disables the XSD 1.0 Unique Particle Attribution check. Measured with a host
      probe (real dll/win32/msxml3/xdr.c linked against PRISTINE upstream 2.12.8, datatypes
      namespace wired as schema.c does): 5 of the 6 XDR schemas in the msxml3 winetest
      compile clean unpatched; szDatatypeXDR emits 'The content model is not determinist'
      twice; applying only this hunk to that same tree makes all 6 compile. Necessary and
      sufficient, A/B on one binary.

      It is NOT covering for a bug in xdr.c. XDR's open content model permits extra DECLARED
      elements as trailing content, lowered to an xsd:any with namespace='##any' and
      processContents='strict', which unavoidably overlaps its sibling particles when one is
      optional or repeating — inherent UPA. XSD 1.1 added xs:openContent for exactly this;
      libxml2 implements neither. Narrowing to ##other would satisfy UPA and be WRONG: the
      winetest requires <test><x/><x/><y/><z/><z/><w/></test> to VALIDATE (w is declared,
      same namespace) while rejecting an undeclared <v/>. All 4 test_openseq documents
      validate exactly as asserted with the hunk in place. Full evidence in the patch
      header. Do not 'fix' xdr.c and do not translate it expecting to remove this patch.
    reason: XML parser; upstream-tracked.

