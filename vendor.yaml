    review: >
      MIT FILES REMOVED 2026-09-19. Five ReactOS ADDITIONS carrying `SPDX MIT` and
      `Copyright (c) 2024 Timo Kreuzer` used to sit in this Microsoft drop
      (math/matherr.cpp, inc/corecrt_internal_state_isolation.h,
