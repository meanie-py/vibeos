  - path: vendor/libmpg123
    name: libmpg123
    translate: keep
    upstream: https://www.mpg123.de/
    license: LGPL-2.1
    license_file: vendor/libmpg123/COPYING
    modified: yes  # 5 lines across 2 files; see review
    patch: vendor-patches/libmpg123.patch
    headers:
      - vendor/libmpg123/include
    version:
      # UPSTREAM'S OWN version.h, which 1.33.7 added and which the tree now vendors.
      # This is strictly better than the two things this probe has pointed at before:
      # MPG123_API_VERSION in mpg123.h (45 across a whole span of releases, so it could
      # not tell 1.26.2 from 1.33.7 — the same defect libjpeg's JPEG_LIB_VERSION 90 had),
      # and PACKAGE_VERSION in our hand-maintained config.h, which reads back a value WE
      # write. version.h is upstream's and cannot be laundered by us.
      file: vendor/libmpg123/version.h
      patterns:
        - '#define MPG123_MAJOR (\d+)'
        - '#define MPG123_MINOR (\d+)'
        - '#define MPG123_PATCH (\d+)'
      join: '.'
    review: >
      BUMPED 1.26.2 -> 1.33.7 ON 2026-09-20, five years and a stack of decoder fixes. The
      delta went from four patched files (2,477 meaningful lines) to TWO FILES AND FIVE
      LINES, and the mixed-vintage compat.c problem this entry used to carry is discharged.
      Builds clean on i386, amd64 and arm64.

      SECURITY IS THE REASON. Our one consumer, winemp3.acm, feeds attacker-supplied MP3
      bytes straight into this decoder. Fixed upstream between 1.26.2 and 1.33.7, in
      libmpg123 specifically: use of uninitialized values in layer III dequantization
      (III_dequantize_sample); a double free when deleting a handle after a failed
      mpg123_decoder(); a double free in the mpg123_set_index() 32-bit wrapper called with
      index size 0; realloc calls hardened against size_t multiplication overflow; and
      ID3v2 UTF16 texts not being terminated when they overwrite previous frames.

      THE TREE WAS RESTRUCTURED, and that is what shrank the patch. Its root now mirrors
      upstream's src/ exactly — libmpg123/, common/, compat/, include/, version.h — so the
      sources' own relative includes ("../common/debug.h", "../version.h") resolve with no
      edits. The old layout hoisted every header flat into
      sdk/include/reactos/libs/libmpg123/, which is precisely what forced include-line
      patching; that directory is deleted and winemp3.acm now points at the tree's own
      include/. DO NOT FLATTEN IT AGAIN. The file-set rule is written at the top of the
      patch so a re-vendor is a copy.

      THE CHECKLIST ITEM IS DISCHARGED. compat.c was NOT 1.26.2 — it was 1.24.0-1.25.13
      vintage, 215 lines adrift, and this entry carried a standing warning not to carry it
      across a bump. It was not carried. The tree takes 1.33.7's compat.c verbatim, which
      also brings the wpathconv.h split our older copy inlined and defines the
      unintr_fwrite that compat.h had been declaring with nothing behind it.

      WHAT IS LEFT, FIVE LINES:

      include/mpg123.h extends upstream's own "little hack to help MSVC not having
      ssize_t" to cover us, because our CRT does not declare ssize_t either — not in
      <sys/types.h>, not in <corecrt.h>. Worth sending upstream: the real condition is
      "Windows CRT", not "MSVC". libmpg123/optimize.h gives ALIGNED() an MSVC spelling,
      since config.h defines CCALIGN unconditionally and upstream expands it to
      __attribute__((aligned(a))). Kept rather than dropped because ReactOS supports MSVC
      builds and we cannot test one here.

      RETIRED BY UPSTREAM, not given up: parse.c's __REACTOS__ reordering of `#include
      "getbits.h"` (1.33.7 needs none) and compat.h's ssize_t guard (1.33.7's compat.h does
      not mention ssize_t at all). Also gone: the 37 files that differed only by
      trailing-whitespace stripping, so unlike the old patch this one DOES reproduce the
      tree byte-for-byte from pristine.

      TWO LATENT 64-BIT BUGS DIED WITH THE OLD config.h, both from a 32-bit autoconf output
      being applied to all three arches. SIZEOF_SIZE_T and SIZEOF_SSIZE_T were hardcoded to
      4, and compat.h used them to pick the printf conversion for size_t — so on amd64 and
      arm64 it chose %lu for an 8-byte value (diagnostic paths only). And `#define ssize_t
      long` gave 4 bytes where 8 were needed. 1.33.7 uses neither macro, and ptrdiff_t is
      correct on all three targets. The new config.h is regenerated from 1.33.7's
      config.h.in with our 51 previous choices carried across and the 26 new switches left
      undefined; KEEP IT IN STEP WITH THAT TEMPLATE on every bump.

      THE API IS COMPATIBLE. winemp3.acm uses twelve entry points (mpg123_init/exit/new/
      delete/open_feed/close/feed/read/feedseek/getformat/param + mpg123_handle); all
      twelve survive with compatible signatures. mpg123_read's buffer parameter widened
      from `unsigned char*` to `void*`, source-compatible for callers. lfs_wrap.c is now
      BUILT and must stay built — it supplies mpg123_feedseek and the INT123_wrap_*
      helpers libmpg123.c calls; lfs_alias.c, which 1.26.2 shipped and we never built, no
      longer exists upstream.

      LICENCE: upstream's COPYING and AUTHORS are now vendored, so the LGPL-2.1 grant is
      reproducible from the tree instead of pointing at the repo's own COPYING.LIB.

      MEASUREMENT NOTE, still true and still a trap: match files by their FULL upstream
      path, not basename. mpg123 ships both src/equalizer.c (the frontend's) and
      src/libmpg123/equalizer.c; a basename match picks the wrong one and reports 56
      phantom changed lines.
    reason: MPEG audio decoder; upstream-tracked.

