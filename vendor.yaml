      force-included nowhere. The revert was safe on its own terms — the include path
      finds tiffiop.h either way — and the false mechanism was caught during the
      libsamplerate bump, where the equivalent claim did NOT hold and the build broke.

      THE SECURITY FACT (now RESOLVED, kept for the record): this was stock 4.1.0
      (Nov 2019) with NO backported fixes, so it was exactly as vulnerable as unpatched
      4.1.0 — which predates fixes for known OOB-read/write and directory-parsing CVEs.
      De-patching made the version bump trivial but did not perform it; the bump below
      did, on 2026-09-20.

      (This paragraph was written once before and SILENTLY LOST: the editing helper
      did nothing when an entry had no `review:` block, and reported success. It is
      here now because the helper was made to fail loudly instead.)

      BUMPED 4.1.0 -> 4.7.0 on 2026-09-20, which is what that security item asked for.
      tiff-4.7.0.tar.gz from download.osgeo.org, sha256
      67160e3457365ab96c5b3286a0903aa6e78bdc44c4bc737d2e486bcecb6ba976 — NOTE osgeo
      publishes only a GPG .sig for this file, no .sha256, so that hash is computed here and
      NOT yet checked against an independent source. Verify it before treating this drop as
      provenance-clean.

      The bump was cheap precisely because the 2026-09-19 de-patching had already made the
      tree pristine: no local edit had to be re-applied. Every .c, .cxx and non-config
      header is now byte-identical to pristine 4.7.0; the only files that differ are the six
      ReactOS config headers (tif_config*.h, tiffconf*.h), which stand in for what libtiff's
      own CMake generates and are build glue rather than upstream source.

      What had to change. tiffconf.h was rewritten against 4.7's tiffconf.h.cmake.in,
      preserving our exact codec selection: 4.5 moved the fixed-width types to <stdint.h>,
      so without the new stddef/stdint/inttypes includes every uint16_t in tiff.h is an
      unknown type. One new source file, tif_hash_set.c, is required by tif_dirread.c and is
      added to the CMake source list. Upstream also added tif_lerc.c, which stays out along
      with the other optional codecs we do not build (jpeg, jbig, ojpeg, lzma, webp, zstd,
