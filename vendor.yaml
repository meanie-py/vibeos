      - dll/directx/wine/d3dcompiler_43
      - dll/directx/wine/wined3d
    name: Wine-derived shipped modules
    origin: Wine (LGPL-2.1-or-later), mostly `Copyright <year> <person> for CodeWeavers`
    tier: "Tier 2-3 (userland DLL queue)"
    reason: >
      ONE DECISION, 24 paths, owner-confirmed 2026-09-19: Wine-derived code is OURS and
      is on the translation path. These are forked Wine modules this project ships,
      maintains and translates — not a vendored drop tracked against upstream. The
      proof is in the tree: dll/win32/msvcrt is on this list and is already ~fully
      translated, graded against the genuine C by msvcrt-difftest.

      They are listed here rather than left silent because `--suspects` learned to see
      Wine on 2026-09-19 (it matches `Copyright ... for CodeWeavers`, since Wine does
      not use the `(c)` form the other holders do) and would otherwise re-ask about 24
      directories forever. Being in `ours:` is a claim about SCOPE, not authorship: the
      code is foreign, the responsibility is ours, and the lines stay in the
      translation denominator.

