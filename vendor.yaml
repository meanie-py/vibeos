    license_ref: sdk/include/reactos/libs/fullfat/fat.h
    modified: unknown
    headers:
      - sdk/include/reactos/libs/fullfat
    review: >
      LICENCE WAS RECORDED `unknown` AND IS NOT: every header carries the full GPL
      grant in prose — "This program is free software: you can redistribute it and/or
      modify it under the terms of the GNU General Public License ... either version 3
      of the License, or (at your option) any later version", Copyright (C) 2009 James
      Walmsley. So this is GPL-3.0-or-later, stated in the tree, and `unknown` simply
      meant nobody had opened the file. Headers only, so it carries no body debt — but
