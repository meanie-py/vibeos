# vendor.yaml — the registry of which C/C++ in this tree is ours to translate.
#
# Two halves. `trees:` is what we do NOT translate. `ours:` is foreign-COPYRIGHT code we
# DO — the verdicts that used to have nowhere to live. See the header above `ours:`.
#
# WHY THIS EXISTS
# ---------------
# The project's goal is Rust, so the only number that matters is "how much of the C
# that is OURS is translated". That question has no answer unless something says which
# C is ours. Before this file, three places claimed to:
#
#   * docs/engineering/rust-port-status.md  — prose, names ACPICA + FreeType
#   * external/README-fex-vendor.md         — a good manifest, covering exactly one tree
#   * tools/verify_conv_macros.py:_VENDORED — a 6-entry hardcoded tuple
#
# Three lists, three different contents, none of them complete. The tuple covered 5 of
# the 19 directories under sdk/include/reactos/libs/, carried one stale entry that
# matches nothing (`libs/libxml`), and omitted the four largest trees there.
#
# A GLOB CANNOT REPLACE THIS LIST. sdk/include/reactos/libs/ mixes third-party with
# ReactOS-native code — audiosrv, samsrv, umpnpmgr, syssetup, fslib, fmifs, epsapi,
# cportlib and fast486 are all ours, sitting in the same directory as zlib and mbedtls.
# No path convention encodes vendored-ness anywhere in this tree: ACPICA lives under
# drivers/, FreeType under sdk/lib/3rdparty/, FEX under external/, ucrt under sdk/lib/.
# So the list is explicit, and `vendored.py --check` refuses a vendor directory that
# is not in it.
#
# VERSION IS A PROBE, NOT A COPY. Each entry says WHERE its version lives (file +
# regex) and the tool derives it on demand. A copied literal is a second source of
# truth that goes stale silently at the next re-vendor — which is how the tree ended
# up with 78K lines of Microsoft ucrt carrying no version stamp at all.
#
# Adding a vendored tree: add an entry here, run `tools/vendored.py --write-stamps`.
# Field reference and the check semantics: tools/vendored.py.

# Directories whose every immediate child is a vendored tree and must be registered.
# This is what makes --check a ratchet rather than a snapshot: drop a new library into
# one of these and the gate fails until it has an entry.
containers:
  - sdk/lib/3rdparty
  - dll/3rdparty
  - external

trees:
  # ── ACPI ────────────────────────────────────────────────────────────────
  - path: drivers/bus/acpi/acpica
    name: ACPICA
    upstream: https://github.com/acpica/acpica
    license: BSD-3-Clause OR GPL-2.0  # Intel dual-licence
    modified: unknown
    version:
      file: drivers/bus/acpi/acpica/include/acpixf.h
      pattern: '#define ACPI_CA_VERSION\s+(0x[0-9A-Fa-f]+)'
    reason: >
      Intel's ACPI Component Architecture, the reference implementation every OS
      vendors rather than reimplements. Tracking upstream is worth more than owning
      the code, and a Rust fork would have to be re-merged on every ACPICA release.
      The Rust-facing boundary is sdk/lib/rust/acpica-sys.

  # ── the kernel/user driver framework ────────────────────────────────────
  - path: sdk/lib/drivers/wdf
    name: Windows Driver Frameworks (KMDF/UMDF)
    upstream: https://github.com/microsoft/Windows-Driver-Frameworks
    license: MIT  # upstream relicensed the WDF sources to MIT in 2017
    modified: "lightly"  # 9 of 488 files mention ReactOS; see reason
    headers:
      - sdk/include/wdf
    version:
      file: sdk/lib/drivers/wdf/CMakeLists.txt
      patterns:
        - '__WDF_MAJOR_VERSION=(\d+)'
        - '__WDF_MINOR_VERSION=(\d+)'
        - '__WDF_BUILD_NUMBER=(\d+)'
      join: "."
    review: >
      GPL FILES REMOVED 2026-09-19, tree now Microsoft's alone. It used to carry 3,851
      lines of ReactOS-authored GPL-2.0-or-later code inside this MIT drop — not
      adapters but REIMPLEMENTATIONS of two Microsoft components the source drop does
      not contain: WdfLdr.sys (the KMDF loader) and WdfDriverEntry.lib. They are now
      sdk/lib/drivers/{wdfldr,wdfdriverentry}, built from sdk/lib/drivers/CMakeLists.txt.
      Three ReactOS headers went to sdk/lib/drivers/wdf_reactos/include/: usbspec.h and
      wdfcx.h, which Perevertkin wrote in 2020 as "Missing headers" so THIS drop would
      compile, and wdfldr.h, the loader's exported interface. wdfldr_.h was deleted — 38
      lines, referenced nowhere, and its own comment said "likely to be removed when the
      proper wdfldr.sys is ready", which it has been since 2019.

      THE COUPLING IS NOT GONE AND IS NOT AN ACCIDENT: wdf01000 still puts
      sdk/lib/drivers/wdfldr on its include path and does `add_importlibs(wdf01000
      wdfldr ...)`. That is how KMDF works — the framework binds to a loader — so an
      upstream WDF drop would still need our loader supplied beside it rather than
      inside it. What changed is that the dependency is now across a tree boundary
      instead of hidden as files in someone else's directory.

    reason: >
      290K lines / 488 files, the second-largest foreign tree in the repo after FEX and
      bigger than FreeType — and the single biggest classification call this registry has
      had to make, so the argument is written out rather than asserted.

      It is vendored for the ACPICA reason, not the "it is Microsoft's" reason. WDF's
      entire value is ABI compatibility: third-party KMDF/UMDF driver binaries bind to
      this framework's DDI table by version, so what the tree has to be is *the same
      framework Windows ships*, and upstream is public and tracked. ReactOS carries it as
      a near-unmodified drop — 9 of 488 files mention ReactOS at all, and the local
      additions are confined to reactos_special.{h,cpp} plus the cmake glue. Owning a
      Rust fork would mean re-merging every WDF release forever to preserve exactly the
      compatibility that is the point of having it.

      Two facts that do NOT decide it, recorded so nobody re-litigates on them: the tree
      is 81% C++ (396 of 488 files), which is a SCHEDULING obstacle given the pipeline is
      C-only, not an ownership argument — "we cannot translate it yet" would be the wrong
      reason to move 290K lines out of the denominator. And it is BUILT
      (sdk/lib/drivers/CMakeLists.txt), which is likewise irrelevant: FreeType is built
      too. The version probe reads the compile definitions rather than a header, because
      that is where this tree's version actually lives (headers: WDF 1.17; the triage
      structs in reactos_special.h are V1_15).

  # ── Microsoft's compiler conformance tests ──────────────────────────────
  - path: modules/rostests/apitests/compiler/ms
    name: Microsoft compiler-tests (EH/SEH)
    upstream: https://github.com/microsoft/compiler-tests
    license: MIT
    license_file: modules/rostests/apitests/compiler/ms/LICENSE.TXT
    modified: "no"  # zero files mention ReactOS
    reason: >
      A snapshot of Microsoft's C++EH and SEH conformance tests, carried to check WinEH
      implementations against the platform (their README says so). Vendored for a reason
      the other entries do not have: these are an ORACLE, and an oracle's worth comes
      entirely from being written by someone other than us. Translating them to Rust
      would destroy the property that makes them useful — they exist to test what our
      compiler and our SEH do, and a test we rewrote cannot tell us that.

  # ── AMD's libm, under crtmath ───────────────────────────────────────────
  - path: sdk/lib/crt/math/libm_sse2
    name: AMD LibM for Windows
    upstream: https://github.com/amd/win-libm
    license: MIT
    modified: unknown
    version:
      literal: git commit 6121d02
    reason: >
      AMD's optimised libm, carried under sdk/lib/crt/math and linked into the `crtmath`
      static library that msvcrt.dll, ucrtbase.dll and the static CRT consumers all share.
      66 files, ~12.9K lines, every one carrying AMD's MIT header; the tree is a drop, not
      a fork we maintain.

      Registered 2026-09-05 because it was about to be translated by mistake. It is 8,900
      of the ~12,500 compiled lines under sdk/lib/crt that carried no Rust twin, and 3,337
      of the 4,149 lines specifically left in `crtmath` — so counting it as ours made
      crtmath look 3x bigger than the work actually is, and made the biggest single files
      in the "remaining" list (log_256_lead_tail_table.c and its siblings, ~2.5K lines of
      AMD's tuned constants) read as translation debt. They are somebody else's constants.

      It already sat in media/doc/3rd Party Files.txt with an exact path, a pinned commit
      and an upstream URL; it was simply never in the gated registry. That is the same
      failure the msvcrt percentage had three times — a true fact living only in prose,
      where nothing checks it.
    review: >
      The version is a LITERAL, not a probe, and that is a weakness worth stating: there is
      no version macro, stamp or manifest anywhere in the tree, so `git commit 6121d02` is
      copied from 3rd Party Files.txt and cannot be verified against the source here. It is
      recorded so a future re-vendor has a starting point, not because it is checkable.
      Confirming it against github.com/amd/win-libm is owed.

      NOTE the tree is NOT wholly foreign in effect: `crtmath` also compiles OUR C beside it
      (stubs.c, fdivbug.c, machfpcw.c, the sdk/lib/crt/float control-word set), and those
      remain translation targets. The vendored boundary is this directory, not the library.
      The `ieee754/` Bessel set was named here as ours when this entry was written; it is
      not, it is Sun FDLIBM, and it now has its own entry below.

  # ── Sun FDLIBM's Bessel functions, also under crtmath ───────────────────
  - path: sdk/lib/crt/math/ieee754
    name: FDLIBM (Sun Microsystems freely-distributable libm)
    upstream: https://www.netlib.org/fdlibm/
    license: "FDLIBM (Sun 1993 permissive; use/copy/modify/distribute, notice preserved)"
    modified: yes
    version:
      file: sdk/lib/crt/math/ieee754/j0_y0.c
      pattern: '\$NetBSD: e_j0\.c,v ([0-9.]+)'
    reason: >
      `__ieee754_j0/y0/j1/y1/jn/yn` -- the Bessel functions of the first and second kind,
      which the C standard does not have and which almost nobody reimplements. 1,346 lines
      across three files, every one carrying Sun's 1993 SunPro header and a NetBSD RCS id,
      reached through this tree via NetBSD's libm. FDLIBM is the reference implementation
      the whole Unix world's libm descends from; it is a real upstream that could be pulled
      in at build time rather than carried, which is the test for this file.

      Registered 2026-09-06, for exactly the reason the AMD entry above was: they are the
      three largest files left in crtmath's "ours" column, so counting them as translation
      debt made the remaining work look ~40% bigger than it is. Sitting under a directory
      named `ieee754/` rather than `3rdparty/` is the only thing that hid them.

      Note the boundary is this DIRECTORY. The thin `math/{j0_y0,j1_y1,jn_yn}.c` wrappers
      one level up ARE ours -- 102 lines that set `errno = EDOM` on a non-finite argument
      and then call the `__ieee754_*` body -- and they stay translation targets.
    review: >
      `modified: yes` is deliberate and is the weakness here. j0_y0.c and j1_y1.c carry a
      1997 performance patch by Naohiko Shimizu (Tokai University) on top of Sun's text, so
      this is a patched drop rather than a clean one, and a re-vendor from netlib would have
      to re-apply or re-evaluate it. jn_yn.c appears unpatched.

      The version probe reads the NetBSD RCS id rather than a release number, because FDLIBM
      5.3 ships no version macro. That makes it a real probe -- it breaks loudly if the file
      is replaced -- but it identifies NetBSD's revision of the file, not an FDLIBM release.

      `math/s_modf.c` (194 lines) and `math/modf.c` carry the SAME Sun header while sitting
      outside this directory. They are deliberately NOT covered by this entry: a path-based
      registry should not claim files it does not name, and whether to move them under
      `ieee754/` or give them their own entry is a question for whoever next touches modf.

  # ── the Microsoft CRT under ucrtbase.dll ────────────────────────────────
  - path: sdk/lib/ucrt
    name: Microsoft UCRT
    upstream: Windows SDK "Source/ucrt" drop (exact SDK version UNKNOWN — see note)
    license: Microsoft (see the Windows SDK licence terms)
    modified: yes
    headers:
      - sdk/include/ucrt
    reason: >
      Microsoft's Universal CRT source as vendored by upstream ReactOS long before
      this fork (oldest commit touching it here is 5213cf717cf, upstream, predating
      the ARM64 port). It is built against its own corecrt_internal.h substrate and
      shares nothing with the Wine-derived msvcrt code we translate, so it is a
      distinct bring-up rather than an extension of the msvcrt lane.

      This is the entry that motivated the registry. ucrtbase.dll is vendored ucrt
      plus OUR msvcrt_shared (dll/win32/msvcrt: cpp.c, except.c, undname.c,
      except_<arch>.c, reactos/ucrt_tls_sup.c) plus 132 lines of ucrtbase's own C
      (dll/win32/ucrtbase/printf.c + stubs.c; ucrtbase_stubs.c is GENERATED, and the
      2,676-line .spec is a definition file, not a body). Counting ucrt as translation debt
      makes ucrtbase read as permanently ~8% reachable; excluding it makes the goal
      sayable — everything in ucrtbase that is ours is Rust. See task #55.
    review: >
      MIT FILES REMOVED 2026-09-19. Five ReactOS ADDITIONS carrying `SPDX MIT` and
      `Copyright (c) 2024 Timo Kreuzer` used to sit in this Microsoft drop
      (math/matherr.cpp, inc/corecrt_internal_state_isolation.h,
      locale/{MultiByteToWideChar,WideCharToMultiByte,GetStringTypeW}.c). They are now
      sdk/lib/ucrt_reactos/, outside the vendored boundary, so this tree is Microsoft's
      alone. ONE TIE REMAINS AND CANNOT BE MOVED: corecrt_internal.h:2119 — a Microsoft
      file — does `#include <corecrt_internal_state_isolation.h>`, so the drop reaches
      into our header, which is now supplied via an include path. That #include is itself
      one of the adaptation sites below, and for any future upstream-alignment work it is
      the shape that has to become a patch rather than an in-place edit.

      No version probe: there is no version macro, no stamp, and no manifest anywhere
      in sdk/lib/ucrt or sdk/include/ucrt, so nobody can say which SDK this came from.
      Re-searched 2026-09-13 and the absence is total: no `10.0.NNNNN` string, no build
      number, no .rc, no README, no manifest, in either tree. Identifying the SDK
      version is still owed and cannot be done from this tree alone — it needs a real
      SDK drop to diff against.

      What the tree DOES date: `_M_ARM64EC` appears in 7 files, headers and sources
      both (corecrt.h, corecrt_math.h, corecrt_internal_simd.h, strnlen.cpp,
      string/arm64/{strlen,wcslen}.s, startup/abort.cpp). ARM64EC arrived with the
      Windows 11 SDK, so that is an evidence-backed FLOOR of 10.0.22000. `AVX512`
      appears nowhere, `_CRT_HAS_CXX17` does. Treat these as brackets, not an answer.

      `modified:` WAS `unknown`, on the argument that `grep -rl ReactOS sdk/lib/ucrt`
      is empty across all 459 TUs. That argument is wrong, and the field is now `yes`:
      the drop carries 23 clang/GCC adaptation sites across 8 files, none of which
      Microsoft would ship. `string/strnlen-sse2.cpp:9` and `strnlen-avx2.cpp:9` are
      `#pragma GCC target(...)`, which MSVC does not have at all; corecrt_internal_simd.h
      gives `_UCRT_ENABLE_SSE2`/`_UCRT_ENABLE_AVX2` separate clang and GCC spellings;
      and `strnlen.cpp:90` turns `common_strnlen_simd` from a DEFINITION into a bare
      DECLARATION under clang, which is a behavioural change, not a portability shim.
      The others are inc/corecrt_internal_{stdio_output,traits}.h,
      internal/winapi_thunks.cpp and misc/invalid_parameter.cpp.

      The lesson generalises past this entry: ABSENCE OF A `__REACTOS__` MARKER IS NOT
      EVIDENCE OF AN UNMODIFIED DROP. These edits carry no marker of any kind. So a
      re-vendor here is a MERGE, not a copy — the same trap the FDLIBM entry above
      records for its 1997 Shimizu patch, and the reason `modified` is worth getting
      right rather than leaving at `unknown`.

  # ── x86 emulation for wow64 / arm64ec ───────────────────────────────────
  - path: external/fex
    name: FEX-Emu
    upstream: https://github.com/FEX-Emu/FEX
    license: MIT
    license_extra:
      LGPL-2.1-or-later: >
        Wine-derived headers FEX carries for its Windows build:
        Source/Windows/include/{winternl.h,winnt.h} and
        Source/Windows/include/wine/{unixlib.h,debug.h}.
      GPL-2.0-only: >
        External/xxhash/tests/{sanity_test.c,sanity_test_vectors_generator.c} — upstream
        xxhash dual-licences its library BSD and its tests GPL. Not built by us; recorded
        because the files are in the tree.
      Apache-2.0: >
        External/code-format-helper/code-format-helper.py and
        External/unordered_dense/test/third-party/FuzzedDataProvider.h (LLVM). FEX is a
        vendored tree that itself vendors: its External/ is a second registry we do not
        maintain, so those licences surface here rather than upstream.
    license_file: external/fex/LICENSE
    modified: "no"  # asserted by external/README-fex-vendor.md
    version:
      literal: FEX-2607 (1cc4b93e7a71c883ec021b71359f136394dc1f3c, snapshot 2026-07-08)
    reason: >
      A pruned byte-identical snapshot of an upstream tag, built out-of-band by
      tools/fex/build-fex.sh and deliberately outside the ReactOS cmake graph.
      Full manifest, prune list and re-vendor recipe: external/README-fex-vendor.md.

  # ── SGI's GLU under glu32.dll ───────────────────────────────────────────
  - path: dll/opengl/glu32/src
    name: SGI GLU (OpenGL Utility Library)
    upstream: SGI OpenGL Sample Implementation — the `glu` component, as redistributed
      with Mesa. No release stamp in the drop; see review.
    license: SGI-B-2.0
    license_ref: dll/opengl/glu32/include/GL/glu.h
    license_extra:
      LGPL-2.0-or-later: >
        include/GL/glu_mangle.h is not SGI's — it is Mesa 3.0, Copyright (C) 1995-1998
        Brian Paul, under the GNU Library General Public License v2 or later. One file,
        a symbol-mangling header, but a copyleft licence sitting inside a permissive
        drop is exactly the shape this registry exists to make visible.
    modified: unknown
    headers:
      - dll/opengl/glu32/include
    reason: >
      47,386 lines of SGI's GLU across libnurbs (NURBS tessellation), libtess (polygon
      tessellation) and libutil, carried by upstream ReactOS and never registered. Found
      2026-09-19 by widening the foreign-copyright scan past its eight corporate holders
      — `--suspects` could not see it because Silicon Graphics was not in the list.

      Zero ReactOS-authored files in the tree, which makes it the cleanest vendored entry
      in this registry: no adapters, no missing-header reconstructions, no scope leak.
      Only the BUILD WRAPPER is ours and it deliberately sits outside this path —
      dll/opengl/glu32/{CMakeLists.txt,glu32.spec,glu32.rc,precomp.h}. A path-based entry
      must not claim those, so the tree is `src` plus the `include` headers and stops
      there.

      Every one of the 190 sources declares SGI FREE SOFTWARE LICENSE B (Version 2.0,
      Sept. 18, 2008). The 73 files that reference http://oss.sgi.com/projects/FreeB/
      are NOT a second licence — that URL is part of License B's own required notice,
      and reading it as FreeB 1.1 is the obvious wrong answer here.
    review: >
      NO VERSION PROBE, deliberately. The drop carries no release stamp: what it does
      carry is the API level, `GLU_VERSION_1_3` in include/GL/glu.h, so this is the GLU
      1.3 interface. That is an API version, not a version of this source drop, and
      recording it in the `version:` field would make the table state something the tree
      does not say — the same mistake vendor.yaml's header warns about for ucrt.

  # ── sdk/lib/3rdparty ────────────────────────────────────────────────────
  - path: sdk/lib/3rdparty/freetype
    name: FreeType
    upstream: https://freetype.org/
    license: FTL OR GPL-2.0
    modified: unknown
    version:
      file: sdk/lib/3rdparty/freetype/include/freetype/freetype.h
      patterns:
        - '#define FREETYPE_MAJOR\s+(\d+)'
        - '#define FREETYPE_MINOR\s+(\d+)'
        - '#define FREETYPE_PATCH\s+(\d+)'
      join: "."
    reason: >
      Font rasteriser, ~208K lines and the single largest vendored tree. win32k
      consumes it through a stable C API; upstream tracking beats ownership.

  - path: sdk/lib/3rdparty/zlib
    name: zlib
    upstream: https://zlib.net/
    license: Zlib
    license_file: sdk/lib/3rdparty/zlib/LICENSE
    modified: unknown
    headers:
      - sdk/include/reactos/libs/zlib
    version:
      file: sdk/include/reactos/libs/zlib/zlib.h
      pattern: '#define ZLIB_VERSION "([^"]+)"'
    reason: Ubiquitous compression library; upstream-tracked.

  - path: sdk/lib/3rdparty/libxml2
    name: libxml2
    upstream: https://gitlab.gnome.org/GNOME/libxml2
    license: MIT
    license_file: sdk/lib/3rdparty/libxml2/COPYING
    modified: unknown
    version:
      file: sdk/lib/3rdparty/libxml2/include/libxml/xmlversion.h
      pattern: '#define LIBXML_DOTTED_VERSION "([^"]+)"'
    reason: XML parser; upstream-tracked.

  - path: sdk/lib/3rdparty/adns
    name: adns
    upstream: https://www.chiark.greenend.org.uk/~ian/adns/
    license: GPL-2.0-or-later
    license_file: sdk/lib/3rdparty/adns/COPYING
    modified: unknown
    version:
      file: sdk/lib/3rdparty/adns/client/client.h
      pattern: '#define ADNS_VERSION_STRING "([^"]+)"'
    reason: Asynchronous DNS resolver; upstream-tracked.

  - path: sdk/lib/3rdparty/libmpg123
    name: libmpg123
    upstream: https://www.mpg123.de/
    license: LGPL-2.1
    modified: unknown
    headers:
      - sdk/include/reactos/libs/libmpg123
    version:
      file: sdk/include/reactos/libs/libmpg123/mpg123.h
      pattern: '#define MPG123_API_VERSION\s+(\d+)'
    reason: MPEG audio decoder; upstream-tracked.

  - path: sdk/lib/3rdparty/libsamplerate
    name: libsamplerate
    upstream: https://libsndfile.github.io/libsamplerate/
    license: BSD-2-Clause
    license_file: sdk/lib/3rdparty/libsamplerate/COPYING
    modified: unknown
    reason: Sample-rate conversion; upstream-tracked.

  - path: sdk/lib/3rdparty/libwin-iconv
    name: win-iconv
    upstream: https://github.com/win-iconv/win-iconv
    license: Unlicense OR MIT
    modified: unknown
    reason: iconv shim over the Win32 codepage APIs; upstream-tracked.

  - path: sdk/lib/3rdparty/stlport
    name: STLport
    upstream: http://www.stlport.org/
    license: STLport licence (permissive)
    modified: unknown
    reason: >
      C++ standard library used by the C++ substrate. Upstream is long dead, but it
      is still a foreign STL implementation rather than ReactOS code; translating an
      STL to Rust is not a goal of this project.

  - path: sdk/lib/3rdparty/cardlib
    name: cardlib
    upstream: unknown
    license: unknown
    modified: unknown
    reason: Card-rendering library for the bundled card games, carried in the 3rdparty tree.
    review: >
      Provenance not established — no COPYING, and ReadMe.txt does not name an
      upstream. If this turns out to be ReactOS-authored it belongs OUT of this
      registry and IN the translation denominator.

  - path: sdk/lib/3rdparty/libwine
    name: libwine
    upstream: https://gitlab.winehq.org/wine/wine
    license: LGPL-2.1
    modified: unknown
    reason: Wine's port/support library, carried in the 3rdparty tree by upstream ReactOS.
    review: >
      CLASSIFICATION IS A JUDGEMENT CALL, flagged rather than made quietly: the
      roadmap's Phase 0 Tier 3 treats the Wine-derived bucket (~154 DLLs) as a
      translation TARGET, and this is Wine-derived. It sits here only because
      upstream files it under 3rdparty. 1.1K lines, so the stakes are small either
      way — but the answer should be deliberate.

  - path: sdk/lib/3rdparty/strmbase
    name: strmbase
    upstream: https://gitlab.winehq.org/wine/wine
    license: LGPL-2.1
    modified: unknown
    reason: Wine's DirectShow base classes, carried in the 3rdparty tree by upstream ReactOS.
    review: Same open question as libwine — Wine-derived, and the Wine bucket is a target.

  # ── dll/3rdparty ────────────────────────────────────────────────────────
  - path: dll/3rdparty/mbedtls
    name: Mbed TLS
    upstream: https://github.com/Mbed-TLS/mbedtls
    license: Apache-2.0
    review: >
      MIXED UNTIL 2026-09-19, now clean: _reactos_strsafe_wrapper.c was a ReactOS-authored
      LGPL-2.1-or-later adapter (StringCchVPrintfEx -> _vsnprintf_s, Copyright 2015 Ismael
      Ferreras Morezuelas) sitting inside this Apache-2.0 drop. Moved out to
      sdk/lib/mbedtls_reactos/strsafe_wrapper.c, so the tree is now a pure upstream copy
      and a re-vendor is a copy rather than a merge. It was found BY HAND, not by
      `--licences`: it declares its licence in prose with no SPDX tag, which is that
      scan's blind spot. A re-vendor must not reintroduce it.
    modified: unknown
    headers:
      - sdk/include/reactos/libs/mbedtls
    version:
      file: sdk/include/reactos/libs/mbedtls/version.h
