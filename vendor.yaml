      Microsoft-copyright; the difference is what the code is FOR. WDF is a stable ABI
      third-party binaries bind to, so it has to stay the framework Windows ships. The
      storage class drivers are just drivers this OS runs — nothing outside the tree
      depends on their internals, there is no compatibility contract to preserve, and
      ReactOS has already diverged them (13 of 24 files carry ReactOS edits). They are
      shipped under MS-PL, which grants derivative works outright, so a Rust rewrite is
      as licensed as the C edits already made.

      They are also exactly the kind of code the project wants in Rust: pointer-heavy
      IRP dispatch in a driver that runs on the boot path for every disk. Excluding 97K
      lines of storage stack from the denominator because a copyright line says
      Microsoft would be the failure the registry was built to prevent.

  - path: drivers/storage/class/cdrom
    name: cdrom (storage class driver)
    origin: Microsoft DDK sample, MS-PL (drivers/storage/class/cdrom/license.txt)
    tier: "Tier 3 (native userland/driver queue)"
    reason: >
      37.3K lines, 6 of 19 files ReactOS-edited. Same argument as classpnp: MS-PL
      derivative-work grant, no external ABI contract, already diverged, and a driver
      this OS owns rather than tracks.

  - path: drivers/storage/class/disk
    name: disk (storage class driver)
    origin: Microsoft DDK sample, MS-PL (drivers/storage/class/disk/license.txt)
    tier: "Tier 3 (native userland/driver queue)"
    reason: >
      14K lines, 4 of 7 files ReactOS-edited. Same argument as classpnp.

  # ── our PSDK, with a few SDK headers inside it ──────────────────────────
  - path: sdk/include/psdk
    name: PSDK (ReactOS's Win32 SDK headers)
    origin: ReactOS-authored, with five verbatim SDK headers inside it
    reason: >
      Not a foreign tree at all — this is ReactOS's own PSDK. It appears on the scan
      because five of its ~700 headers carry a Microsoft copyright and are carried
      verbatim (d3dkmdt.h, d3dukmdt.h, no_sal2.h, specstrings.h, specstrings_strict.h).

      Registered as ours rather than split into a five-file vendored entry, because the
      unit of vendoring in this registry is a TREE with an upstream you can re-vendor
      from, and these are individual headers living inside our own. Nothing here is a
      translation target in the first place — the project translates C bodies, and this
      directory has none.
