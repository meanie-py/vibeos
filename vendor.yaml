      Every one of the 190 sources declares SGI FREE SOFTWARE LICENSE B (Version 2.0,
      Sept. 18, 2008). The 73 files that reference http://oss.sgi.com/projects/FreeB/
      are NOT a second licence — that URL is part of License B's own required notice,
      and reading it as FreeB 1.1 is the obvious wrong answer here.
    review: >
      NO VERSION PROBE, deliberately. The drop carries no release stamp: what it does
      carry is the API level, `GLU_VERSION_1_3` in include/GL/glu.h, so this is the GLU
      1.3 interface. That is an API version, not a version of this source drop, and
      recording it in the `version:` field would make the table state something the tree
      does not say — the same mistake vendor.yaml's header warns about for ucrt.

      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20, AND THE VERSION IS RECOVERED. This is
      Mesa's standalone glu at GIT TAG glu-9.0.1 — not the SGI Sample Implementation, and
      not a release tarball. The file set is the giveaway: we carry src/libtess/README and
      src/libtess/alg-outline, which exist only in the git tree and are excluded from make
      dist, and we do NOT carry src/meson.build, which 9.0.2 added. Content confirms it:
      after normalizing the systemic transform below, differing files number 13 against
      9.0.0, FIVE against 9.0.1, 7 against 9.0.2, 8 against 9.0.3 and 18 against master.
      9.0.1 is the unambiguous minimum. `version:` is a literal because there is no in-tree
      stamp — only GLU_VERSION_1_3, an API level, which is what the old "no version probe"
      note was reacting to.

      THE 122-FILE "DIFF" IS A DISTRIBUTION FORM, NOT MODIFICATION. Every `#include "x.h"`
      across libnurbs/libtess/libutil/gluos.h is commented out. Same shape
      as ACPICA's licence-header phantom: count it naively and 127 of 194 files look
      modified. Allow that one substitution and only FIVE differ.

      The five: trimregion.h adds a `~TrimRegion(){}` under `#if defined(__REACTOS__) &&
      defined(__clang__)` with a /* FIXME: Inspect */ comment — the one file the old note
      already named, now located precisely. gluos.h adds `#define WIN32_NO_STATUS` and
      `#include <string.h>` (a build shim, not reducible to a -D because the include is a
      real source addition). subdivider.cc and quilt.cc differ only by two statements
      reflowed onto one line — pure formatting. And mipmap.c gives gluScaleImage an explicit
      GLAPI prefix that the other six exported functions in the same file do not have, in
      ours OR upstream: a single-symbol, asymmetric, unexplained dllexport edit. Worth a
      maintainer's second look; not changed here.

      *** LICENCE FINDING: THE RECORDED LICENCE IS INCOMPLETE FOR 73 OF 194 FILES. *** The
      73 .cc implementation files under src/libnurbs/{interface,internals,nurbtess} carry
      "SGI Free Software License B, Version 1.1" — a distinct, earlier licence — while the
      other 117 carry Version 2.0. Verified by direct count in the tree (73 vs 117) and
      confirmed present in pristine glu-9.0.1, so this split is inherited from Mesa and is
      0% ours. Now recorded in `license_extra`. Note the earlier review dismissed the
      oss.sgi.com/FreeB URL as "part of License B's own required notice, not a second
      licence" — correct for the 117 v2.0 files, wrong for these 73, which carry a different
      licence's header rather than merely citing the URL.

      AND THAT EXPOSED A BLIND SPOT IN OUR OWN RATCHET: `vendored.py --licences` reported
      "every declared licence accounted for" while this was sitting in the tree.
      license_drift() looks for SPDX-style identifiers, and these files state their licence
      in free-form prose ("SGI Free Software License B, Version 1.1") with no SPDX tag, so
      it sees nothing. Recorded rather than fixed: teaching the scanner free-text licence
      names is a real change to a gate, not an audit finding.

      Three files carry NO licence header — src/include/gluos.h, src/libtess/README and
      src/libtess/alg-outline — and all three are byte-for-byte that way upstream too, so
      unlike adns's getopt.c this is not something we stripped and not ours to delete. No
      upstream directory was skipped: libnurbs, libtess and libutil are all fully vendored,
      and the file lists match exactly in both directions.

      PATCH-IFIED 2026-09-20. `vendor-patches/glu32.patch` now carries all 127 differing
      files — 729 changed lines — and reproduces this tree BYTE-FOR-BYTE from a pristine
      glu-9.0.1 extraction, verified by applying it to a fresh copy and diffing recursively:
      zero differences, zero fuzz, zero rejects. vendor/glu/include/ is not in the
      patch because it is byte-identical to upstream; note that `path:` here covers only
      src/, while `headers:` records include/ separately.

      CORRECTION, AND IT CHANGES THE ADVICE FOR A RE-VENDOR: this entry used to say the
      122-file include-commenting was safe because the build force-includes everything
      through precomp.h via `add_pch(glu32 precomp.h ...)`. IT DOES NOT. add_pch is
      `if(PCH) target_precompile_headers(...) else() <nothing> endif()` and PCH is OFF by
      default (PCH:BOOL=OFF in every build dir here), so precomp.h is force-included
      nowhere; and even with PCH on it would not reach the C files, since glu32's
      CMakeLists puts all of ${SOURCE} into PCH_SKIP_SOURCE. What is actually observable is
      that glu32.dll builds and links with PCH off, so those headers arrive transitively
      through the includes left alive. The transform therefore buys NOTHING in the default
      configuration: on a bump, drop it and take upstream's includes verbatim rather than
      reapplying it. (Same false mechanism was recorded on libtiff and libsamplerate; both
      corrected in the same pass, and on libsamplerate it was not merely cosmetic — the
      0.2.2 bump broke on exactly this assumption.)

