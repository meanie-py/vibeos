    reason: >
      47,386 lines of SGI's GLU across libnurbs (NURBS tessellation), libtess (polygon
      tessellation) and libutil, carried by upstream ReactOS and never registered. Found
      2026-09-19 by widening the foreign-copyright scan past its eight corporate holders
      — `--suspects` could not see it because Silicon Graphics was not in the list.

      Zero ReactOS-authored files in the tree, which makes it the cleanest vendored entry
      in this registry: no adapters, no missing-header reconstructions, no scope leak.
      Only the BUILD WRAPPER is ours and it deliberately sits outside this path —
      dll/opengl/glu32/{CMakeLists.txt,glu32.spec,glu32.rc,precomp.h}. A path-based entry
