  - path: vendor/mbedtls
    name: Mbed TLS
    translate: keep
    upstream: https://github.com/Mbed-TLS/mbedtls
    license: Apache-2.0 OR GPL-2.0-or-later
    license_file: vendor/mbedtls/LICENSE
    modified: no
    version:
      # build_info.h, upstream's own. 3.x moved the string out of version.h (which
      # still exists and no longer carries it).
      file: vendor/mbedtls/include/mbedtls/build_info.h
      pattern: '#define MBEDTLS_VERSION_STRING\s+"([^"]+)"'
    review: >
      BUMPED 2.16.11 -> 3.6.7 (LTS) ON 2026-09-20, closing the worst entry in this
      registry: the 2.16 branch stopped receiving security fixes at the end of 2021, so
      the TLS library behind schannel and bcrypt had been unmaintained for five years.
      The tree is now `modified: no` — a pure upstream drop, every file byte-identical,
      no patch at all. All three arches build; the TLS harness is green.

      IT WAS DONE IN THREE PHASES, and the first two are why the third was tractable.
      Phase 1 built sdk/lib/rust/schannel-tls-difftest, a real TLS 1.2 handshake through
      the genuine backend on the host, green against 2.16.11 first so it was an oracle
      rather than a hope. Phase 2 removed the glue's dependency on mbedtls/md_internal.h
      and mbedtls/ssl_internal.h — headers 3.x deletes and stops installing, and the
      actual blocker behind the "77 symbols" framing. Only then was this a version
      change.

      WHAT THE HARNESS SAID, and it is the whole return on building it: across a
      five-year major-version jump the negotiated connection is IDENTICAL — TLS 1.2,
      CALG_AES_256 at 256, CALG_SHA_384 at 384, CALG_ECDH_EPHEM at 256, block size 16,
      max message 16384. Exactly ONE value moved: schan_imp_enabled_protocols went
      0xfc0 -> 0xc00, because 3.0 DELETED SSL 3.0, TLS 1.0 and TLS 1.1 outright. That
      narrowing is the single behavioural change in the port, and it is pinned in the
      harness so it had to be looked at rather than discovered later by a client that
      stopped connecting.

      THREE THINGS THE PORT HAD TO SOLVE THAT THE OLD SIZING DID NOT MENTION:

      1. ENTROPY WAS A DEPENDENCY CYCLE. 3.x's built-in Windows entropy source calls
      BCryptGenRandom, and bcrypt.dll already imports mbedtls.dll — importing back
      would close the loop. 2.16 used CryptGenRandom from advapi32 and had no such
      problem. Fixed with MBEDTLS_NO_PLATFORM_ENTROPY plus MBEDTLS_ENTROPY_HARDWARE_ALT
      and a new adapter, sdk/lib/mbedtls_reactos/entropy_hardware_poll.c, going straight
      to RtlGenRandom (advapi32's SystemFunction036, already linked) — the generator
      CryptGenRandom is itself built over, so a shorter path to the same bytes.

      2. AES-NI IS OFF NOW, and that is a performance loss rather than a security one.
      2.16's aesni.c was inline assembly; 3.x rewrote it to intrinsics, and on 32-bit
      x86 that is the only implementation upstream offers. Our x86 baseline is
      -march=pentium and enabling -maes -mpclmul for that one file did not make clang's
      immintrin.h declare the intrinsics under our -nostdinc include set — the flags do
      reach the command line and __AES__/__PCLMUL__ are defined, yet the intrinsics stay
      undeclared, while the same file compiles standalone with the same flags. Left
      unresolved and written down rather than papered over; AES falls back to portable C.

      3. platform.c CALLS vsnprintf_s NOW, not _vsnprintf_s, and msvcrt exports only the
      underscored spelling. sdk/lib/mbedtls_reactos/strsafe_wrapper.c supplies both names
      over one body.

      RETIRED BY THE BUMP: timing_hardclock.c, a ReactOS adapter that existed only to
      supply mbedtls_timing_hardclock behind -DHAVE_HARDCLOCK. 3.x deleted hardclock from
      timing.c, so both the adapter and the define are gone.

      THE SOURCE LIST IS NOW EVERY .c UPSTREAM SHIPS (109 of them). 2.16's was
      hand-curated with 32 entries commented out, which made every bump a three-way merge
      between upstream's file set, our comments, and whatever the config actually
      enabled. A source whose feature is off compiles to an empty translation unit, so
      listing all of them costs nothing and moves the decision into one place:
      vendor/mbedtls/include/mbedtls/mbedtls_config.h.

      WHAT IS DELIBERATELY OFF IN THAT CONFIG: PSA Crypto and TLS 1.3, both default-on
      in 3.6. This bump preserves capability (TLS 1.2) and buys five years of fixes;
      turning on TLS 1.3 is a real improvement and a separate, reviewable change, not
      something to smuggle into a catch-up. The switches are named in the config.

      TWO PROPERTIES OF THIS TLS STACK, unchanged by the bump and worth knowing because
      neither is obvious: schannel_mbedtls.c sets MBEDTLS_SSL_VERIFY_NONE, so mbedTLS
      does not validate the peer certificate (schannel's contract puts that on the
      caller, and Wine does the same); and MBEDTLS_HAVE_TIME is off, so there is no
      certificate expiry checking anywhere.

      ALSO STILL TRUE: schannel's server path is dead twice over. MBEDTLS_SSL_SRV_C is
      off, and nothing in the glue ever calls mbedtls_ssl_conf_ca_chain, so the
      SECPKG_CRED_INBOUND arm would have no CA chain even if the library had a server in
      it.

      HISTORY. Before this bump the tree was 2.16.11 with exactly one modified file
      (timing.c, a portability widening of a QueryPerformanceCounter guard) and a
      ReactOS-authored LGPL adapter that had been moved out to sdk/lib/mbedtls_reactos/
      on 2026-09-19 so the drop would be a pure copy. That move is what makes this bump
      a delete-and-replace rather than a merge.
    reason: TLS/crypto for schannel and bcrypt; upstream-tracked.

  - path: vendor/libjpeg
    name: libjpeg
    translate: keep
    upstream: https://ijg.org/
    license: IJG
    license_file: vendor/libjpeg/README
    modified: no  # sources byte-identical to pristine IJG 9d
    patch: vendor-patches/libjpeg.patch
    version:
      # jversion.h carries the real IJG release ("9d  12-Jan-2020"). The old
      # extractor read JPEG_LIB_VERSION from jpeglib.h, which is 90 for every
      # 9.x release and so cannot tell 9a from 9d — useless for CVE matching.
      file: vendor/libjpeg/include/jversion.h
      pattern: '#define JVERSION\s+"([^ "]+)'
    review: >
      BUMPED 9d -> 9f ON 2026-09-20, and it was the cheapest bump in this registry: the
      one patched hunk applied to 9f with no fuzz and no rejects, every source file is
      byte-identical to pristine 9f, and libjpeg.dll plus windowscodecs build unchanged
      on i386, amd64 and arm64. Tarball jpegsrc.v9f.tar.gz, sha256
      04705c110cb2469caa79fb71fba3d7bf834914706e9641a4589485c1f832565b. That is what a
      tree kept at "pristine apart from one header" is worth.

      jconfig.h is ours and needed no change: upstream's jconfig.txt is byte-identical
      between 9d and 9f, and the macros ours omits (BMP_SUPPORTED, GIF_SUPPORTED,
      TARGA_SUPPORTED, TWO_FILE_COMMANDLINE and the rest) are cjpeg/djpeg application
      switches the library never reads.

      DELETED IN THE SAME PASS: sdk/include/reactos/libs/libjpeg/rosdiff.patch, an
      in-tree copy of the same hunk with repo-root-relative paths. It predates
      vendor-patches/ and was the precedent this directory followed; keeping both means
      two records of one fact, and it was already stale at 9d's line offsets. Nothing
      referenced it.

      LINEAGE WARNING, unchanged: the IJG 9.x line is NOT libjpeg-turbo, which is what
      most distributions ship and where most CVE traffic is reported. Match advisories
      against IJG releases, not turbo ones.

      PARTIALLY DE-PATCHED 2026-09-19. jpeglib.h and jdct.h differed by trailing
      whitespace only and are restored; the header directory is 10 of 11 identical.

      jmorecfg.h CANNOT be de-patched with a -D, and the attempt was refused rather
      than forced. Upstream defines the macros UNGUARDED — `#define GLOBAL(type) type`
      at jmorecfg.h:246, `#define EXTERN(type) extern type` at :248 — so a command-line
      -D is overridden the moment the header is processed. Our patch rewrites the macro
      BODIES to inject JPEG_API/JPEG_IMPEXP, tokens absent from vanilla 9d, and adds the
      `#ifndef EXTERN` guard that would be required to make a -D stick at all. Forcing
      it would either silently not apply or need the file edited anyway, and getting it
      wrong breaks every DLL export. This one belongs in the patch series.

      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-19: jpegsrc.v9d.tar.gz from ijg.org.
      All 73 shared files byte-identical — including the historically fragile ones,
      jdhuff.c, jmemmgr.c, jquant2.c. Nothing in bounds checking, allocation or
      marker/Huffman parsing differs.

      TWO THINGS THE REGISTRY HAD WRONG OR MISSING. The version was recorded as `90`,
