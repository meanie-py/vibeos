  # code, even though the implementation is not vendored here.
# ─────────────────────────────────────────────────────────────────────────────
# THE OTHER HALF: foreign-COPYRIGHT code that IS ours to translate.
#
# `trees:` above answers "what do we not translate". This answers "what did we look at
# and decide we DO", and it exists because that verdict had nowhere to live. Without it
# every such tree stayed permanently on `--suspects`, the decision survived only in a
# commit message, and the next agent re-derived it from scratch — which is how the tree
# ended up with three disagreeing vendored-lists in the first place.
#
# An entry here is a claim about SCOPE, not authorship: this code is foreign-derived and
# we intend to own it, so it stays in the translation denominator. Entries carry no
# version probe and get no VENDORED stamp — both would be false.
#
# Recording both verdicts is what makes `--suspects` a ratchet: `--check` fails on any
# foreign-copyright directory that is in NEITHER list, so newly-imported foreign code has
# to be classified before it can land.
# ─────────────────────────────────────────────────────────────────────────────
  # ── vkd3d (Wine's bundled Direct3D 12 / shader-compiler library) ─────────
  - path: sdk/lib/vkd3d
    name: vkd3d
    translate: keep
    upstream: https://gitlab.winehq.org/wine/vkd3d
    license: LGPL-2.1-or-later
    license_file: sdk/lib/vkd3d/COPYING
    modified: unknown  # not yet diffed against a pristine 1.14 tarball -- owed
    version:
      file: sdk/lib/vkd3d/config.h
      pattern: '#define PACKAGE_VERSION "([^"]+)"'
    reason: >
      Separately released WineHQ library (Direct3D 12 on Vulkan + the HLSL/SPIR-V shader
      compiler) that Wine bundles as an external dependency; tracked against its own
      releases, not translated.
    review: >
      ADDED 2026-09-30 by the 97-commit upstream merge (upstream e98fa71fdcc, "pass at
      building Wine-10.0"), flagged UNCLASSIFIED by `--suspects`.

      `trees:`, not `ours:`, and NOT on the strength of the copyright lines: Wine itself
      does not fork vkd3d. It is a separately released WineHQ project that Wine bundles
      under libs/ as an external library, versioned by its own releases (1.14 here).
      The Wine DLLs that arrived in the same merge (d2d1, d3d1x, dxgi, ...) are the
      opposite case and are filed under `ours:`.

      The version probe reads config.h, which in a vendored tree is usually OUR file
      and can be laundered (see libmpg123). It is used until this tree is compared with
      the pristine 1.14 tarball, which is also what settles `modified:`.

ours:
  - paths:
      - sdk/lib/libwine
      - sdk/lib/strmbase
    name: Wine-derived support libraries
    origin: Wine (LGPL-2.1-or-later)
    tier: "Tier 2-3 (userland DLL queue)"
    reason: >
      MISFILED AS VENDORED UNTIL 2026-09-19. Both were `trees:` entries, and both
      carried a review note admitting the contradiction — Wine-derived code in a
      registry half that means "not ours to translate", while the roadmap treats the
      Wine bucket as a target. The owner settled it: Wine is ours and on the
      translation path, so they belong here with the other 24 Wine modules.

      They also had to MOVE. sdk/lib/3rdparty is a registered CONTAINER where every
      child must be a vendored tree, so `ours:` code cannot live there — `--check`
      refuses it, which is how the mbedtls adapter was caught earlier the same day.
      They are now sdk/lib/{libwine,strmbase}, built from sdk/lib/CMakeLists.txt.

      1,134 + 7,046 lines. Small, but they are linked by quartz, qcap, qedit, amstream
      and (as a static archive by absolute build path) by userinit and winlogon, so the
      move touched four CMakeLists beyond the two being moved.


  # ── Microsoft driver samples we DO translate ────────────────────────────
  - paths:
      - drivers/filesystems/fastfat
      - drivers/filesystems/cdfs
    name: Microsoft sample filesystems (FastFAT, CDFS)
    origin: Microsoft Windows-driver-samples (MIT)
    tier: "Tier 1 (boot-path filesystems)"
    reason: >
      FOUND UNCLASSIFIED 2026-09-20, 114,076 lines between them, by the widened
      `_FOREIGN_HOLDER` -- every file is "Copyright (c) 1989-2000 Microsoft
      Corporation" and the old pattern could not see a year between `(c)` and the
      holder. The largest thing this registry has ever missed.

      They belong in `ours:` and not in `trees:` on the evidence rather than by
      preference: fastfat-rust and cdfs-rust both exist and are being translated,
      and rust-port-status lists both among the boot-path filesystems. Filing them
      as vendored would have cut 114K lines out of the translation denominator --
      the exact silent-shrink this half of the registry exists to prevent.

      LICENCE, AND WHAT CAN ACTUALLY BE CITED: fastfat/README.md is Microsoft's
      Windows-driver-samples page verbatim, `page_type: sample` front matter and
      all, and that repository is MIT. So MIT is very probably right -- but as with
      WDF before its LICENSE was vendored, the grant is a fact about upstream and
      NOT quotable from anything in this tree: neither directory carries a LICENSE,
      COPYING or any permission text. Vendoring the upstream MIT LICENSE into both
      is the cheap fix and is owed. Until then this is recorded, not resolved.

  # ── Wine-derived code: OURS, and on the translation path ────────────────
  - paths:
      - dll/win32/comctl32
      - dll/win32/crypt32
      - dll/win32/hhctrl.ocx
      - dll/win32/hlink
      - dll/win32/hnetcfg
      - dll/win32/ieframe
      - dll/win32/inetcomm
      - dll/win32/jscript
      - dll/win32/mshtml
      - dll/win32/msi
      - dll/win32/msvcrt
      - dll/win32/msxml3
      - dll/win32/ole32
      - dll/win32/oleacc
      - dll/win32/rpcrt4
      - dll/win32/setupapi
      - dll/win32/urlmon
      - dll/win32/vbscript
      - dll/win32/wbemprox
      - dll/win32/windowscodecs
      - dll/win32/winhttp
      - dll/win32/wininet
      - dll/directx/wine/d3dcompiler_43
      - dll/directx/wine/wined3d
    name: Wine-derived shipped modules
    origin: Wine (LGPL-2.1-or-later), mostly `Copyright <year> <person> for CodeWeavers`
    tier: "Tier 2-3 (userland DLL queue)"
    reason: >
      ONE DECISION, 24 paths, owner-confirmed 2026-09-19: Wine-derived code is OURS and
      is on the translation path. These are forked Wine modules this project ships,
      maintains and translates — not a vendored drop tracked against upstream. The
      proof is in the tree: dll/win32/msvcrt is on this list and is already ~fully
      translated, graded against the genuine C by msvcrt-difftest.

      They are listed here rather than left silent because `--suspects` learned to see
      Wine on 2026-09-19 (it matches `Copyright ... for CodeWeavers`, since Wine does
      not use the `(c)` form the other holders do) and would otherwise re-ask about 24
      directories forever. Being in `ours:` is a claim about SCOPE, not authorship: the
      code is foreign, the responsibility is ours, and the lines stay in the
      translation denominator.

  # ── Wine-derived code declined at build time: still OURS ────────────────
  - paths:
      - dll/win32/combase
      - dll/win32/coml2
      - dll/win32/shcore
      - dll/win32/uiautomationcore
    name: Wine COM/shell restructure (combase/coml2/shcore/uiautomationcore)
    origin: Wine (LGPL-2.1-or-later), mostly `Copyright <year> <person> for CodeWeavers`
    tier: "Tier 2-3 (userland DLL queue) — currently UNBUILT, see reason"
    reason: >
      ADDED 2026-09-20 by the 1,269-commit upstream merge, and flagged UNCLASSIFIED by
      `--suspects` (uiautomationcore: 8 files, combase: 5 files; coml2 and shcore sit
      below the >=5-file threshold but are the same case and the same decision).

      Same argument as the 24-path "Wine-derived shipped modules" entry above — LGPL-2.1
      CodeWeavers-style Wine code, forked and shipped by this project, on the
      translation path in principle — but with one difference worth recording instead of
      silently inheriting: **none of the four currently build.**
      `dll/win32/CMakeLists.txt` comments out all four `add_subdirectory()` calls with an
      explicit decision note: upstream's COM/shell restructure is DECLINED for now
      because our ole32 stays monolithic, our kernelbase is a minimal Vista shim, and
      shlwapi keeps its own exports — combase.c externs symbols
      (`Ole32DllGetClassObject`, `DestroyRunningObjectTable`) that only exist once ole32
      has been split, and our ole32 moniker/oleproxy code is already Rust and does not
      export them. Half-adopting the split would link and then misbehave. Full detail:
      upstream-sync-merge-decisions.md.

      Filed as `ours:` rather than `trees:` for the same reason fastfat/cdfs were:
      dropping them from the denominator on account of being temporarily unbuilt would
      be exactly the silent-shrink this half of the registry exists to prevent, and the
      standing rule is to never hide a translation (or a translation CANDIDATE) from
      view. If the restructure is ever adopted, this is the tier queue entry to pick up;
      until then these four are dead-but-present source, same shape as a cohab-flipped
      `.c` file, just never wired in rather than wired out.

  - paths:
      - dll/directx/wine/d2d1
      - dll/directx/wine/d3d10
      - dll/directx/wine/d3d11
      - dll/directx/wine/d3dx10_43
      - dll/directx/wine/dmusic
      - dll/directx/wine/dwrite
      - dll/directx/wine/dxgi
    name: Wine-10 DirectX modules
    origin: Wine (LGPL-2.1-or-later), mostly `Copyright <year> <person> for CodeWeavers`
    tier: "Tier 2-3 (userland DLL queue)"
    reason: >
      ADDED 2026-09-30 by the 97-commit upstream merge (upstream's Wine-10.0 DirectX
      sync), flagged UNCLASSIFIED by `--suspects`. Same decision as the 24-path
      "Wine-derived shipped modules" entry, owner-confirmed 2026-09-19: forked Wine code
      this project ships is ours and on the translation path. d3d10, d3d11, d3dx10_43,
      dmusic and dxgi build; d2d1 and dwrite are on disk but not wired into
      dll/directx/wine/CMakeLists.txt, and stay in the denominator for the same reason
      the unbuilt combase/coml2/shcore did.

  - paths:
      - modules/rostests/winetests/comctl32
      - modules/rostests/winetests/kernel32
      - modules/rostests/winetests/mshtml
      - modules/rostests/winetests/msi
      - modules/rostests/winetests/shell32
      - modules/rostests/winetests/ucrtbase
      - modules/rostests/winetests/urlmon
      - modules/rostests/winetests/windowscodecs
      - modules/rostests/winetests/activeds
      - modules/rostests/winetests/combase
      - modules/rostests/winetests/rtworkq
      - modules/rostests/winetests/shcore
      - modules/rostests/winetests/uiautomationcore
      - modules/rostests/winetests/vbscript
    name: Wine conformance tests
    origin: Wine's own test suite (LGPL-2.1-or-later)
    reason: >
      A DIFFERENT argument from the shipped modules above, which is why it is a separate
      entry. These are Wine's conformance tests: they are the ORACLE we grade against,
      not code we are porting. Translating them would be translating the ruler. They are
      `ours:` in the only sense that matters to this registry — a deliberate decision,
      not an unclassified import — and they should NOT be read as translation debt.

      The last six paths were ADDED 2026-09-20 by the 1,269-commit upstream merge, which
      also brought the corresponding shipped-module sources (activeds, combase, rtworkq,
      shcore, uiautomationcore, vbscript). vbscript builds; the other four DLLs under
      test do not — combase/coml2/shcore/uiautomationcore are commented out of
      `dll/win32/CMakeLists.txt` (upstream's COM/shell restructure is declined, see the
      shipped-module entry below) — but `modules/rostests/winetests/CMakeLists.txt`
      still `add_subdirectory`s all of their test dirs unconditionally. That is Wine's
      test suite either way, oracle not translation debt, same as the rest of this list;
      it is filed here rather than left silent because `--suspects`' >=5-file threshold
      flagged winetests/vbscript (12 files) and winetests/combase (8 files) as
      unclassified, and the other four sit below that threshold but are the same case.

  - paths:
      - sdk/include/wine
    name: Wine headers
    origin: Wine (LGPL-2.1-or-later)
    reason: >
      The Wine compatibility headers the modules above compile against. Headers, not
      bodies, so they carry no translation debt either way (the `ours:` table measures
      bodies) — but they are foreign-copyright and unclassified code sits in neither
      list, so the ratchet is owed an answer. This is it.

  # ── Microsoft DDK storage class drivers ─────────────────────────────────
  # All three share one argument, written out here and cross-referenced below.
  - path: drivers/storage/class/classpnp
    name: classpnp (storage class port driver)
    origin: Microsoft DDK sample, MS-PL (drivers/storage/class/classpnp/license.txt)
    tier: "Tier 3 (native userland/driver queue)"
    reason: >
      46.5K lines, and the decision that separates this from WDF. Both are
      Microsoft-copyright; the difference is what the code is FOR. WDF is a stable ABI
      third-party binaries bind to, so it has to stay the framework Windows ships. The
      storage class drivers are just drivers this OS runs — nothing outside the tree
      depends on their internals, there is no compatibility contract to preserve, and
      ReactOS has already diverged them (13 of 24 files carry ReactOS edits). They are
      shipped under MS-PL, which grants derivative works outright, so a Rust rewrite is
      as licensed as the C edits already made.

      They are also exactly the kind of code the project wants in Rust: pointer-heavy
      IRP dispatch in a driver that runs on the boot path for every disk. Excluding 97K
      lines of storage stack from the denominator because a copyright line says
      Microsoft would be the failure the registry was built to prevent.

  - path: drivers/storage/class/cdrom
    name: cdrom (storage class driver)
    origin: Microsoft DDK sample, MS-PL (drivers/storage/class/cdrom/license.txt)
    tier: "Tier 3 (native userland/driver queue)"
    reason: >
      37.3K lines, 6 of 19 files ReactOS-edited. Same argument as classpnp: MS-PL
      derivative-work grant, no external ABI contract, already diverged, and a driver
      this OS owns rather than tracks.

  - path: drivers/storage/class/disk
    name: disk (storage class driver)
    origin: Microsoft DDK sample, MS-PL (drivers/storage/class/disk/license.txt)
    tier: "Tier 3 (native userland/driver queue)"
    reason: >
      14K lines, 4 of 7 files ReactOS-edited. Same argument as classpnp.

  # ── our PSDK, with a few SDK headers inside it ──────────────────────────
  - path: sdk/include/psdk
    name: PSDK (ReactOS's Win32 SDK headers)
    origin: ReactOS-authored, with five verbatim SDK headers inside it
    reason: >
      Not a foreign tree at all — this is ReactOS's own PSDK. It appears on the scan
      because five of its ~700 headers carry a Microsoft copyright and are carried
      verbatim (d3dkmdt.h, d3dukmdt.h, no_sal2.h, specstrings.h, specstrings_strict.h).

      Registered as ours rather than split into a five-file vendored entry, because the
      unit of vendoring in this registry is a TREE with an upstream you can re-vendor
      from, and these are individual headers living inside our own. Nothing here is a
      translation target in the first place — the project translates C bodies, and this
      directory has none.

  # ── the NDK, ReactOS's own native API headers ───────────────────────────
  - path: sdk/include/ndk
    name: NDK (ReactOS native API headers)
    origin: ReactOS-authored (Alex Ionescu, alex.ionescu@reactos.com)
    reason: >
      45 headers carrying `Copyright (c) Alex Ionescu.  All rights reserved.` and no
      grant of any kind, which is why `--grants` reported the directory twice (the
      root and the i386 subdir). The header block is the DDK's `/*++ ... --*/` house
      style, which has no LICENSE: line to put one on.

      Not a foreign tree: the NDK was written FOR ReactOS by one of its founders,
      using a reactos.com address, and has shipped as part of ReactOS since 2004 —
      so the project's own COPYING is its grant, the same as for any other
      contribution. "All rights reserved" beside a personal copyright is the 1990s
      boilerplate the DDK template carried, not a withholding.

      Registered as ours rather than given a licence file, because adding a grant to
      45 upstream files on a contributor's behalf is not ours to write, and it would
      conflict with every ReactOS sync forever. Nothing here is a translation target
      anyway: headers, no C bodies.

  # ── Ken Kato's Virtual Floppy Drive, shipped inside rosapps ─────────────
  - paths:
      - modules/rosapps/lib/vfdlib
      - modules/rosapps/drivers/vfd
      - modules/rosapps/include/vfd
    name: Virtual Floppy Drive (VFD)
    origin: Ken Kato, Virtual Floppy Drive 2.1 — GPL-2.0 (see reason)
    tier: "rosapps (not shipped on the boot path)"
    reason: >
      33 files carrying `Copyright (C) 2003-2008 Ken Kato` and no grant of any kind.
      One decision, three directories, because ReactOS split one upstream program
      into a driver, a control library and its shared headers.

      The grant is GPL-2: the upstream project (Virtual Floppy Drive, SourceForge
      `projects/vfd`) is published under GNU GPL v2.0, and ReactOS carries it inside
      `modules/rosapps`, whose own COPYING is the GPL-2 text. So the terms are
      readable in this distribution twice over — what is missing is any file saying
      which licence applies, which is why `--grants` reported all three directories.

      Recorded here rather than by editing 33 upstream headers, which would conflict
      with every ReactOS sync. NOT laundered through the rosapps COPYING: a
      collection licence three levels up is explicitly rejected as coverage
      (`_COLLECTION_ROOTS`), precisely so these three directories could not go quiet
      on their own. What is NOT verified: the SourceForge project page states the
      licence and the program name but does not name Ken Kato, so the chain is
      name-and-licence, not authorship. Cheap to firm up if it ever matters —
      the upstream release tarball carries a COPYING and a readme.

  # ── Found 2026-09-25 in upstream's `media/doc/3rd Party Files.txt` ──────
  # Both were third-party per upstream's own ledger, and both are ALREADY Rust: a
  # `trees:` entry would have been false twice over (we do translate them, and did).
  - path: drivers/storage/port/buslogic
    name: VMware BusLogic BT-958 SCSI miniport (vmscsi)
    origin: VMware, based on the Linux BusLogic driver — GPL-2.0-or-later (BusLogic958.c header)
    tier: "Tier 1 (storage port drivers)"
    reason: >
      Upstream's ledger lists it as VMware's vmscsi 1.2.0.4 (2005-08-17), GPL-2.0-or-later,
      and README.ReactOS records where VMware published it. BusLogic958.c is translated
      and cohab-flipped to buslogic-rust; the C stays on disk per the never-delete rule.
      Recorded because the Rust is a derivative of GPL-2.0-or-later code, and that is a
      fact about the shipped buslogic.sys whoever wrote the translation.

  - path: sdk/lib/cryptlib
    name: cryptlib (MD4/MD5/RC4/SHA1/AES/DES)
    origin: Wine contributors (Leidekker, McCormack, Navara, Kamuju, Jung) — LGPL-2.1-or-later; mvAesAlg from Marvell's OCF reference AES
    tier: "Tier 1 (ksecdd dependency)"
    reason: >
      The primitive crypto ksecdd.sys links. Per-file headers are Wine-era LGPL
      (Hans Leidekker's MD4/MD5, Mike McCormack's RC4, Filip Navara's SHA1, Vijay Kiran
      Kamuju's AES, Michael Jung's DES), plus mvAesAlg from an OpenWrt/Marvell reference
      implementation that README.txt cites. Already translated: the cross build links
      libcryptlib_rust.a from cryptlib-rust and compiles only a stub TU; the C is built
      solely for host tools. `ours:` rather than `trees:` because it is translated.
