      # VERSION's PKG_REVISION=11, and upstream 0.2.1 ships that exact same stale file,
      # so probing it reports 0.1.11 and launders upstream's error. 0.2.1 is established
      # in the review from the Sun BSD relicense boundary plus whole-tree best fit.
      literal: 0.2.1  # established 2026-09-20; no probe-able source exists
    review: >
      DIFFED AGAINST PRISTINE UPSTREAM 2026-09-20 and THE RECORDED VERSION WAS WRONG. The
      entry said `modified: yes` with no patch and no review, and probed 0.1.11 out of the
      VERSION file. It is really 0.2.1.

      The probe is now REMOVED rather than repointed, because there is no honest in-tree
      source for this version: upstream 0.2.1's own VERSION file ALSO says PKG_REVISION=11 —
      upstream never bumped it — so ours is byte-identical to theirs and the probe was
      faithfully laundering upstream's error. Third instance of this shape here, after
      libjpeg's JPEG_LIB_VERSION 90 and libmpg123's MPG123_API_VERSION 45; an API or
      packaging number is not a release. (libsamplerate had exactly the same defect until
      the 0.2.2 bump, also from an upstream-shipped stale config.)

      0.2.1 established two independent ways. First, licence headers: our sources carry the
      BSD-3-Clause "Copyright (c) 2009, Sun Microsystems, Inc." notice, while 0.1.11 still
      carries the old restrictive Sun RPC legend ("not authorized to license or distribute
      it to anyone else"). Sun relicensed after 0.1.11, so this tree cannot be 0.1.11 —
      which also means the recorded BSD-3-Clause licence was right all along while the
      version was not. Second, best fit: whole-tree normalized diff is 8106 lines against
      0.1.11, 3652 against 0.2.1 and 4442 against 0.2.2.

      The delta is a WINDOWS PORT, not ReactOS logic. The added files give it away:
      src/wintirpc.c, src/winstubs.c, src/auth_sspi.c, src/authsspi_prot.c, tirpc/wintirpc.h
      and tirpc/rpc/auth_sspi.h — SSPI standing in for GSS-API (src/auth_gss.c and
      src/authgss_prot.c are commented out of the CMake source list) plus a Win32 syscall
      shim; src/asprintf.c and src/gettimeofday.c are POSIX fill-ins. 92 files differ, ~3652
      normalized lines, 17 byte-identical, 10 ours-only. The patch reproduces the tree byte-
      for-byte from pristine 0.2.1 (109 files compared, 0 mismatches). It cannot separate
      third-party porting from later local edits: the port has no separately published
      artifact, the same dead-upstream problem as adns and dxtn.

      MEASUREMENT TRAP worth inheriting: several files here are ISO-8859 rather than UTF-8,
      and `grep -c` silently produced NO OUTPUT on twelve of them under this shell, so they
      read as unmeasured rather than as errors. Count with awk and LC_ALL=C. Normalize
      CRLF/trailing whitespace too, or the totals inflate.
    reason: Transport-independent RPC; upstream-tracked.

