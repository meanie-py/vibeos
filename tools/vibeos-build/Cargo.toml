[package]
name = "vibeos-build"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libc = "=0.2.191"
regex = "=1.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha1 = "=0.10.6"
sha2 = "=0.10.8"
shlex = "=2.0.1"
tar = "=0.4.44"
tempfile = "=3.23.0"
toml = { version = "=0.8.14", default-features = false, features = ["parse"] }
