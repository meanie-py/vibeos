# kmtest conformance payload — conformance-ratchet quest M2.
# Design doc: docs/engineering/conformance-ratchet-quest.md.
#
# The kmtest binaries themselves (kmtest_.exe, kmtest_drv.sys + helper
# drivers) are staged to reactos/bin by add_rostests_file when the build dir
# has ENABLE_ROSTESTS(_KMTESTS)=ON. This payload grafts:
#   * kmtest-sweep.exe into the All Users Startup folder (the real Windows
#     autostart mechanism, walked by explorer's AutoStartupApplications; a
#     native GUI-subsystem exe — a .cmd there dies silently, ShellExecuteExW
#     on scripts from the startup walk never spawns cmd.exe)
#   * kmtest-tests-{arch}.txt (the PER-ARCH sweep list) staged in-guest as
#     bin/kmtest-tests.txt. Per-arch because i386 runs kmtest_drv under
#     DUMMY_PSEH (native SEH is amd64/arm64-only) → a strictly larger set of
#     structural crashers than amd64, so quarantines diverge by arch.
# Booting a rostests-less build with this payload fails loudly on serial
# ([KMTEST-SWEEP] launch FAILED) — no silent degradation.
name: kmtest
description: kernel-mode NT API conformance tests (kmtests) — serial-teed sweep autostart

build_hint: "tools/payloads/kmtest/build.sh {arch}"

binaries:
  - src: tools/payloads/kmtest/kmtest-sweep-{arch}.exe
    root: image
    dest: Profiles/All Users/Start Menu/Programs/StartUp/kmtest-sweep.exe
  - src: tools/payloads/kmtest/kmtest-tests-{arch}.txt
    dest: bin/kmtest-tests.txt

test:
  # The sweep gates on SC_AutoStartComplete, then runs one kmtest_.exe per
  # listed test (180s per-test cap). Budget generously: gate + N tests.
  launch_marker: "[KMTEST-SWEEP] done"
  launch_drain_secs: 5400
  # Sample every vCPU each 20 s of serial silence (silence-samples.txt in the
  # run dir). Diagnostic only: arm64 NpfsConnect goes quiet ~95 s per round
  # with the clock ticking and nothing scheduled, then recovers -- no hang
  # path ever fires, so the only chance to see what holds the CPU is DURING it.
  silence_sample_secs: 20
