# shlwapi's runtime oracle: Wine's shlwapi suite (shlwapiwinetest's list) against the
# pre-flip C. build.sh builds shlwapi_c.dll (`python -m rustconv.c_oracle dll/win32/shlwapi`)
# and a copy of the test exe that imports it as shlwapc.dll; shlwapi is a KnownDLL, so the
# same-length rename is the only way in (see setupapiwinetestc/build.sh). Other DLLs the
# suite loads (shell32, ole32, ...) still bind the Rust shlwapi: only the exe's own calls
# reach the C. Diff the [APITEST:...] lines of the two runs.
name: shlwapiwinetestc
description: Wine shlwapi conformance suite against shlwapi's pre-flip C (the Rust port's oracle)

build_hint: "generate shlwapiwinetest's list first (its build_hint); bash tools/payloads/shlwapiwinetestc/build.sh {arch} does the rest"

binaries:
  - src: tools/payloads/apitest/apitest-sweep-{arch}.exe
    root: image
    dest: ProgramData/Microsoft/Windows/Start Menu/Programs/Startup/apitest-sweep.exe
  - src: tools/payloads/shlwapiwinetest/winetest-suites-{arch}.txt
    dest: bin/apitest-suites.txt
  - src: tools/payloads/shlwapiwinetest/winetest-skip-{arch}.txt
    dest: bin/apitest-skip.txt
  - src: tools/payloads/shlwapiwinetest/cwd.txt
    dest: bin/apitest-cwd.txt
  - src: tools/payloads/shlwapiwinetestc/shlwapi_winetest_c-{arch}.exe
    dest: bin/shlwapi_winetest.exe
  - src: tools/payloads/shlwapiwinetestc/shlwapi_c-{arch}.dll
    dest: bin/shlwapc.dll

test:
  launch_marker: "[APITEST-SWEEP] done"
  launch_drain_secs: 3600
  launch_idle_secs: 600
