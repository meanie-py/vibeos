# d3d8 (dll/directx/wine/d3d8 -> d3d8-rust). Smoke never loads Direct3D 8; this drives its
# front end over the same C wined3d: modes, the CheckDeviceFormat matrix, caps, render and
# texture-stage state (d3d8's stage states still carry the sampler states), transforms,
# resources, a declaration-only vertex shader through d3d8's own token parser, state blocks.
# One probe (probes/d3d8.c), staged twice: as d3d8_c.exe it loads the pre-flip C (d3d8_c.dll, from
# c_oracle.cmake) beside it, under any other name the system d3d8.dll. Both print values only,
# so the outputs must match byte for byte.
module: d3d8
variants:
  c: '%SystemRoot%\bin\modrun\d3d8_c.exe'
  rust: '%SystemRoot%\bin\modrun\d3d8_probe.exe'
ninja: [d3d8_c]
stage:
  - {src: 'tools/payloads/modrun/probes/d3d8-{arch}.exe', dest: bin/modrun/d3d8_c.exe}
  - {src: 'tools/payloads/modrun/probes/d3d8-{arch}.exe', dest: bin/modrun/d3d8_probe.exe}
  - {src: 'build-{arch}/dll/directx/wine/d3d8/d3d8_c.dll', dest: bin/modrun/d3d8_c.dll}
  # The device case: the same pair beside Mesa softpipe (tools/mesa/build-mesa.sh), which
  # wined3d's GL renderer accepts. opengl32 is not a KnownDLL, so the exe's directory wins.
  - {src: 'tools/payloads/modrun/probes/d3d8-{arch}.exe', dest: bin/modrun/gl/d3d8_c.exe}
  - {src: 'tools/payloads/modrun/probes/d3d8-{arch}.exe', dest: bin/modrun/gl/d3d8_probe.exe}
  - {src: 'build-{arch}/dll/directx/wine/d3d8/d3d8_c.dll', dest: bin/modrun/gl/d3d8_c.dll}
  - {src: '.cache/mesa/{arch}/opengl32.dll', dest: bin/modrun/gl/opengl32.dll}
  - {src: '.cache/mesa/{arch}/libgallium_wgl.dll', dest: bin/modrun/gl/libgallium_wgl.dll}
  - {src: '.cache/mesa/{arch}/libz-1.dll', dest: bin/modrun/gl/libz-1.dll}
cases:
  - id: logic
    expect: ['create 1', 'adapters 1', 'fmt 00000015 ', 'probe done']
    timeout: 300
  # A real device: state, resources and draws, read back. `expect` demands the device and a
  # draw, so a GL that wined3d refuses (falling back to no3d) fails here, not passes vacuously.
  - id: device
    arches: [amd64, arm64]  # i386: wined3d's GL init faults in Mesa (roadmap "Known bugs")
    variants:
      c: '%SystemRoot%\bin\modrun\gl\d3d8_c.exe'
      rust: '%SystemRoot%\bin\modrun\gl\d3d8_probe.exe'
    args: gl
    expect: ['renderer gl', 'create device hr=00000000', 'r triangle lock hr=00000000', 'probe done']
    timeout: 900
  # Only the out-of-range calls: stage 8, and the unused slots 0 and 12, which d3d8's C lookup
  # maps to WINED3D_TSS_INVALID (~0u). The C reads texture_states[0][0xffffffff] and faults;
  # the Rust rejects all four and leaves the value alone. (Before that fix it panicked:
  # index out of bounds, len 18, index 4294967295.)
  - id: device-invalid
    arches: [amd64, arm64]  # i386: wined3d's GL init faults in Mesa (roadmap "Known bugs")
    variants:
      c: '%SystemRoot%\bin\modrun\gl\d3d8_c.exe'
      rust: '%SystemRoot%\bin\modrun\gl\d3d8_probe.exe'
    args: gl invalid
    expect: ['renderer gl', 'create device hr=00000000', 'probe done']
    timeout: 600
    xfail: "the C oracle faults on GetTextureStageState(0, 0): texture_states[0][WINED3D_TSS_INVALID]"
