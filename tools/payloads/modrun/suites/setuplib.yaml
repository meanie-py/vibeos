# setuplib (base/setup/lib -> setuplib-rust). Ships only on the bootcd, so a probe drives it:
# base/setup/lib/modrun_probe.c, linked once against the Rust (setuplib_probe) and once against
# the pre-flip C (setuplib_probe_c, generated by c_oracle.cmake). Read-only: partitions are
# created and deleted in the in-memory list only.
module: setuplib
variants:
  c: '%SystemRoot%\bin\modrun\setuplib_probe_c.exe'
  rust: '%SystemRoot%\bin\modrun\setuplib_probe.exe'
ninja: [setuplib_probe, setuplib_probe_c]
stage:
  - {src: 'build-{arch}/base/setup/lib/setuplib_probe.exe', dest: bin/modrun/setuplib_probe.exe}
  - {src: 'build-{arch}/base/setup/lib/setuplib_probe_c.exe', dest: bin/modrun/setuplib_probe_c.exe}
cases:
  - id: probe
    expect: ['probe done', 'installdir "WINNT" 1', 'partlist destroyed']
    timeout: 120
    diverge:
      # GetSystemDisk only knows BIOS disk numbering; under UEFI (every modrun boot) the C
      # finds no system disk and the Rust takes the first fixed disk, which is what lets
      # setup install on UEFI at all (setuplib partlist.rs GetSystemDisk).
      - why: 'UEFI system disk'
        c: '^sysfind none$'
        rust: '^\s*sysfind (found|part )'
