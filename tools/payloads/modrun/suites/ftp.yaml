# ftp (base/applications/network/ftp -> ftp-rust). The shipped Rust diffed against the
# pre-flip C (`python -m rustconv.c_oracle`). No server in the guest, so every case drives the
# command scanner offline from stdin: main, cmdscanner, getcmd, help and the cmdtab, the
# toggles and status, and the hand-ported doproxy (its setjmp/longjmp became dead code or a
# flag; the C's mput/mget/mls bugs are fixed in the Rust but need a server to reach).
module: ftp
# amd64 was excluded until 2026-10-17: getservbyname("ftp", "tcp") failed there whenever the
# NIC's Tcpip\Parameters key existed, because mswsock then expanded an uninitialised block as
# the services directory (OpenNetworkDatabase; fixed in mswsock-rust).
variants:
  c: '%SystemRoot%\bin\modrun\ftp_c.exe'
  rust: '%SystemRoot%\system32\ftp.exe'
ninja:
- ftp_c
stage:
- src: build-{arch}/base/applications/network/ftp/ftp_c.exe
  dest: bin/modrun/ftp_c.exe
cases:
- id: help
  stdin:
  - help
  - quit
  expect:
  - Commands may be abbreviated.
- id: help_topics
  stdin:
  - help get put mls proxy nosuchcmd
  - help s
  - quit
- id: unknown_and_ambiguous
  stdin:
  - frobnicate
  - s
  - quit
- id: toggles_status
  stdin:
  - hash
  - bell
  - verbose
  - case
  - glob
  - prompt
  - status
  - quit
- id: not_connected
  stdin:
  - ls
  - mput a b
  - mget a
  - quit
- id: proxy
  stdin:
  - proxy
  - proxy nosuchcmd
  - proxy ls
  - proxy help
  - quit
- id: flags
  args: -n -i -g -v
  stdin:
  - status
  - quit
- id: bad_option
  args: -z
