[project]
name = "rustconv"
version = "0.1.0"
description = "C-to-Rust translation pipeline for ReactOS ntoskrnl"
requires-python = ">=3.10"
dependencies = [
    # PARSER VERSIONS ARE PINNED, not floored. These decide what every scanner and
    # `profile_derive` audit SEES, so two lanes on different versions can disagree
    # about the same file and both report honestly. On 2026-09-13 an audit ran under
    # a stray --user tree-sitter 0.26.0 while the venv held 0.25.2, and the "clean"
    # result had to be re-derived under the interpreter the gate actually uses. A
    # floor alone does not prevent that: a venv rebuilt on a later day resolves to
    # whatever is newest and diverges from the rest of the fleet silently. Same
    # reasoning as rust-toolchain.toml — pin what works, bump deliberately.
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-rust==0.24.1",
    "anthropic>=0.97",
    "openai>=2.0",
    "python-dotenv>=1.0",
    # rustconv.toml project anchor. tomllib is stdlib from 3.11; tomli is the backport.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]

[tool.setuptools.packages.find]
include = ["rustconv*"]

[tool.setuptools.package-data]
rustconv = ["../templates/*", "../data/*", "../data/pilots/*", "../data/difftest/*.json", "../data/difftest/*.md", "../data/difftest/*.rs", "../data/difftest/include/*", "../data/difftest/atoi64_include/*", "../data/difftest/strtoi64_include/*", "../data/difftest/wtoi64_include/*", "../data/difftest/wtoi64_include/internal/wine/*", "../data/difftest/strlwr_include/*", "../data/difftest/wcslwr_include/*", "../data/difftest/strdup_include/*", "../data/difftest/*.h", "../data/difftest/cryptlib_include/*"]
"rustconv.cpp_cohort" = ["*.rs", "*.cpp", "*.json", "*.md"]
"rustconv.c_cohort" = ["*.rs", "*.c", "*.json"]

[project.scripts]
rustconv = "rustconv.__main__:main"

# --- dev tooling: ruff (lint+format) / pyright (types) / pytest -------------
# One cohesive lint/format policy for the vibeos-cli tool surface.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
extend-exclude = [".responses", ".responses-backup-pre-c2rust"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # call in arg default — used deliberately (Path/None patterns)
    "SIM105", # contextlib.suppress over try/except/pass — try/except reads clearer
    "SIM108", # if-else over ternary — explicit blocks read clearer here
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode — we use →/—/✓ on purpose
]

[tool.ruff.lint.isort]
known-first-party = ["rustconv"]

[tool.pyright]
include = ["rustconv"]
exclude = ["**/node_modules", "**/__pycache__", "**/.responses", "**/.responses-backup-pre-c2rust"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
