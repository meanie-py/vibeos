      - sdk/lib/ucrt/locale/initnum.cpp
      - sdk/lib/ucrt/locale/inittime.cpp
      - sdk/lib/ucrt/locale/lcidtoname_downlevel.cpp
      - sdk/lib/ucrt/locale/LCMapStringA.cpp
      - sdk/lib/ucrt/locale/LCMapStringW.cpp
      - sdk/lib/ucrt/locale/lconv_unsigned_char_initialization.cpp
