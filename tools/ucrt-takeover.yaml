  output:
    replaces:
      - sdk/lib/ucrt/stdio/output.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export, each
      through a pair of variadic trampolines so both sides get a genuine va_list.
      A 142-format corpus (literals, every flag/width/precision/length, %c/%s/%Z
      narrow and wide, %p, the float conversions through inf/nan/DBL_MAX and a
      precision past the inline buffer, and the malformed formats the two
      transition tables disagree on) plus a 28-format positional corpus, through every
      function; the buffer functions across option bits and buffer sizes
      including NULL and too-small, _vsnprintf_s across count/max pairs, %n
      disabled and enabled at each width; the stream functions into a real file
      per side in binary, text and UTF-16LE modes. Graded: return, the whole
      buffer or file, errno from a sentinel, and the invalid-parameter count.
      All fourteen MATCH, dll_fail=0. Regraded with the strtod takeover (the
      reference restored for it) after a 28-format positional corpus added the
      no-whitespace width/position cases: vsprintf/vswprintf n=15196 each,
      vsnprintf_s/vsnwprintf_s n=7568, the _s and _p buffer forms n=6252, the six
      stream forms n=1272 each -- 78,168 cases.
    note: >
      A PORT of Microsoft's processor, not msvcrt's engine: UCRT's printf is a
      table-driven state machine with a standard and a validation table (the
      _s/_p functions), and they disagree on malformed formats that Wine's parser
      matches neither way. The three base classes are one runtime Base. Errno goes
      through a layout-identical __crt_cached_ptd_host (ptd_host.rs), because the
      C's errno semantics are the cache's: the handler sees the OLD errno, and
      guards restore the cache. __acrt_fp_format, _wctomb_internal,
      _mbtowc_internal, the _fputc/_fputwc_nolock_internal writes and the
      temporary-buffering hooks are called, not replaced.
    exports:
      - __stdio_common_vfprintf
      - __stdio_common_vfprintf_p
      - __stdio_common_vfprintf_s
      - __stdio_common_vfwprintf
      - __stdio_common_vfwprintf_p
      - __stdio_common_vfwprintf_s
      - __stdio_common_vsnprintf_s
      - __stdio_common_vsnwprintf_s
      - __stdio_common_vsprintf
      - __stdio_common_vsprintf_p
      - __stdio_common_vsprintf_s
      - __stdio_common_vswprintf
      - __stdio_common_vswprintf_p
      - __stdio_common_vswprintf_s

  strtod:
    replaces:
      - sdk/lib/ucrt/convert/strtod.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export over a
      ~120-string corpus -- boundaries of both types (DBL_MAX and one past it,
      the smallest normals and denormals, the round-to-even halfway points,
      float's overflow edge), exact 53-bit ties, a mantissa longer than the
      768 digits the parser keeps with the deciding digit after them, clamped
      exponents, every spelling of inf/nan/nan(snan)/nan(ind), hex floats with
      and without digits, and malformed tails -- plus, for the wide forms,
      Unicode decimal digits. Graded: the result's BITS, the end offset, errno
      from a sentinel, the invalid-parameter count, and NULL. All twelve MATCH,
      dll_fail=0: the narrow forms n=456 each, the wide n=484 -- 5,640 cases.
      Before the guest: 604,046 random and edge conversions matched Rust's own
      correctly-rounded parse::<f64>/<f32> bit for bit on the host.
    note: >
      A PORT of the parser and the big-integer conversion in
      corecrt_internal_strtox.h and corecrt_internal_big_integer.h. msvcrt's
      fpnum.rs is Wine's _MSVCR_VER=0 contract (no hex floats, no inf/nan words,
      no strtof). Built entirely from bits, so i386's no-SSE rule holds. The
      powers-of-ten table is computed by a const fn, checked element for element
      against Microsoft's packed literal. Rounding consults fegetround() exactly
      where the C does -- today ucrtbase's generated stub, round-to-nearest.
    exports:
      - _strtod_l
      - _strtof_l
      - _strtold_l
      - _wcstod_l
      - _wcstof_l
      - _wcstold_l
      - strtod
      - strtof
      - strtold
      - wcstod
      - wcstof
      - wcstold

  stat:
    replaces:
      - sdk/lib/ucrt/filesystem/stat.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export against
      a REAL fixture directory (read-only, .EXE/.cmd/.com, a 2040 date past the
      32-bit time_t, a subdirectory) built on the guest's system drive. The path
      forms take 36 paths each -- the fixture with and without trailing slashes,
      sub\. and sub\.., missing files, "C:\", "C:/", bare "C:", "C:.", "\",
      ".", "", a missing drive, NUL, CON, "\\x" -- plus NULL path and record;
      _stat64 adds a narrow path CP_ACP cannot map. _fstat takes each side's own
      descriptor for a disk file, NUL, a pipe with and without data, a closed
      one, the standard handles, -1/-2/-3 and out-of-range values. Graded: the
      return, errno, _doserrno, the invalid-parameter count and the whole record
      (prefilled, so padding shows). All twelve MATCH, dll_fail=0: the path
      forms n=195 (_stat64 n=200), _fstat n=105 -- 2,380 cases. Not reached: a
      real UNC share (no network in the guest) and a file over 2 GB (the
      EOVERFLOW arm), both transcribed.
    note: >
      A PORT. Every path is wide underneath; the narrow forms convert through
      findfile's __acrt_get_utf8_acp_compatibility_codepage converter. The four
      record layouts are one generic struct, pinned against offsets measured with
      the target compiler on all three arches; _fstat reads osfile/osfhnd from
      the lowio record at measured offsets (stdio_layout.rs).

      Silent-if-wrong details, each transcribed: a zero FILETIME is the FALLBACK
      (0 for the write time, the write time for the other two), not -1; a 32-bit
      st_size refuses a file over LONG_MAX with EOVERFLOW and a zeroed record,
      where _findfirst32 truncates; a pipe's size is PeekNamedPipe's count through
      a 32-bit _off_t; unopenable roots (C:\, \\server\share\) are fabricated as
      directories dated 1980-01-01; a bare "X:" is ENOENT even when it opens; a
      failed narrow conversion leaves the record untouched; _fstat(-2) is EBADF
      without the handler. The Win32 calls, _wfullpath, _getdrive,
      __loctotime*_t and the lowio lock are called, not replaced.
    exports:
      - _fstat32
      - _fstat32i64
      - _fstat64
      - _fstat64i32
      - _stat32
      - _stat32i64
      - _stat64
      - _stat64i32
      - _wstat32
      - _wstat32i64
      - _wstat64
      - _wstat64i32

  locale:
    replaces:
      - sdk/lib/ucrt/locale/CompareStringA.cpp
      - sdk/lib/ucrt/locale/CompareStringW.cpp
      - sdk/lib/ucrt/locale/ctype.cpp
      - sdk/lib/ucrt/locale/GetLocaleInfoA.cpp
      - sdk/lib/ucrt/locale/getqloc_downlevel.cpp
      - sdk/lib/ucrt/locale/GetStringTypeA.cpp
      - sdk/lib/ucrt/locale/get_qualified_locale.cpp
      - sdk/lib/ucrt/locale/glstatus.cpp
