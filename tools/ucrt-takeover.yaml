# Declared takeovers of genuine Microsoft UCRT bodies.
#
# ucrtbase.dll is still implemented, for 1,032 of its exports, by vendored
# Windows SDK source in `sdk/lib/ucrt` (455 files, 64,353 lines). We are
# replacing it family by family with Rust in `sdk/lib/rust/ucrt-rust` and
# deleting the C as each file's last export moves.
#
# Every one of those Rust bodies DISPLACES a Microsoft body — which is the exact
# shape of the accident `verify_ucrtbase_cohab.py` exists to prevent, and is
# invisible at link time because ucrtbase links with --allow-multiple-definition.
# The only thing separating the intended case from the accident is that somebody
# declared it and named the oracle that grades it. This file is that declaration.
#
# The gate reads it BOTH ways:
#   * a symbol in libcrt_shared_cargo.a that ucrtbase exports, that none of our
#     C on the link line defines, and that is NOT listed here -> failure
#   * a symbol listed here that the archive does not define -> failure, because a
#     stale declaration is how a list like this stops being read
#
# `tools/ucrt_burndown.py` reads the same file, so "how much Microsoft C is
# left" and "what have we claimed" cannot drift apart.
#
# Adding a family: implement it in ucrt-rust behind a cargo feature, enable that
# feature in crt-shared-cargo, add the block here with its oracle, and delete the
# Microsoft source files once they own no remaining export
# (`tools/ucrt_burndown.py --arch i386 --file <src>` says).

# The RATCHET. How many of ucrtbase's exports are still answered by vendored
# Microsoft C, per arch, as last recorded. `check()` fails if a build shows MORE
# than this — the count may march down, never up.
#
# Only an INCREASE fails, deliberately. A decrease is the point of the exercise,
# and it is regularly caused by ANOTHER lane landing a Rust body that happens to
# cover a ucrtbase export; failing on "better than recorded" would bounce lanes
# for improving the tree, which is how a gate gets switched off. A decrease
# prints a note asking for the ceiling below to be lowered by hand, to what
# `python3 tools/ucrt_burndown.py --arch <a>` reports as MICROSOFT.
#
# arm64 sits below the other two because a few exports are `-arch=!arm64` in the
# .spec and so are not exports there at all. Per-arch numbers, not one number,
# for exactly that reason.
burndown:
  i386: 745
  amd64: 745
  arm64: 742

families:
  bits:
    replaces:
      - sdk/lib/ucrt/stdlib/rotl.cpp
      - sdk/lib/ucrt/stdlib/rotr.cpp
      - sdk/lib/ucrt/stdlib/byteswap.cpp
      - sdk/lib/ucrt/stdlib/clang-hacks.s
    oracle: sdk/lib/rust/ucrt-rust/src/bits.rs (unit tests; total functions, no host state)
    note: >
      The pilot family, chosen because it has no semantic delta to argue about:
      total functions of their arguments, no locale, no errno, no stream state,
      no _MSVCR_VER history. It exists to prove the pipeline end to end — crate,
      archive, link, gate, burn-down — before the families that need real
      grading arrive.

      It removes more C than it adds. clang treats _rotl and friends as
      builtins, so the Microsoft C could not define them under our toolchain:
      the ucrt CMakeLists renamed each (-D_rotl=___rotl) and clang-hacks.s
      recreated the real symbol as an assembly jmp to the renamed body. Rust has
      no builtin to collide with, so the three .cpp and the whole .s workaround
      go together.
    exports:
      - _byteswap_uint64
      - _byteswap_ulong
      - _byteswap_ushort
      - _lrotl
      - _lrotr
      - _rotl
      - _rotl64
      - _rotr
      - _rotr64

  ismbbyte:
    replaces:
      - sdk/lib/ucrt/mbstring/ismbbyte.cpp
    oracle: >
      No dedicated winetest exists for this family in either suite, which is
      worth stating plainly rather than leaving implied. What grades it instead
      is that the whole family is one ~10-line generic over two tables whose
      CONTENTS are independently verified: the mbctype tables were regenerated
      from published DBCS codepage definitions and matched Microsoft's
      byte-for-byte, and the ctype table likewise from the Unicode Character
      Database (see docs/engineering/active-lanes/{mbctype,ctype}-table.md).
      So the data is checked even though the predicates are not.
    note: >
      The first LOCALE-AWARE takeover, and the reason locale_update had to come
      first: a NULL _locale_t means "the current thread's", so the 12 non-_l
      spellings are as dependent on per-thread data as the _l twins.

      Three things here are silent if wrong, all called out in the module: the
      C returns a LOGICAL or (1 or 0, not the masked bits) with _ismbbblank's
      literal-tab case the deliberate exception returning _BLANK; mbctype is
      257 entries indexed at 1 + byte; and the input is truncated to a byte
      before lookup. The missing null check on mbcinfo is transcribed, not
      fixed -- only _ismbbkana tests it in the C, and diverging would change
      behaviour callers were built against.
    exports:
      - _ismbbalnum
      - _ismbbalnum_l
      - _ismbbalpha
      - _ismbbalpha_l
      - _ismbbblank
      - _ismbbblank_l
      - _ismbbgraph
      - _ismbbgraph_l
      - _ismbbkalnum
      - _ismbbkalnum_l
      - _ismbbkana
      - _ismbbkana_l
      - _ismbbkprint
      - _ismbbkprint_l
      - _ismbbkpunct
      - _ismbbkpunct_l
      - _ismbblead
      - _ismbblead_l
      - _ismbbprint
      - _ismbbprint_l
      - _ismbbpunct
      - _ismbbpunct_l
      - _ismbbtrail
      - _ismbbtrail_l

  string:
    replaces:
      - sdk/lib/ucrt/string/i386/{strcat,strcspn,strlen,strncat,strncpy,strpbrk,strspn}.s
      - sdk/lib/ucrt/string/amd64/{strcat,strlen,strncat,strncpy}.s
      - sdk/lib/ucrt/string/amd64/{strcspn,strpbrk,strspn}.c
      - sdk/lib/ucrt/string/{strcat,strcspn,strncat,strncpy,strpbrk,strspn}.c
      - sdk/lib/ucrt/string/arm64/strlen.c
    oracle: >
      Tier 2, in the arm64 guest, against the genuine Microsoft UCRT objects:
      all eight MATCH in docs/engineering/active-lanes/ucrt-tier2-table.tsv
      (strcat/strcpy/strncat/strncpy/strpbrk by hand-written runners in
      ucrtdiff.c that compare each side's whole destination buffer, since the
      generator has no driver for writers or pointer returns). Also the host
      msvcrt-difftest against the genuine msvcrt C, which still grades these
      exact bodies because msvcrt-crt-rust links them from the same crate.
    note: >
      The first REUSED family: msvcrt.dll's shipping Rust, not new code. The
      bodies moved into crt-portable-rust so ucrtbase links them without ever
      depending on msvcrt-crt-rust, and both DLLs now carry the same objects.

      Admission needed MORE than a Tier 2 MATCH. The harness runs in the "C"
      locale, where locale-reading and locale-blind bodies agree; these nine
      are stateless in both implementations (no errno, no locale, no
      _MSVCR_VER branch), which is what makes the C-locale evidence general.
      _strlwr and atoi also MATCH and are NOT here for exactly that reason.

      One deliberate, documented divergence: ours treat a NULL string as ""
      (msvcrt's shipped, net-suite-proven behaviour -- see `nz` in
      crt-portable-rust), where Microsoft's fault. That only changes programs
      that would otherwise have crashed.

      strnlen is NOT here, and that is owed: Tier 2 runs on arm64, where
      Microsoft's strnlen.cpp defines nothing, so there is no in-guest evidence
      against Microsoft's body on the arches that have one. The i386 and amd64
      bodies being replaced are hand-written assembly; the msvcrt perf gate
      already holds these Rust bodies to single-pass parity with C.
    exports:
      - strcat
      - strcpy
      - strcspn
      - strlen
      - strncat
      - strncpy
      - strpbrk
      - strspn

  ctype:
    replaces:
      - sdk/lib/ucrt/convert/_ctype.cpp
      - sdk/lib/ucrt/convert/_wctype.cpp
      - sdk/lib/ucrt/convert/isctype.cpp
      - sdk/lib/ucrt/convert/iswctype.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: the shipping ucrtbase (these
      bodies) against the genuine Microsoft objects for the four deleted files, over
      the full 0..255 corpus plus edges that every single-argument ctype export gets
      (docs/engineering/active-lanes/ucrt-tier2-table.tsv). 59 of the 63 were
      graded that way, dll_fail=0 across all 12,121 cases of the run. The other
      four were NOT graded directly, and that is recorded rather than implied:
      iswctype and _iswctype_l (a wctype_t argument the generator had no kind for
      -- added since) are the single core every one of the 26 graded isw* exports
      runs through; _isblank_l and _iswblank_l are macros in the headers the
      generator reads, and share fast_check / iswctype with the graded forms.
    note: >
      A one-for-one PORT over LocaleUpdate, not msvcrt's bodies: those are Wine's
      contract, and on the multibyte path it differs from UCRT's in substance --
      Wine also requires c > 0 and classifies through GetStringTypeExA by LCID,
      UCRT through __acrt_GetStringTypeA by codepage. Every export is a one-line
      wrapper, so the port is smaller than an adapter would have been.

      Silent-if-wrong details, each transcribed: isblank/iswblank answer _BLANK for
      a literal tab first but _isblank_l does not; __iscsym casts to unsigned char
      and __iscsymf does not; every wide _l form ignores its locale; UCRT's wint_t
      is 16 bits. _pwctype and the __acrt_GetStringType* internals are still
      Microsoft's and are called, not replaced.
    exports:
      - __isascii
      - __iscsym
      - __iscsymf
      - __iswcsym
      - __iswcsymf
      - __toascii
      - _isalnum_l
      - _isalpha_l
      - _isblank_l
      - _iscntrl_l
      - _isctype
      - _isctype_l
      - _isdigit_l
      - _isgraph_l
      - _isleadbyte_l
      - _islower_l
      - _isprint_l
      - _ispunct_l
      - _isspace_l
      - _isupper_l
      - _iswalnum_l
      - _iswalpha_l
      - _iswblank_l
      - _iswcntrl_l
      - _iswcsym_l
      - _iswcsymf_l
      - _iswctype_l
      - _iswdigit_l
      - _iswgraph_l
      - _iswlower_l
      - _iswprint_l
      - _iswpunct_l
      - _iswspace_l
      - _iswupper_l
      - _iswxdigit_l
      - _isxdigit_l
      - isalnum
      - isalpha
      - isblank
      - iscntrl
      - isdigit
      - isgraph
      - isleadbyte
      - islower
      - isprint
      - ispunct
      - isspace
      - isupper
      - iswalnum
      - iswalpha
      - iswascii
      - iswblank
      - iswcntrl
      - iswctype
      - iswdigit
      - iswgraph
      - iswlower
      - iswprint
      - iswpunct
      - iswspace
      - iswupper
      - iswxdigit
      - isxdigit
  ismbc:
    replaces:
      - sdk/lib/ucrt/mbstring/ismbalnm.cpp
      - sdk/lib/ucrt/mbstring/ismbalph.cpp
      - sdk/lib/ucrt/mbstring/ismbdgt.cpp
      - sdk/lib/ucrt/mbstring/ismbgrph.cpp
      - sdk/lib/ucrt/mbstring/ismbknj.cpp
      - sdk/lib/ucrt/mbstring/ismblgl.cpp
      - sdk/lib/ucrt/mbstring/ismblwr.cpp
      - sdk/lib/ucrt/mbstring/ismbprn.cpp
      - sdk/lib/ucrt/mbstring/ismbpunc.cpp
      - sdk/lib/ucrt/mbstring/ismbsle.cpp
      - sdk/lib/ucrt/mbstring/ismbspc.cpp
      - sdk/lib/ucrt/mbstring/ismbupr.cpp
      - sdk/lib/ucrt/mbstring/mbbtype.cpp
      - sdk/lib/ucrt/mbstring/mbsbtype.cpp
      - sdk/lib/ucrt/mbstring/mbclevel.cpp
      - sdk/lib/ucrt/mbstring/mbtolwr.cpp
      - sdk/lib/ucrt/mbstring/mbtoupr.cpp
      - sdk/lib/ucrt/mbstring/mbtohira.cpp
      - sdk/lib/ucrt/mbstring/mbtokata.cpp
      - sdk/lib/ucrt/mbstring/tojisjms.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: the shipping ucrtbase (these
      bodies) against the genuine Microsoft objects for the 20 deleted files, 8
      shards on FROZEN inputs (see ucrt_tier2_sweep.run_shard -- without that, shards
      1-7 silently lost the family). 48 of the 52 graded dll=0 over every case, and
      dll_fail=0 across the whole run, so nothing else in ucrtbase moved either.
      The other four are recorded rather than implied. _ismbclegal and
      _ismbclegal_l FAULT on the ref_ side at c=-1, Microsoft's own out-of-bounds
      read (see the note), so the loop stops before grading; they are
      lead(c >> 8) && trail(c & 0xff) over the graded _ismbb* family, the same
      composition as _ismbcl0/1/2, which graded MATCH. _ismbcblank and
      _ismbcblank_l were never generated: the case generator parses the
      TOOLCHAIN's mingw-w64 headers, which do not declare them (owed, recorded in
      docs/product/vibeos-roadmap.md). They share the ismbc! body with the graded
      _ismbcpunct over the graded _ismbbblank_l.
    note: >
      A one-for-one PORT over LocaleUpdate, not msvcrt's bodies. Those are Wine's
      contract: Wine maps _MB_CP_SBCS to codepage 20127, where UCRT keeps codepage 0
      and answers single-byte questions from the C locale -- which is exactly why
      _ismbcgraph/print/punct/space/symbol graded DIFF on the rust_ side at tab and
      0xA0-0xFF while the shipping DLL matched.

      Silent-if-wrong details, each transcribed: the c <= 0xFF arm returns the
      single-byte primitive's value unnormalised (_ismbcdigit gives the raw _DIGIT
      mask, not 1); _ismbcprint tests _CONTROL with expected=false; the multibyte
      arm refuses a c that is two single-byte characters; _mbsbtype loops length+1
      times and raises the invalid-parameter handler for a NUL before the requested
      position but not at it; the Shift-JIS-only members answer 0 (or return c
      unchanged) on every other codepage. __acrt_GetStringTypeA and
      __acrt_LCMapStringA are still Microsoft's and are called, not replaced.

      One deliberate divergence: UCRT's mbstring C gets _ismbblead_l/_ismbbtrail_l
      as unmasked-index MACROS, so _ismbclegal(c) for c > 0xFFFF reads past the
      257-byte table (and faults at c=-1). Ours masks to a byte. Identical for
      every c <= 0xFFFF; undefined behaviour above it is not reproduced.
    exports:
      - _ismbcalnum
      - _ismbcalnum_l
      - _ismbcalpha
      - _ismbcalpha_l
      - _ismbcblank
      - _ismbcblank_l
      - _ismbcdigit
      - _ismbcdigit_l
      - _ismbcgraph
      - _ismbcgraph_l
      - _ismbchira
      - _ismbchira_l
      - _ismbckata
      - _ismbckata_l
      - _ismbcl0
      - _ismbcl0_l
      - _ismbcl1
      - _ismbcl1_l
      - _ismbcl2
      - _ismbcl2_l
      - _ismbclegal
      - _ismbclegal_l
      - _ismbclower
      - _ismbclower_l
      - _ismbcprint
      - _ismbcprint_l
      - _ismbcpunct
      - _ismbcpunct_l
      - _ismbcspace
      - _ismbcspace_l
      - _ismbcsymbol
      - _ismbcsymbol_l
      - _ismbcupper
      - _ismbcupper_l
      - _ismbslead
      - _ismbslead_l
      - _mbbtype
      - _mbbtype_l
      - _mbcjistojms
      - _mbcjistojms_l
      - _mbcjmstojis
      - _mbcjmstojis_l
      - _mbctohira
      - _mbctohira_l
      - _mbctokata
      - _mbctokata_l
      - _mbctolower
      - _mbctolower_l
      - _mbctoupper
      - _mbctoupper_l
      - _mbsbtype
      - _mbsbtype_l
  tocase:
    replaces:
      - sdk/lib/ucrt/convert/tolower_toupper.cpp
      - sdk/lib/ucrt/convert/towlower.cpp
      - sdk/lib/ucrt/convert/towupper.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest, 8 shards on frozen inputs: the
      shipping ucrtbase (these bodies) against the genuine Microsoft objects for the
      three deleted files. All 10 exports graded dll=0 over every generated case,
      plus run_ctype's hand-graded tolower/toupper rows over EOF and 0..255 (MATCH,
      n=514); dll_fail=0 across all 5,408 cases of the run. The burn-down moves by
      8, not 10, because it undecorates _tolower/tolower (and _toupper/toupper) to
      one name.
    note: >
      A one-for-one PORT over LocaleUpdate, not msvcrt's bodies: msvcrt's
      _tolower_l/_toupper_l DIFF against UCRT at the first case, EOF, which UCRT
      returns before resolving any locale.

      Silent-if-wrong details, each transcribed: only (unsigned)c < 256 takes the
      narrow table; the codepage lookup sets errno=EILSEQ whenever c is not a
      lead/trail pair and maps the low byte anyway; tolower/toupper are plain ASCII
      until a locale has ever been changed; _tolower/_toupper are unconditional
      arithmetic; _towlower_l/_towupper_l consult _wctype's UTF-16 category before
      the narrow map, and cover only ASCII in a UTF-8 locale. _wctype and the
      __acrt_LCMapString* internals are still Microsoft's and are called.
    exports:
      - _tolower
      - _tolower_l
      - _toupper
      - _toupper_l
      - _towlower_l
      - _towupper_l
      - tolower
      - toupper
      - towlower
      - towupper
  strtox:
    replaces:
      - sdk/lib/ucrt/convert/strtox.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest, 8 shards on frozen inputs: the
      shipping ucrtbase (these bodies) against the genuine Microsoft object. The
      harness graded only strtol/strtoul before this change -- the generator has no
      driver for (string, char**, base) -- so run_strtox_family/run_wcstox_family
      now grade ALL 32: value, end offset and errno, 39 inputs (the 64-bit limits,
      "0x"/"0X" with no digit, "-0", letters as digits, every isspace byte) at bases
      0/8/10/16/36/2, and for the wide forms nine more inputs a narrow parser never
      sees (fullwidth and Arabic-Indic digits, a fullwidth letter, U+3000 leading
      space). Narrow MATCH n=9828, wide MATCH n=13824, plus the legacy
      strtol/strtoul rows at dll=0; dll_fail=0 across all 29,146 cases of the run.
    note: >
      A PORT of __crt_strtox::parse_integer (corecrt_internal_strtox.h:222), the one
      template every export in the file wraps, with the accumulator width (32 for
      long, 64 for everything else) as a parameter. Not msvcrt's bodies: those are
      Wine's _MSVCR_VER=0 overflow contract and DIFF against UCRT on 14 of 598 cases.

      Silent-if-wrong details, each transcribed: *end is written to string first
      and to the final position last, so a no-digit parse leaves it at string with
      whitespace and sign unconsumed; "0x" with no hex digit is no digits at all;
      an unsigned result negates with wraparound and only a too-large magnitude
      sets ERANGE; wide digits include 17 Unicode decimal blocks (fullwidth,
      Arabic-Indic, ...) and wide whitespace is iswspace, locale-independent.
    exports:
      - _strtoi64
      - _strtoi64_l
      - _strtoimax_l
      - _strtol_l
      - _strtoll_l
      - _strtoui64
      - _strtoui64_l
      - _strtoul_l
      - _strtoull_l
      - _strtoumax_l
      - _wcstoi64
      - _wcstoi64_l
      - _wcstoimax_l
      - _wcstol_l
      - _wcstoll_l
      - _wcstoui64
      - _wcstoui64_l
      - _wcstoul_l
      - _wcstoull_l
      - _wcstoumax_l
      - strtoimax
      - strtol
      - strtoll
      - strtoul
      - strtoull
      - strtoumax
      - wcstoimax
      - wcstol
      - wcstoll
      - wcstoul
      - wcstoull
      - wcstoumax
  atox:
    replaces:
      - sdk/lib/ucrt/convert/atox.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest, 8 shards on frozen inputs. The
      generator graded these on a 7-string corpus (and _wtoll not at all: the
      toolchain headers lack it), so run_atox_family grades all 16 two-sided on
      value AND errno over the strtox corpus -- the 32/64-bit limits, whitespace,
      signs, letters -- plus Unicode digits for the wide forms and NULL through a
      counting invalid-parameter handler: MATCH n=1398, dll_fail=0 for the run.
    note: >
      Every export in atox.cpp is parse_integer_from_string<T>(string, nullptr, 10,
      locale) -- the strtox template at base 10 with no end pointer -- so each is a
      call into the strtox port. It inherits UCRT's atoi contract with it: atoi
      saturates at INT_MIN/INT_MAX with ERANGE (it parses as 32-bit long), and a
      NULL string raises the invalid-parameter handler and returns 0 with EINVAL.
    exports:
      - _atoi64
      - _atoi64_l
      - _atoi_l
      - _atol_l
      - _atoll_l
      - _wtoi
      - _wtoi64
      - _wtoi64_l
      - _wtoi_l
      - _wtol
      - _wtol_l
      - _wtoll
      - _wtoll_l
      - atoi
      - atol
      - atoll
  xtoa:
    replaces:
      - sdk/lib/ucrt/convert/xtoa.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest, 8 shards on frozen inputs. The
      harness graded none of xtoa.cpp before; run_xtoa_family and
      run_xtoa_s_family grade all 20 two-sided on the WHOLE 80-element buffer
      (FNV over every byte, so digits left behind a cleared buffer[0] count), the
      return value, errno and invalid-parameter handler calls: 20 values across
      both widths at radices 2/3/8/10/16/36 for the plain forms, and for _s also
      radix 0/1/37, counts 0..66 and a NULL buffer. Plain MATCH n=2400, _s MATCH
      n=50430; dll_fail=0 across all 59,170 cases of the run.
    note: >
      A PORT of common_xtox (the digit loop) and common_xtox_s (the checked front
      end), with the width a parameter. Silent-if-wrong details, each transcribed:
      only radix 10 is ever signed (_itoa(-1, b, 16) is "ffffffff"); digits above 9
      are lowercase; _s clears buffer[0] before its size and radix checks but after
      its NULL/zero-count checks; a too-small _s buffer is found inside the digit
      loop, so the digits written stay behind buffer[0]; the plain forms never check
      the radix (0 divides by zero, 1 never terminates -- in the C and here alike).
    exports:
      - _itoa
      - _itoa_s
      - _ltoa
      - _ltoa_s
      - _ultoa
      - _ultoa_s
      - _i64toa
      - _i64toa_s
      - _ui64toa
      - _ui64toa_s
      - _itow
      - _itow_s
      - _ltow
      - _ltow_s
      - _ultow
      - _ultow_s
      - _i64tow
      - _i64tow_s
      - _ui64tow
      - _ui64tow_s
  findfile:
    replaces:
      - sdk/lib/ucrt/filesystem/findfile.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest, against a REAL directory the
      harness builds: an empty file, a 1234-byte file dated 2001, a read-only
      file, a hidden one with spaces in its name, a subdirectory, and a file dated
      2040 (past the 32-bit time_t, so the __time32_t forms must answer -1). All 16
      first/next forms walk 9 patterns (wildcards, an exact name, no match, a
      missing directory, "", NULL) on both sides, each record compared byte for
      byte, plus errno and invalid-parameter counts; the NULL-record and 0/-1
      handle paths; and each side closes its own handles with its own _findclose.
      MATCH n=816, dll_fail=0. The DLL side is called through its IMPORT POINTER:
      the toolchain's io.h inlines _findfirst64i32/_findnext64i32 over
      _findfirst64, which pecheck caught -- a call by name graded mingw, not us.
    note: >
      A PORT. Every search is wide underneath; the narrow forms convert the pattern
      and the found name through __acrt_get_utf8_acp_compatibility_codepage. The
      eight record layouts are one generic struct, pinned by compile-time asserts
      against offsets measured with the target compiler on all three arches.

      Silent-if-wrong details, each transcribed: FILE_ATTRIBUTE_NORMAL reads back
      as 0; a zero FILETIME (or one the OS cannot convert) is -1, and times are
      LOCAL; a 32-bit size is the low word only; the narrow forms leak the find
      handle when the found name does not convert back (returning -1 having opened
      it); a NULL narrow pattern fails in the wide check, after the conversion;
      _findclose on a bad handle is a quiet EINVAL, never the invalid-parameter
      handler. The Win32 calls, __loctotime*_t, the conversion thunks and
      strcpy_s/wcscpy_s are called, not replaced.
    exports:
      - _findclose
      - _findfirst32
      - _findfirst32i64
      - _findfirst64
      - _findfirst64i32
      - _findnext32
      - _findnext32i64
      - _findnext64
      - _findnext64i32
      - _wfindfirst32
      - _wfindfirst32i64
      - _wfindfirst64
      - _wfindfirst64i32
      - _wfindnext32
      - _wfindnext32i64
      - _wfindnext64
      - _wfindnext64i32

  output:
    replaces:
      - sdk/lib/ucrt/stdio/output.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export, each
      through a pair of variadic trampolines so both sides get a genuine va_list.
      A 142-format corpus (literals, every flag/width/precision/length, %c/%s/%Z
      narrow and wide, %p, the float conversions through inf/nan/DBL_MAX and a
      precision past the inline buffer, and the malformed formats the two
      transition tables disagree on) plus a 28-format positional corpus, through every
      function; the buffer functions across option bits and buffer sizes
      including NULL and too-small, _vsnprintf_s across count/max pairs, %n
      disabled and enabled at each width; the stream functions into a real file
      per side in binary, text and UTF-16LE modes. Graded: return, the whole
      buffer or file, errno from a sentinel, and the invalid-parameter count.
      All fourteen MATCH, dll_fail=0. Regraded with the strtod takeover (the
      reference restored for it) after a 28-format positional corpus added the
      no-whitespace width/position cases: vsprintf/vswprintf n=15196 each,
      vsnprintf_s/vsnwprintf_s n=7568, the _s and _p buffer forms n=6252, the six
      stream forms n=1272 each -- 78,168 cases.
    note: >
      A PORT of Microsoft's processor, not msvcrt's engine: UCRT's printf is a
      table-driven state machine with a standard and a validation table (the
      _s/_p functions), and they disagree on malformed formats that Wine's parser
      matches neither way. The three base classes are one runtime Base. Errno goes
      through a layout-identical __crt_cached_ptd_host (ptd_host.rs), because the
      C's errno semantics are the cache's: the handler sees the OLD errno, and
      guards restore the cache. __acrt_fp_format, _wctomb_internal,
      _mbtowc_internal, the _fputc/_fputwc_nolock_internal writes and the
      temporary-buffering hooks are called, not replaced.
    exports:
      - __stdio_common_vfprintf
      - __stdio_common_vfprintf_p
      - __stdio_common_vfprintf_s
      - __stdio_common_vfwprintf
      - __stdio_common_vfwprintf_p
      - __stdio_common_vfwprintf_s
      - __stdio_common_vsnprintf_s
      - __stdio_common_vsnwprintf_s
      - __stdio_common_vsprintf
      - __stdio_common_vsprintf_p
      - __stdio_common_vsprintf_s
      - __stdio_common_vswprintf
      - __stdio_common_vswprintf_p
      - __stdio_common_vswprintf_s

  strtod:
    replaces:
      - sdk/lib/ucrt/convert/strtod.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export over a
      ~120-string corpus -- boundaries of both types (DBL_MAX and one past it,
      the smallest normals and denormals, the round-to-even halfway points,
      float's overflow edge), exact 53-bit ties, a mantissa longer than the
      768 digits the parser keeps with the deciding digit after them, clamped
      exponents, every spelling of inf/nan/nan(snan)/nan(ind), hex floats with
      and without digits, and malformed tails -- plus, for the wide forms,
      Unicode decimal digits. Graded: the result's BITS, the end offset, errno
      from a sentinel, the invalid-parameter count, and NULL. All twelve MATCH,
      dll_fail=0: the narrow forms n=456 each, the wide n=484 -- 5,640 cases.
      Before the guest: 604,046 random and edge conversions matched Rust's own
      correctly-rounded parse::<f64>/<f32> bit for bit on the host.
    note: >
      A PORT of the parser and the big-integer conversion in
      corecrt_internal_strtox.h and corecrt_internal_big_integer.h. msvcrt's
      fpnum.rs is Wine's _MSVCR_VER=0 contract (no hex floats, no inf/nan words,
      no strtof). Built entirely from bits, so i386's no-SSE rule holds. The
      powers-of-ten table is computed by a const fn, checked element for element
      against Microsoft's packed literal. Rounding consults fegetround() exactly
      where the C does -- today ucrtbase's generated stub, round-to-nearest.
    exports:
      - _strtod_l
      - _strtof_l
      - _strtold_l
      - _wcstod_l
      - _wcstof_l
      - _wcstold_l
      - strtod
      - strtof
      - strtold
      - wcstod
      - wcstof
      - wcstold

  stat:
    replaces:
      - sdk/lib/ucrt/filesystem/stat.cpp
    oracle: >
      Tier 2 --takeover-check, in the arm64 guest: one runner per export against
      a REAL fixture directory (read-only, .EXE/.cmd/.com, a 2040 date past the
      32-bit time_t, a subdirectory) built on the guest's system drive. The path
      forms take 36 paths each -- the fixture with and without trailing slashes,
      sub\. and sub\.., missing files, "C:\", "C:/", bare "C:", "C:.", "\",
      ".", "", a missing drive, NUL, CON, "\\x" -- plus NULL path and record;
      _stat64 adds a narrow path CP_ACP cannot map. _fstat takes each side's own
      descriptor for a disk file, NUL, a pipe with and without data, a closed
      one, the standard handles, -1/-2/-3 and out-of-range values. Graded: the
      return, errno, _doserrno, the invalid-parameter count and the whole record
      (prefilled, so padding shows). All twelve MATCH, dll_fail=0: the path
      forms n=195 (_stat64 n=200), _fstat n=105 -- 2,380 cases. Not reached: a
      real UNC share (no network in the guest) and a file over 2 GB (the
      EOVERFLOW arm), both transcribed.
    note: >
      A PORT. Every path is wide underneath; the narrow forms convert through
      findfile's __acrt_get_utf8_acp_compatibility_codepage converter. The four
      record layouts are one generic struct, pinned against offsets measured with
      the target compiler on all three arches; _fstat reads osfile/osfhnd from
      the lowio record at measured offsets (stdio_layout.rs).

      Silent-if-wrong details, each transcribed: a zero FILETIME is the FALLBACK
      (0 for the write time, the write time for the other two), not -1; a 32-bit
      st_size refuses a file over LONG_MAX with EOVERFLOW and a zeroed record,
      where _findfirst32 truncates; a pipe's size is PeekNamedPipe's count through
      a 32-bit _off_t; unopenable roots (C:\, \\server\share\) are fabricated as
      directories dated 1980-01-01; a bare "X:" is ENOENT even when it opens; a
      failed narrow conversion leaves the record untouched; _fstat(-2) is EBADF
      without the handler. The Win32 calls, _wfullpath, _getdrive,
      __loctotime*_t and the lowio lock are called, not replaced.
    exports:
      - _fstat32
      - _fstat32i64
      - _fstat64
      - _fstat64i32
      - _stat32
      - _stat32i64
      - _stat64
      - _stat64i32
      - _wstat32
      - _wstat32i64
      - _wstat64
      - _wstat64i32
