[symbols.future__makepath]
c_signature = "void future__makepath(char *path, const char *drive, const char *dir, const char *fname, const char *ext)"
family = "string"
slice_pattern = "makepath"
core_fn = "path::make"
return_collapse = "void"
inout_effects = "path = [drive[0] ':']? + dir + ('\\\\' iff dir non-empty & last not /\\\\)? + fname + ('.' iff ext[0]!='.')? + ext; always NUL-terminated; NULL path => no write"
preserved_misfeature = "NULL path = clean no-op; component skipped if NULL OR empty (X && X[0]); drive uses ONLY drive[0]+':'; dir always gets trailing '\\\\' unless already ended /\\\\ (forward slash preserved); fname bare-concat (no sep/dot); ext '.' prepended only if ext[0]!='.'; zero bounds checking"
reference = "sdk/lib/crt/stdlib/makepath.c"
fuzz_domain = ["all empty", "drive only", "dir w/o trailing sep", "dir w/ trailing \\\\", "dir w/ trailing /", "fname only", "ext leading dot", "ext no dot", "NULL each component", "empty-string component", "drive >1 char (only [0])", "full path", "NULL path no-op", "non-ASCII ± 😀"]

[symbols.future__memccpy]
c_signature = "void *future__memccpy(void *to, const void *from, int c, size_t count)"
family = "mem"
slice_pattern = "memccpy"
core_fn = "mem::ccpy"
return_collapse = "memccpy"
inout_effects = "to[0..=k] ← from[0..=k] where k = first index with from[k] matching c (return &to[k+1]) OR first NUL (return NULL) OR count-1 (return NULL); each byte copied before its test"
preserved_misfeature = "NUL test PRECEDES c test → c==0 always returns NULL (NUL break wins); the `t==c` match is signed-char `t` vs int `c` (memchr deal: byte 0x90 matches only c==-112, never 0x90); count==0 copies nothing → NULL"
reference = "sdk/lib/crt/mem/memccpy.c"
fuzz_domain = ["count==0", "c present (signed match)", "c absent", "NUL before c", "c==0 (→NULL via NUL precedence)", "c high-bit positive (no match)", "c negative (high byte match)", "c at last byte", "non-ASCII ± 😀"]

