schema_version = 1

[symbols.future__atoi64]
c_signature = "__int64 future__atoi64(const char *nptr)"
family = "radix"
slice_pattern = "nul_in"
core_fn = "radix::parse_i64_wrapping"
return_collapse = "i64_passthrough"
inout_effects = "none"
preserved_misfeature = "NULL→0; i64 wrapping accumulate, NO overflow error; no (int) trunc (unlike atoi)"
reference = "sdk/lib/crt/string/atoi64.c"
fuzz_domain = ["NULL", "empty", "ws+sign", "near i64::MAX", "i64 overflow wrap", "trailing junk", "no digits", "non-ASCII ± 😀"]

[symbols.future__i64toa]
c_signature = "char* future__i64toa(__int64 value, char *string, int radix)"
family = "radix"
slice_pattern = "int_to_str"
core_fn = "radix::format_radix"
return_collapse = "int2str"
inout_effects = "string ← '-'(iff radix==10&&value<0) + digits + NUL; no bounds check (caller ≥65 bytes); returns string"
preserved_misfeature = "no radix validation, no buffer-size check, no NULL guard (narrow memcpy is unconditional); sign only for radix==10, else i64 bit pattern as u64"
reference = "sdk/lib/crt/string/itoa.c"
fuzz_domain = ["value 0/±1/I64_MIN/I64_MAX", "radix 2/8/10/16/36", "neg+radix!=10 (unsigned reinterpret)", "non-ASCII ± 😀"]

[symbols.future__i64toa_s]
c_signature = "int future__i64toa_s(__int64 value, char *str, size_t size, int radix)"
family = "radix"
slice_pattern = "s_erange_n"
core_fn = "radix::format_radix"
return_collapse = "int2str"
inout_effects = "ok→str=sign+digits+NUL,ret 0; bad param→str[0]=0(if str&&size),ret 22; need>size→LSD-first reverse fill (sign skipped) then str[0]=0, ret 34"
preserved_misfeature = "ERANGE writes a right-aligned REVERSED partial (units-first) sans sign, then clobbers str[0]=NUL — not a clean truncation; _LIBCNT_ no errno"
reference = "sdk/lib/crt/string/itoa.c"
fuzz_domain = ["size {exact,exact-1,1,big,0}", "radix {2,10,16,36,1,37}", "value 0/±/I64_MIN/I64_MAX", "str=NULL", "non-ASCII ± 😀"]

