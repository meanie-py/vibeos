reference = "sdk/lib/crt/mem/memicmp.c"
fuzz_domain = ["n==0", "equal", "differ pre-fold", "differ only by case (→0)", "high-bit >=0x80 (never folded)", "differ at 0", "differ at n-1", "NULL s1/s2 with n!=0 (→_NLSCMPERROR)", "NULL with n==0 (→0)", "non-ASCII ± 😀"]

