[FREELOADER]
DefaultOS=LiveCD_SMP
; TimeOut=0: boot the default entry immediately. Was 5 (upstream default) —
; that's 5 wall-clock seconds of menu countdown paid by EVERY automated x86
; QEMU boot (smoke/gate/farm), measured inside the 27s freeldr "silent gap"
; (docs/engineering/performance-investigation.md). The arm64 boot config
; (qemu/freeldr.ini) has used TimeOut=0 all along.
TimeOut=0
; Freeldr's OWN debug output (distinct from the kernel /DEBUG options below).
; Enables the [FLDR] boot-phase stamps (ntldr/winldr.c) on COM1 so a
; host-timestamped serial log can attribute freeldr's load phase — with
; debug channels at their silent defaults this adds only those stamp lines
; (~a hundred short lines, negligible at QEMU serial speeds).
Debug=DEBUGPORT=COM1 BAUDRATE=115200

[Display]
TitleText=ReactOS LiveCD
MinimalUI=Yes

[Operating Systems]
LiveCD="LiveCD"
LiveCD_Debug="LiveCD (Debug)"
LiveCD_SMP="LiveCD SMP kernel (Debug)"
LiveCD_Macpi="LiveCD ACPI SMP (Debug)"
LiveCD_Aacpi="LiveCD ACPI APIC (Debug)"
LiveCD_VBoxDebug="LiveCD (VBox Debug)"
LiveCD_WinDbg="LiveCD (WinDbg KD on COM2)"
LiveCD_Screen="LiveCD (Screen)"
LiveCD_LogFile="LiveCD (Log file)"

[LiveCD]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

[LiveCD_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

; SMP bring-up entry (docs/engineering/active-lanes/smp-bringup-quest.md):
; boots the MP PAIR — ntkrnlmp.exe + halmp.dll (hal-rust's `smp` feature) — off
; the same media the UP entries use. Both flavors of both binaries ship on every
; build, so this is a menu pick, not a rebuild: freeldr loads the named files and
; registers halmp.dll under the name "hal.dll" in the loader block, so imports
; resolve unchanged (same mechanism as /HAL=halaacpi.dll below).
;
; NAMING THE HAL IS LOAD-BEARING, on all three arches. Booting ntkrnlmp.exe on
; the UP hal.dll is a real trap: x86 catches it late with MISMATCHED_HAL (0x79),
; and arm64 has no such handshake at all — it boots to a full desktop and
; silently runs on ONE cpu, because HalStartNextProcessor is the FALSE stub.
;
; THIS IS NOW THE DEFAULT (2026-09-12). The UP:=smp1 collapse criterion was met
; on all three arches; what held the flip back afterwards was boot reliability,
; not behaviour. Measured MP boot-failure rates, from
; ~/vibeos-flake-farm/conformance.jsonl over rows where `arch`, `smp == 1` and
; `mp_kernel` is TRUE. State that filter whenever you quote these. The same file
; holds 169 arm64 `--smp 1` rounds that PREDATE the `mp_kernel` field (first
; written 20260729-225529; all 169 are from 20260729 and carry no such key, and
; there is not one explicitly-False row among them). Their kernel is therefore
; UNRECORDED, not known-UP -- the timestamps put them before MP media existed, so
; they were very probably UP sweeps, but that is an inference and the file cannot
; confirm it. They fail at 11.8%, and blending them in yields a meaningless
; 2.72% that describes two different kernels at once:
;     amd64   0 /  203  = 0.00%   (95% upper bound ~1.5%)
;     i386    1 /  204  = 0.49%   0x1E, win32k.sys+0x65EE1
;     arm64  22 / 1375  = 1.60%   0x1E x18 (#39), 0xE3 x4 (#43)
; Those two arm64 codes are the ONLY ones in all 1375 MP rounds, which is what
; makes two KNOWN_FLAKES signatures sufficient rather than hopeful.
; The user's call was to stop soaking for a number that
; had not moved in months and let the whole fleet beta-test the MP kernel
; instead, eating the flakes in the open -- varied real boots sample conditions
; that a thousand identical soak rounds never will.
;
; The flakes are survivable because they are DOCUMENTED, not because they are
; rare: triage.KNOWN_FLAKES carries a narrow signature for each, so the gate
; retries that exact failure once and blocks on anything else. One retry takes
; gate disruption from ~1-in-42 to ~1-in-3200. Retire each signature when its
; root cause lands -- they are a licence to keep working, not to stop looking.
;
; [LiveCD_Debug] still ships and still boots the UP pair; it is now the opt-out.
[LiveCD_SMP]
BootType=Windows2003
SystemPath=\reactos
Options=/KERNEL=ntkrnlmp.exe /HAL=halmp.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_Macpi]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=halmacpi.dll /KERNEL=ntkrnlmp.exe /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_Aacpi]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=halaacpi.dll /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

; Real WinDbg kernel debugging: DEBUGPORT=COM2 is the kd64 opt-in (kdinit.rs) —
; the kdcom-serial wire transport claims COM2 for KD packets while COM1 stays
; the text console. Launch QEMU with a second -serial chardev and attach
; WinDbg com:port=...,baud=115200. (Per-boot alternative with no menu pick:
; --tripwire "KD=COM2".) crash-value lane; docs/engineering/crash-value-design.md.
[LiveCD_WinDbg]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM2 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveCD_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveCD_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

[LiveCD_LogFile]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
